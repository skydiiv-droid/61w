      --bg: #FAF7F0;
      --surface: #FFFFFF;
      --surface-alt: #F4F0E5;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.18);
      --text: #2A2826;
      --text-mute: #7A766F;
      --text-soft: #A8A39A;
      --accent: #5F5BAA;

      --c-full: #1F1B17;
      --c-morning: #2C5BB0;
      --c-closed: #C73E3E;

      --t-main-bg: #EEEDFE;  --t-main-text: #26215C;  --t-main-edge: #7F77DD;
      --t-A-bg:    #FAECE7;  --t-A-text:    #4A1B0C;  --t-A-edge:    #D85A30;
      --t-B-bg:    #EAF3DE;  --t-B-text:    #173404;  --t-B-edge:    #639922;
      --t-C-bg:    #FAEEDA;  --t-C-text:    #412402;  --t-C-edge:    #BA7517;
      --t-D-bg:    #FBEAF0;  --t-D-text:    #4B1528;  --t-D-edge:    #D4537E;
      --t-S-bg:    #E1F5EE;  --t-S-text:    #04342C;  --t-S-edge:    #1D9E75;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 15px; }

    #root {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ====== auth ====== */
    .auth-wrap { padding: 64px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
    .auth-title { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; margin: 0 0 4px; }
    .auth-sub { color: var(--text-mute); font-size: 14px; margin: 0 0 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--text-mute); font-weight: 500; }
    .field input, .field select {
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .btn-primary {
      padding: 14px; border: none; border-radius: 10px;
      background: var(--text); color: var(--bg); font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-ghost {
      padding: 12px; border: none; background: transparent;
      color: var(--text-mute); font-size: 14px;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .auth-error {
      padding: 10px 14px; background: #FCEBEB; color: #791F1F;
      border-radius: 8px; font-size: 13px;
    }

    /* ====== top bar ====== */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      background: var(--bg); position: sticky; top: 0; z-index: 10;
    }
    .top-bar-title {
      font-size: 17px; font-weight: 600; letter-spacing: -0.3px;
      display: flex; align-items: center; gap: 10px;
    }
    .top-bar-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: transparent; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--text);
    }
    .icon-btn:active { background: var(--surface-alt); }

    .month-nav { display: flex; align-items: center; gap: 6px; }
    .month-nav button {
      width: 28px; height: 28px; border: none; border-radius: 50%;
      background: transparent; color: var(--text-mute); font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .month-nav button:active { background: var(--surface-alt); }

    /* ====== calendar ====== */
    .cal-wrap { padding: 6px 8px 24px; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 4px 4px; }
    .cal-weekdays div {
      text-align: center; font-size: 11px; font-weight: 500;
      color: var(--text-soft); letter-spacing: 0.4px;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-cell {
      aspect-ratio: 1 / 1.15; min-height: 56px;
      border-radius: 8px; padding: 4px 4px 3px;
      display: flex; flex-direction: column; align-items: stretch;
      background: transparent; transition: background 0.1s; position: relative;
      border: none; outline: none; font: inherit; color: inherit;
      text-align: inherit; cursor: pointer; appearance: none; -webkit-appearance: none;

    .cal-cell.today { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); }
    .cal-cell:active { background: var(--surface-alt); }
    .cal-cell.empty { visibility: hidden; pointer-events: none; }
    .cal-date { font-size: 13px; font-weight: 500; text-align: center; letter-spacing: -0.2px; }
    .cal-date.full { color: var(--c-full); }

    .cal-date.closed { color: var(--c-closed); }

    .duty-pill {
      font-size: 13px; font-weight: 600; padding: 4px 0; width: 100%;
      text-align: center; border-radius: 6px; letter-spacing: 0.5px;
    }

    /* ====== modal ====== */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100; animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg); border-radius: 18px 18px 0 0;
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      padding: 18px 22px 32px; animation: slideUp 0.2s ease;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    }
    .modal-title { font-size: 17px; font-weight: 600; margin: 0; }
    .modal-close {
      width: 32px; height: 32px; border: none; background: transparent;
      font-size: 20px; color: var(--text-mute);
    }
    .modal-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }

    /* ====== duty input modal ====== */
    .duty-help {
      background: var(--surface-alt); border-radius: 10px;
      padding: 12px 14px; font-size: 12px; color: var(--text-mute); line-height: 1.6;

    .duty-help code {

    .duty-textarea {

    .day-counter { font-size: 12px; color: var(--text-mute); text-align: right; }

    /* ====== profile ====== */
    .profile-row {
      display: flex; justify-content: space-between; align-items: center;

    .profile-row:last-child { border-bottom: none; }
    .profile-label { color: var(--text-mute); font-size: 14px; }
    .profile-value { font-weight: 500; }
    .team-badge {
      display: inline-flex; align-items: center; padding: 3px 10px;

    /* ====== loading & empty ====== */
    .center-msg { padding: 80px 24px; text-align: center; color: var(--text-mute); font-size: 14px; }

    /* ====== fab ====== */
    .fab {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      padding: 13px 22px; background: var(--text); color: var(--bg);
      border: none; border-radius: 999px; font-size: 14px; font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18); z-index: 50;
    }
    .fab:active { transform: translateX(-50%) scale(0.96); }

    /* ====== profile menu ====== */
    .menu-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; border-bottom: 1px solid var(--border); background: transparent;
      border-left: none; border-right: none; border-top: none;
      width: 100%; text-align: left; font-size: 15px; color: var(--text);
    }
    .menu-item:active { color: var(--text-mute); }
    .menu-item.danger { color: var(--c-closed); }
    .menu-section-title {
      font-size: 12px; color: var(--text-soft); letter-spacing: 0.4px;
      margin: 18px 0 4px; font-weight: 500;
    }

    /* ====== day detail modal ====== */
    .day-modal-date {
      font-size: 22px; font-weight: 600; letter-spacing: -0.4px;
      margin: 0 0 2px;
    }
    .day-modal-date .weekday {
      font-size: 16px; font-weight: 500; color: var(--text-mute); margin-left: 6px;
    }
    .day-modal-date.morning .day-num { color: var(--c-morning); }
    .day-modal-date.closed .day-num { color: var(--c-closed); }
    .day-clinic-tag {
      font-size: 12px; color: var(--text-mute); margin-bottom: 16px;
    }
    .day-section {
      padding: 16px 0; border-top: 1px solid var(--border);
    }
    .day-section:first-of-type { border-top: none; padding-top: 8px; }
    .day-section-title {
      font-size: 12px; color: var(--text-soft); letter-spacing: 0.5px;
      font-weight: 500; margin: 0 0 12px; text-transform: uppercase;
    }
    .my-shift-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; background: var(--surface); border-radius: 12px;
      border: 1px solid var(--border);
    }
    .my-shift-card .shift-letter {
      font-size: 24px; font-weight: 700; letter-spacing: 1px;
    }
    .my-shift-card .shift-meta {
      font-size: 13px; color: var(--text-mute); text-align: right;
    }
    .my-shift-card .shift-meta .meta-team {
      display: inline-block; margin-left: 6px;
      padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    }

    .handover-row {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 8px 0;
    }
    .handover-arrow {
      flex-shrink: 0; width: 22px; text-align: center;
      color: var(--text-soft); font-size: 16px; line-height: 1.5;
    }
    .handover-info { flex: 1; min-width: 0; }
    .handover-meta {
      font-size: 11px; color: var(--text-soft); letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .handover-people {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .handover-empty {
      font-size: 13px; color: var(--text-soft); font-style: italic;
    }

    .person-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 500;
      border: 1px solid transparent;
    }
    .person-chip.me {
      box-shadow: inset 0 0 0 1.5px var(--text);
      font-weight: 600;
    }
    .person-chip .role-tag {
      font-size: 10px; opacity: 0.7; font-weight: 600; letter-spacing: 0.3px;
    }

    .lineup-team {
      display: flex; gap: 10px; padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .lineup-team:first-child { border-top: none; padding-top: 4px; }
    .lineup-team-label {
      flex-shrink: 0; width: 56px;
      display: flex; align-items: flex-start;
    }
    .lineup-team-label .team-badge {
      font-size: 11px; padding: 2px 8px;
    }
    .lineup-people {
      flex: 1; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0;
    }
  </style>

</head>

    import {

    // ============================================================

    const ADMIN_SABUN = "224051";
    const TEAMS = ["main", "A", "B", "C", "D", "S-616", "S-617", "S-act"];
    const SHIFT_CODES = ["D", "E", "N", "O", "T", "M", "V"];
    const SHIFT_LABELS = {
      D: "Day", E: "Evening", N: "Night", O: "Off",
      T: "Top", M: "Mid", V: "반차"
    };
    const HANDOVER_SHIFTS = ["D", "E", "N"];

    function teamColor(team) {
      if (team === "main") return { bg: "var(--t-main-bg)", text: "var(--t-main-text)", edge: "var(--t-main-edge)" };
      if (team === "A")    return { bg: "var(--t-A-bg)",    text: "var(--t-A-text)",    edge: "var(--t-A-edge)" };
      if (team === "B")    return { bg: "var(--t-B-bg)",    text: "var(--t-B-text)",    edge: "var(--t-B-edge)" };
      if (team === "C")    return { bg: "var(--t-C-bg)",    text: "var(--t-C-text)",    edge: "var(--t-C-edge)" };
      if (team === "D")    return { bg: "var(--t-D-bg)",    text: "var(--t-D-text)",    edge: "var(--t-D-edge)" };
      return { bg: "var(--t-S-bg)", text: "var(--t-S-text)", edge: "var(--t-S-edge)" };
    }

    // ============================================================
    // 공휴일 (2026-2027)
    // ============================================================
    const HOLIDAYS = {
      "2026-01-01": "신정",
      "2026-02-16": "설날", "2026-02-17": "설날", "2026-02-18": "설날",
      "2026-03-01": "삼일절", "2026-03-02": "삼일절 대체",
      "2026-05-05": "어린이날",
      "2026-05-24": "부처님오신날", "2026-05-25": "부처님오신날 대체",
      "2026-06-06": "현충일",
      "2026-08-15": "광복절", "2026-08-17": "광복절 대체",
      "2026-09-24": "추석", "2026-09-25": "추석", "2026-09-26": "추석", "2026-09-28": "추석 대체",
      "2026-10-03": "개천절", "2026-10-05": "개천절 대체",
      "2026-10-09": "한글날",
      "2026-12-25": "성탄절",
      "2027-01-01": "신정",
      "2027-02-06": "설날", "2027-02-07": "설날", "2027-02-08": "설날", "2027-02-09": "설날 대체",
      "2027-03-01": "삼일절",
      "2027-05-05": "어린이날",
      "2027-05-13": "부처님오신날",
      "2027-06-06": "현충일", "2027-06-07": "현충일 대체",
      "2027-08-15": "광복절", "2027-08-16": "광복절 대체",
      "2027-09-14": "추석", "2027-09-15": "추석", "2027-09-16": "추석",
      "2027-10-03": "개천절", "2027-10-04": "개천절 대체",
      "2027-10-09": "한글날", "2027-10-11": "한글날 대체",
      "2027-12-25": "성탄절",
    };

    function getClinicStatus(dateISO, dayOfWeek, overrides) {
      if (overrides && overrides[dateISO]) return overrides[dateISO];
      if (HOLIDAYS[dateISO]) return "closed";
      if (dayOfWeek === 0) return "closed";
      if (dayOfWeek === 6) return "morning";
      return "full";
    }

    async function hashPassword(sabun, password) {
      const data = new TextEncoder().encode(sabun + ":" + password);
      const buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function parseDutyString(raw) {
      const cleaned = raw.toUpperCase().replace(/\s+/g, "");
      const valid = new Set(SHIFT_CODES);
      const result = [];
      for (let i = 0; i < cleaned.length; i++) {
        const ch = cleaned[i];
        if (!valid.has(ch)) {
          throw new Error(`'${ch}' (${i + 1}번째 글자)는 사용할 수 없는 코드. 가능: ${SHIFT_CODES.join(", ")}`);
        }
        result.push(ch);
      }
      return result;
    }

    function formatHireDateInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 8);
      let out = digits;
      if (digits.length > 4) out = digits.slice(0, 4) + "." + digits.slice(4);
      if (digits.length > 6) out = digits.slice(0, 4) + "." + digits.slice(4, 6) + "." + digits.slice(6);
      if (digits.length === 8) out += ".";
      return out;
    }
    function hireDateToISO(formatted) {
      const digits = formatted.replace(/\D/g, "");
      if (digits.length !== 8) return null;
      return `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
    }
    function isoToHireDate(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${y}.${m}.${d}.`;
    }
    function formatPhone(value) {
      const d = value.replace(/\D/g, "").slice(0, 11);
      if (d.length < 4) return d;
      if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
      return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    }

    const WEEKDAYS_KR = ["일", "월", "화", "수", "목", "금", "토"];
    function getMonthInfo(year, month) {
      const first = new Date(year, month - 1, 1);
      const last = new Date(year, month, 0);
      return {
        first, last,
        daysInMonth: last.getDate(),
        startWeekday: first.getDay(),
      };
    }
    function isoDate(year, month, day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function todayInfo() {
      const now = new Date();
      return { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() };
    }
    function getMonthKey(year, month) {
      return `${year}-${String(month).padStart(2, "0")}`;
    }
    function adjacentMonthKey(year, month, offset) {
      const d = new Date(year, month - 1 + offset, 1);
      return getMonthKey(d.getFullYear(), d.getMonth() + 1);
    }
    function shiftDate(year, month, day, offset) {
      const d = new Date(year, month - 1, day + offset);
      return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
    }
    function getWeekday(year, month, day) {
      return new Date(year, month - 1, day).getDay();
    }

    function normalizeDuty(v) {
      if (!v) return null;
      if (typeof v === "string") return { shift: v };
      return v;
    }
    function getDutyAt(allDuties, monthKey, sabun, day) {
      const m = allDuties?.[monthKey];
      if (!m || !m[sabun]) return null;
      const dKey = String(day).padStart(2, "0");
      return normalizeDuty(m[sabun][dKey]);
    }
    function getEffectiveTeam(duty, fallbackTeam) {
      if (!duty) return fallbackTeam;
      if (duty.helper && duty.helper.team) return duty.helper.team;
      return duty.team || fallbackTeam;
    }
    function getPeopleByShift(allDuties, allUsers, monthKey, day, targetShift) {
      const m = allDuties?.[monthKey];
      if (!m) return [];
      const result = [];
      for (const sabun of Object.keys(m)) {
        const duty = getDutyAt(allDuties, monthKey, sabun, day);
        if (!duty) continue;
        if (duty.shift === targetShift) result.push(sabun);
      }
      return result;
    }
    function groupByEffectiveTeam(sabuns, allUsers, allDuties, monthKey, day) {
      const groups = {};
      for (const t of TEAMS) groups[t] = [];
      for (const sabun of sabuns) {
        const user = allUsers[sabun];
        if (!user) continue;
        const duty = getDutyAt(allDuties, monthKey, sabun, day);
        const team = getEffectiveTeam(duty, user.team);
        if (groups[team]) groups[team].push(sabun);
      }
      return groups;
    }

    function getHandoverConfig(myShift) {
      if (myShift === "D") return {
        prev: { offset: -1, shift: "N", labelTime: "어제 N" },
        next: { offset: 0, shift: "E", labelTime: "오늘 E" },
      };
      if (myShift === "E") return {
        prev: { offset: 0, shift: "D", labelTime: "오늘 D" },
        next: { offset: 0, shift: "N", labelTime: "오늘 N" },
      };
      if (myShift === "N") return {
        prev: { offset: 0, shift: "E", labelTime: "오늘 E" },
        next: { offset: 1, shift: "D", labelTime: "내일 D" },
      };
      return null;
    }

    const { useState, useEffect, useMemo, useRef } = React;
    const { createRoot } = ReactDOM;

    function App() {
      const [me, setMe] = useState(null);
      const [bootDone, setBootDone] = useState(false);

      useEffect(() => {
        (async () => {
          const saved = localStorage.getItem("61w-session");
          if (!saved) { setBootDone(true); return; }
          try {
            const { sabun } = JSON.parse(saved);
            const snap = await get(ref(db, `users/${sabun}`));
            if (snap.exists()) setMe({ sabun, ...snap.val() });
            else localStorage.removeItem("61w-session");
          } catch (e) {
            console.error(e);
            localStorage.removeItem("61w-session");
          }
          setBootDone(true);
        })();
      }, []);

      const handleLogin = (sabun, userData) => {
        localStorage.setItem("61w-session", JSON.stringify({ sabun }));
        setMe({ sabun, ...userData });
      };
      const handleLogout = () => {
        localStorage.removeItem("61w-session");
        setMe(null);
      };
      const handleProfileUpdate = (newData) => {
        setMe(prev => ({ ...prev, ...newData }));
      };

      if (!bootDone) return <div className="center-msg">불러오는 중…</div>;
      if (!me) return <AuthScreen onLogin={handleLogin} />;
      return <CalendarScreen me={me} onLogout={handleLogout} onProfileUpdate={handleProfileUpdate} />;
    }

    function AuthScreen({ onLogin }) {
      const [mode, setMode] = useState("login");
      return mode === "login"
        ? <LoginForm onLogin={onLogin} switchToSignup={() => setMode("signup")} />
        : <SignupForm onLogin={onLogin} switchToLogin={() => setMode("login")} />;
    }

    function LoginForm({ onLogin, switchToSignup }) {
      const [sabun, setSabun] = useState("");
      const [password, setPassword] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setErr("");
        if (!/^\d{5,6}$/.test(sabun)) return setErr("사번은 5~6자리 숫자여야 해요.");
        if (!password) return setErr("비밀번호를 입력해 주세요.");
        setBusy(true);
        try {
          const snap = await get(ref(db, `users/${sabun}`));
          if (!snap.exists()) {
            setErr("등록되지 않은 사번이에요. 회원가입을 먼저 해주세요.");
            setBusy(false); return;
          }
          const user = snap.val();
          const inputHash = await hashPassword(sabun, password);
          if (inputHash !== user.loginHash) {
            setErr("비밀번호가 일치하지 않아요.");
            setBusy(false); return;
          }
          onLogin(sabun, user);
        } catch (e) {
          console.error(e);
          setErr("로그인 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      return (
        <div className="auth-wrap">
          <div>
            <h1 className="auth-title">61w 듀티</h1>
            <p className="auth-sub">사번으로 로그인</p>
          </div>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div className="field">
              <label>사번</label>
              <input type="tel" inputMode="numeric" value={sabun}
                onChange={e => setSabun(e.target.value.replace(/\D/g, "").slice(0, 6))}
                placeholder="224051" autoComplete="username" />
            </div>
            <div className="field">
              <label>비밀번호</label>
              <input type="password" value={password}
                onChange={e => setPassword(e.target.value)} autoComplete="current-password" />
            </div>
            {err && <div className="auth-error">{err}</div>}
            <button type="submit" className="btn-primary" disabled={busy}>
              {busy ? "로그인 중…" : "로그인"}
            </button>
            <button type="button" className="btn-ghost" onClick={switchToSignup}>
              아직 계정이 없어요 · 회원가입
            </button>
          </form>
        </div>
      );
    }

    function SignupForm({ onLogin, switchToLogin }) {
      const [sabun, setSabun] = useState("");
      const [name, setName] = useState("");
      const [team, setTeam] = useState("A");
      const [hireDate, setHireDate] = useState("");
      const [phone, setPhone] = useState("");
      const [password, setPassword] = useState("");
      const [password2, setPassword2] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setErr("");
        if (!/^\d{5,6}$/.test(sabun)) return setErr("사번은 5~6자리 숫자여야 해요.");
        if (!name.trim()) return setErr("이름을 입력해 주세요.");
        if (!TEAMS.includes(team)) return setErr("팀을 선택해 주세요.");
        const hireISO = hireDateToISO(hireDate);
        if (!hireISO) return setErr("입사일은 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        if (password.length < 4) return setErr("비밀번호는 4자 이상이어야 해요.");
        if (password !== password2) return setErr("비밀번호가 일치하지 않아요.");

        setBusy(true);
        try {
          const existSnap = await get(ref(db, `users/${sabun}`));
          if (existSnap.exists()) {
            setErr("이미 등록된 사번이에요. 로그인 화면으로 가주세요.");
            setBusy(false); return;
          }
          if (sabun !== ADMIN_SABUN) {
            const wlSnap = await get(ref(db, `whitelist/${sabun}`));
            if (!wlSnap.exists()) {
              setErr("등록 권한이 없는 사번이에요. 관리자에게 문의해 주세요.");
              setBusy(false); return;
            }
          }
          const loginHash = await hashPassword(sabun, password);
          const userData = {
            name: name.trim(), team, hireDate: hireISO,
            phone: phone.replace(/\D/g, ""),
            loginHash, createdAt: Date.now(),
          };
          await set(ref(db, `users/${sabun}`), userData);
          onLogin(sabun, userData);
        } catch (e) {
          console.error(e);
          setErr("회원가입 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      return (
        <div className="auth-wrap">
          <div>
            <h1 className="auth-title">회원가입</h1>
            <p className="auth-sub">필수 정보를 입력해 주세요</p>
          </div>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div className="field">
              <label>사번</label>
              <input type="tel" inputMode="numeric" value={sabun}
                onChange={e => setSabun(e.target.value.replace(/\D/g, "").slice(0, 6))}
                placeholder="5~6자리 숫자" />
            </div>
            <div className="field">
              <label>이름</label>
              <input value={name} onChange={e => setName(e.target.value)} />
            </div>
            <div className="field">
              <label>팀</label>
              <select value={team} onChange={e => setTeam(e.target.value)}>
                {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div className="field">
              <label>입사일 (YYYYMMDD)</label>
              <input type="tel" inputMode="numeric" value={hireDate}
                onChange={e => setHireDate(formatHireDateInput(e.target.value))}
                placeholder="20230515" />
            </div>
            <div className="field">
              <label>전화번호</label>
              <input type="tel" inputMode="numeric" value={phone}
                onChange={e => setPhone(formatPhone(e.target.value))}
                placeholder="01012345678" />
            </div>
            <div className="field">
              <label>비밀번호</label>
              <input type="password" value={password}
                onChange={e => setPassword(e.target.value)} />
            </div>
            <div className="field">
              <label>비밀번호 확인</label>
              <input type="password" value={password2}
                onChange={e => setPassword2(e.target.value)} />
            </div>
            {err && <div className="auth-error">{err}</div>}
            <button type="submit" className="btn-primary" disabled={busy}>
              {busy ? "등록 중…" : "가입하기"}
            </button>
            <button type="button" className="btn-ghost" onClick={switchToLogin}>
              이미 계정이 있어요 · 로그인
            </button>
          </form>
        </div>
      );
    }

    function CalendarScreen({ me, onLogout, onProfileUpdate }) {
      const today = todayInfo();
      const [year, setYear] = useState(today.year);
      const [month, setMonth] = useState(today.month);

      const [allUsers, setAllUsers] = useState({});
      const [allDuties, setAllDuties] = useState({});
      const [clinicOverrides, setClinicOverrides] = useState({});

      const [showProfile, setShowProfile] = useState(false);
      const [showDutyInput, setShowDutyInput] = useState(false);
      const [openDay, setOpenDay] = useState(null);

      const monthKey = getMonthKey(year, month);
      const prevMonthKey = adjacentMonthKey(year, month, -1);
      const nextMonthKey = adjacentMonthKey(year, month, 1);

      useEffect(() => {
        const r = ref(db, "users");
        const unsub = onValue(r, snap => setAllUsers(snap.val() || {}));
        return () => unsub();
      }, []);

      useEffect(() => {
        const keys = [prevMonthKey, monthKey, nextMonthKey];
        const unsubs = keys.map(mk => {
          const r = ref(db, `duties/${mk}`);
          return onValue(r, snap => {
            setAllDuties(prev => ({ ...prev, [mk]: snap.val() || {} }));
          });
        });
        return () => unsubs.forEach(u => u());
      }, [prevMonthKey, monthKey, nextMonthKey]);

      useEffect(() => {
        const r = ref(db, "clinicHours");
        const unsub = onValue(r, snap => setClinicOverrides(snap.val() || {}));
        return () => unsub();
      }, []);

      const myDuties = useMemo(() => {
        const m = allDuties[monthKey];
        if (!m || !m[me.sabun]) return {};
        const out = {};
        Object.keys(m[me.sabun]).forEach(k => {
          const v = normalizeDuty(m[me.sabun][k]);
          if (v) out[parseInt(k, 10)] = v.shift;
        });
        return out;
      }, [allDuties, monthKey, me.sabun]);

      const goPrevMonth = () => {
        if (month === 1) { setYear(year - 1); setMonth(12); }
        else setMonth(month - 1);
      };
      const goNextMonth = () => {
        if (month === 12) { setYear(year + 1); setMonth(1); }
        else setMonth(month + 1);
      };
      const goToday = () => { setYear(today.year); setMonth(today.month); };

      const tColor = teamColor(me.team);

      return (
        <>
          <div className="top-bar">
            <div className="top-bar-title">
              <span>{me.name}</span>
              <span className="team-badge" style={{ background: tColor.bg, color: tColor.text }}>{me.team}</span>
            </div>
            <div className="top-bar-actions">
              <button className="icon-btn" onClick={() => setShowProfile(true)} aria-label="프로필">⚙︎</button>
            </div>
          </div>

          <div className="month-nav" style={{ padding: "10px 18px 4px", justifyContent: "center" }}>
            <button onClick={goPrevMonth} aria-label="이전 달">‹</button>
            <button onClick={goToday}
              style={{ width: "auto", padding: "0 14px", fontSize: 16, fontWeight: 600, color: "var(--text)" }}>
              {year}년 {month}월
            </button>
            <button onClick={goNextMonth} aria-label="다음 달">›</button>
          </div>

          <CalendarGrid
            year={year} month={month}
            duties={myDuties}
            clinicOverrides={clinicOverrides}
            today={today} myTeam={me.team}
            onCellClick={day => setOpenDay(day)}
          />

          <button className="fab" onClick={() => setShowDutyInput(true)}>
            ✎ {month}월 듀티 입력
          </button>

          {showProfile && (
            <ProfileModal me={me} onClose={() => setShowProfile(false)}
              onLogout={onLogout} onProfileUpdate={onProfileUpdate} />
          )}
          {showDutyInput && (
            <DutyInputModal year={year} month={month} sabun={me.sabun}
              myTeam={me.team} currentDuties={myDuties}
              onClose={() => setShowDutyInput(false)} />
          )}
          {openDay !== null && (
            <DayDetailModal
              year={year} month={month} day={openDay}
              me={me} allUsers={allUsers} allDuties={allDuties}
              clinicOverrides={clinicOverrides}
              onClose={() => setOpenDay(null)} />
          )}
        </>
      );
    }

    function CalendarGrid({ year, month, duties, clinicOverrides, today, myTeam, onCellClick }) {
      const { daysInMonth, startWeekday } = getMonthInfo(year, month);
      const tColor = teamColor(myTeam);

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="cal-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides);
        const isToday = (year === today.year && month === today.month && day === today.day);
        const shift = duties[day];
        const isHoliday = !!HOLIDAYS[iso];

        cells.push(
          <button key={day} className={`cal-cell ${isToday ? "today" : ""}`}
            onClick={() => onCellClick(day)} type="button">
            {isHoliday && <div className="holiday-dot" title={HOLIDAYS[iso]} />}
            <div className={`cal-date ${status}`}>{day}</div>
            <div className="duty-stack">
              {shift && (
                <div className="duty-pill"
                  style={shift === "O"
                    ? { background: "transparent", color: "var(--text-soft)", fontWeight: 500 }
                    : { background: tColor.bg, color: tColor.text }}>
                  {shift}
                </div>
              )}
            </div>
          </button>
        );
      }

      return (
        <div className="cal-wrap">
          <div className="cal-weekdays">
            {WEEKDAYS_KR.map((w, i) => (
              <div key={w} style={{
                color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
              }}>{w}</div>
            ))}
          </div>
          <div className="cal-grid">{cells}</div>
        </div>
      );
    }

    function DayDetailModal({ year, month, day, me, allUsers, allDuties, clinicOverrides, onClose }) {
      const monthKey = getMonthKey(year, month);
      const iso = isoDate(year, month, day);
      const dow = getWeekday(year, month, day);
      const clinic = getClinicStatus(iso, dow, clinicOverrides);
      const holiday = HOLIDAYS[iso];

      const myDuty = getDutyAt(allDuties, monthKey, me.sabun, day);
      const myShift = myDuty?.shift;
      const myEffectiveTeam = getEffectiveTeam(myDuty, me.team);

      const handover = HANDOVER_SHIFTS.includes(myShift) ? getHandoverConfig(myShift) : null;
      const showHandover = handover && me.team !== "main";

      let prevPeople = [], nextPeople = [];
      if (showHandover) {
        const pd = shiftDate(year, month, day, handover.prev.offset);
        const pmk = getMonthKey(pd.year, pd.month);
        const all = getPeopleByShift(allDuties, allUsers, pmk, pd.day, handover.prev.shift);
        prevPeople = all.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, pmk, s, pd.day);
          return getEffectiveTeam(d, u.team) === me.team;
        });

        const nd = shiftDate(year, month, day, handover.next.offset);
        const nmk = getMonthKey(nd.year, nd.month);
        const allN = getPeopleByShift(allDuties, allUsers, nmk, nd.day, handover.next.shift);
        nextPeople = allN.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, nmk, s, nd.day);
          return getEffectiveTeam(d, u.team) === me.team;
        });
      }

      const showLineup = HANDOVER_SHIFTS.includes(myShift);
      let lineup = null;
      if (showLineup) {
        const sabuns = getPeopleByShift(allDuties, allUsers, monthKey, day, myShift);
        lineup = groupByEffectiveTeam(sabuns, allUsers, allDuties, monthKey, day);
      }

      const dateColorClass = clinic === "morning" ? "morning" : clinic === "closed" ? "closed" : "full";
      const myTeamColor = teamColor(myEffectiveTeam);

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <p className={`day-modal-date ${dateColorClass}`} style={{ marginBottom: holiday ? 4 : 8 }}>
                  <span className="day-num">{month}월 {day}일</span>
                  <span className="weekday">({WEEKDAYS_KR[dow]})</span>
                </p>
                <p className="day-clinic-tag">
                  {holiday && <span style={{ color: "var(--c-closed)", fontWeight: 600 }}>{holiday} · </span>}
                  진료 {clinic === "full" ? "오전·오후" : clinic === "morning" ? "오전만" : "휴진"}
                </p>
              </div>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="day-section">
              <p className="day-section-title">내 근무</p>
              {myShift ? (
                <div className="my-shift-card">
                  <span className="shift-letter"
                    style={myShift === "O" ? { color: "var(--text-soft)" } : { color: myTeamColor.text }}>
                    {myShift}
                  </span>
                  <span className="shift-meta">
                    {SHIFT_LABELS[myShift]}
                    <span className="meta-team" style={{ background: myTeamColor.bg, color: myTeamColor.text }}>
                      {myEffectiveTeam}
                    </span>
                  </span>
                </div>
              ) : (
                <p style={{ color: "var(--text-soft)", fontSize: 13, margin: 0 }}>
                  이 날 듀티가 입력되지 않았어요.
                </p>
              )}
            </div>

            {showHandover && (
              <div className="day-section">
                <p className="day-section-title">{me.team}팀 인수인계</p>
                <HandoverRow direction="prev" config={handover.prev}
                  people={prevPeople} allUsers={allUsers} mySabun={me.sabun} myTeam={me.team} />
                <HandoverRow direction="next" config={handover.next}
                  people={nextPeople} allUsers={allUsers} mySabun={me.sabun} myTeam={me.team} />
              </div>
            )}

            {showLineup && lineup && (
              <div className="day-section">
                <p className="day-section-title">{myShift} 라인업</p>
                <LineupBlock lineup={lineup} mySabun={me.sabun} allUsers={allUsers}
                  monthKey={monthKey} day={day} allDuties={allDuties} />
              </div>
            )}

            {!showHandover && !showLineup && myShift && (
              <div className="day-section">
                <p style={{ fontSize: 13, color: "var(--text-soft)", margin: 0, textAlign: "center", padding: "8px 0" }}>
                  {me.team === "main"
                    ? "main 팀은 인수인계 표시가 없어요."
                    : "이 근무는 인수인계·라인업 표시가 없어요."}
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function HandoverRow({ direction, config, people, allUsers, mySabun, myTeam }) {
      const arrow = direction === "prev" ? "←" : "→";
      return (
        <div className="handover-row">
          <div className="handover-arrow">{arrow}</div>
          <div className="handover-info">
            <div className="handover-meta">
              {direction === "prev" ? "받음" : "넘김"} · {config.labelTime}
            </div>
            {people.length === 0 ? (
              <div className="handover-empty">
                {direction === "prev" ? "이전번 근무자가 없어요" : "다음번 근무자가 없어요"}
              </div>
            ) : (
              <div className="handover-people">
                {people.map(s => (
                  <PersonChip key={s} sabun={s} user={allUsers[s]} isMe={s === mySabun} teamForColor={myTeam} />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function LineupBlock({ lineup, mySabun, allUsers, monthKey, day, allDuties }) {
      return (
        <div>
          {TEAMS.map(team => {
            const sabuns = lineup[team] || [];
            if (sabuns.length === 0) return null;
            const c = teamColor(team);
            return (
              <div key={team} className="lineup-team">
                <div className="lineup-team-label">
                  <span className="team-badge" style={{ background: c.bg, color: c.text }}>{team}</span>
                </div>
                <div className="lineup-people">
                  {sabuns.map(s => {
                    const duty = getDutyAt(allDuties, monthKey, s, day);
                    const isHelper = !!duty?.helper;
                    return (
                      <PersonChip key={s}
                        sabun={s} user={allUsers[s]}
                        isMe={s === mySabun}
                        teamForColor={team}
                        isHelper={isHelper} />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function PersonChip({ sabun, user, isMe, teamForColor, isHelper }) {
      if (!user) {
        return <span className="person-chip" style={{
          background: "var(--surface-alt)", color: "var(--text-soft)"
        }}>{sabun}</span>;
      }
      const c = teamColor(teamForColor || user.team);
      return (
        <span className={`person-chip ${isMe ? "me" : ""}`}
          style={{ background: c.bg, color: c.text }}>
          {user.name}
          {isHelper && <span className="role-tag">helper</span>}
        </span>
      );
    }

    function DutyInputModal({ year, month, sabun, myTeam, currentDuties, onClose }) {
      const { daysInMonth } = getMonthInfo(year, month);

      const initial = useMemo(() => {
        let maxDay = 0;
        for (const k of Object.keys(currentDuties)) {
          const d = parseInt(k, 10);
          if (d > maxDay) maxDay = d;
        }
        let out = "";
        for (let d = 1; d <= maxDay; d++) out += currentDuties[d] || "";
        return out;
      }, []);

      const [text, setText] = useState(initial);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const parsed = useMemo(() => {
        try { return parseDutyString(text); } catch { return null; }
      }, [text]);

      const save = async () => {
        setErr("");
        let codes;
        try { codes = parseDutyString(text); }
        catch (e) { setErr(e.message); return; }
        if (codes.length > daysInMonth) {
          setErr(`이 달은 ${daysInMonth}일까지인데 ${codes.length}개가 입력됐어요.`);
          return;
        }
        setBusy(true);
        try {
          const monthKey = `${year}-${String(month).padStart(2, "0")}`;
          const updates = {};
          for (let d = 1; d <= daysInMonth; d++) {
            const dKey = String(d).padStart(2, "0");
            if (d <= codes.length) {
              updates[`duties/${monthKey}/${sabun}/${dKey}`] = { shift: codes[d - 1], team: myTeam };
            } else {
              updates[`duties/${monthKey}/${sabun}/${dKey}`] = null;
            }
          }
          await update(ref(db), updates);
          onClose();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 듀티 입력</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="modal-fields">
              <div className="duty-help">
                1일부터 순서대로 한 글자씩 입력. 공백/줄바꿈 무시.<br />
                <code>D</code> Day · <code>E</code> Evening · <code>N</code> Night · <code>O</code> Off · <code>T</code> Top · <code>M</code> Mid · <code>V</code> 반차
              </div>
              <textarea className="duty-textarea" value={text}
                onChange={e => setText(e.target.value)}
                placeholder="예: DENNOOD ENN OOD..." autoFocus />
              <div className="day-counter">
                {parsed ? `${parsed.length}일` : "—"} / {daysInMonth}일
              </div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy || !text.trim()}>
                {busy ? "저장 중…" : "저장"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ProfileModal({ me, onClose, onLogout, onProfileUpdate }) {
      const [editing, setEditing] = useState(false);
      const [showAdminWL, setShowAdminWL] = useState(false);
      const tColor = teamColor(me.team);
      const isAdmin = me.sabun === ADMIN_SABUN;

      if (editing) {
        return (
          <ProfileEdit me={me} onCancel={() => setEditing(false)}
            onSaved={(newData) => { onProfileUpdate(newData); setEditing(false); }} />
        );
      }
      if (showAdminWL) {
        return <WhitelistAdmin onClose={() => setShowAdminWL(false)} />;
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">내 정보</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div>
              <div className="profile-row">
                <span className="profile-label">사번</span>
                <span className="profile-value">{me.sabun}</span>
              </div>
              <div className="profile-row">
                <span className="profile-label">이름</span>
                <span className="profile-value">{me.name}</span>
              </div>
              <div className="profile-row">
                <span className="profile-label">팀</span>
                <span className="team-badge" style={{ background: tColor.bg, color: tColor.text }}>{me.team}</span>
              </div>
              <div className="profile-row">
                <span className="profile-label">입사일</span>
                <span className="profile-value">{isoToHireDate(me.hireDate)}</span>
              </div>
              <div className="profile-row">
                <span className="profile-label">전화번호</span>
                <span className="profile-value">{formatPhone(me.phone || "")}</span>
              </div>
            </div>
            <div className="modal-actions" style={{ marginTop: 18 }}>
              <button className="menu-item" onClick={() => setEditing(true)}>
                <span>정보 수정</span><span style={{ color: "var(--text-soft)" }}>›</span>
              </button>
              {isAdmin && (
                <button className="menu-item" onClick={() => setShowAdminWL(true)}>
                  <span>화이트리스트 관리</span><span style={{ color: "var(--text-soft)" }}>›</span>
                </button>
              )}
              <button className="menu-item danger" onClick={onLogout}>
                <span>로그아웃</span><span>›</span>
              </button>
            </div>
            <p style={{ fontSize: 11, color: "var(--text-soft)", textAlign: "center", marginTop: 24 }}>
              61w · Phase 2
            </p>
          </div>
        </div>
      );
    }

    function ProfileEdit({ me, onCancel, onSaved }) {
      const [name, setName] = useState(me.name);
      const [team, setTeam] = useState(me.team);
      const [hireDate, setHireDate] = useState(isoToHireDate(me.hireDate));
      const [phone, setPhone] = useState(formatPhone(me.phone || ""));
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const save = async () => {
        setErr("");
        if (!name.trim()) return setErr("이름을 입력해 주세요.");
        const hireISO = hireDateToISO(hireDate);
        if (!hireISO) return setErr("입사일은 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        setBusy(true);
        try {
          const newData = {
            name: name.trim(), team, hireDate: hireISO,
            phone: phone.replace(/\D/g, ""),
          };
          await update(ref(db, `users/${me.sabun}`), newData);
          onSaved(newData);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onCancel}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">정보 수정</h2>
              <button className="modal-close" onClick={onCancel} aria-label="닫기">×</button>
            </div>
            <div className="modal-fields">
              <div className="field">
                <label>이름</label>
                <input value={name} onChange={e => setName(e.target.value)} />
              </div>
              <div className="field">
                <label>팀</label>
                <select value={team} onChange={e => setTeam(e.target.value)}>
                  {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="field">
                <label>입사일 (YYYYMMDD)</label>
                <input type="tel" inputMode="numeric" value={hireDate}
                  onChange={e => setHireDate(formatHireDateInput(e.target.value))} />
              </div>
              <div className="field">
                <label>전화번호</label>
                <input type="tel" inputMode="numeric" value={phone}
                  onChange={e => setPhone(formatPhone(e.target.value))} />
              </div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy}>
                {busy ? "저장 중…" : "저장"}
              </button>
              <button className="btn-ghost" onClick={onCancel}>취소</button>
            </div>
          </div>
        </div>
      );
    }

    function WhitelistAdmin({ onClose }) {
      const [list, setList] = useState([]);
      const [bulkText, setBulkText] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        const r = ref(db, "whitelist");
        const unsub = onValue(r, snap => {
          const val = snap.val() || {};
          setList(Object.keys(val).sort());
        });
        return () => unsub();
      }, []);

      const addBulk = async () => {
        setErr("");
        const parts = bulkText.split(/[\s,;\n]+/).map(s => s.trim()).filter(Boolean);
        const invalid = parts.filter(s => !/^\d{5,6}$/.test(s));
        if (invalid.length) { setErr(`잘못된 사번: ${invalid.join(", ")}`); return; }
        if (!parts.length) { setErr("추가할 사번을 입력해 주세요."); return; }
        setBusy(true);
        try {
          const updates = {};
          parts.forEach(s => { updates[`whitelist/${s}`] = true; });
          await update(ref(db), updates);
          setBulkText("");
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const remove1 = async (sabun) => {
        if (!confirm(`${sabun} 화이트리스트에서 제거할까요? (이미 가입한 계정은 그대로 유지됨)`)) return;
        try { await remove(ref(db, `whitelist/${sabun}`)); }
        catch (e) { console.error(e); alert("삭제 실패"); }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">화이트리스트</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="duty-help" style={{ marginBottom: 14 }}>
              가입 가능한 사번 명단. 줄바꿈/콤마/공백으로 구분해 한꺼번에 추가할 수 있어요.
              <br />본인(<code>{ADMIN_SABUN}</code>)은 자동으로 항상 가입 가능.
            </div>
            <div className="field" style={{ marginBottom: 8 }}>
              <textarea className="duty-textarea"
                style={{ letterSpacing: 0, textTransform: "none" }}
                value={bulkText} onChange={e => setBulkText(e.target.value)}
                placeholder="123456&#10;234567&#10;345678&#10;..." />
            </div>
            {err && <div className="auth-error" style={{ marginBottom: 10 }}>{err}</div>}
            <button className="btn-primary" onClick={addBulk} disabled={busy} style={{ marginBottom: 20 }}>
              {busy ? "추가 중…" : "추가"}
            </button>
            <p className="menu-section-title">현재 명단 ({list.length}명)</p>
            {list.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                아직 등록된 사번이 없어요.
              </p>
            ) : (
              <div>
                {list.map(s => (
                  <div key={s} className="profile-row">
                    <span className="profile-value" style={{ fontFamily: "ui-monospace, monospace" }}>{s}</span>
                    <button className="icon-btn" onClick={() => remove1(s)}
                      style={{ color: "var(--c-closed)" }} aria-label="삭제">×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW 등록 실패:", err));
      });
    }
  </script>

</body>
</html>
