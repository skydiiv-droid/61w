    // ============================================================
    // <OffAdminSummary> — 사람 기준 OFF 신청 요약 (admin)
    // ============================================================
    function OffAdminSummary({ year, month, allUsers, allRequests, seniority, onClose }) {
      const nm = nextMonthInfo(year, month);
      const nmk = nextMonthKey(year, month);
      const monthData = allRequests?.[nmk] || {};

      // 팀별 사용자 그룹핑 (입사일 순 — 명세상)
      const groups = useMemo(
        () => groupUsersByTeam(allUsers, seniority),
        [allUsers, seniority]
      );

      // 사람별 요약 — "7일 OFF, 8일 OFF, 16일 D" 형태
      const summarizePerson = (sabun) => {
        const sabunData = monthData[sabun];
        if (!sabunData) return null;
        const entries = Object.entries(sabunData)
          .map(([k, v]) => ({ day: parseInt(k, 10), type: v.type, timestamp: v.timestamp }))
          .sort((a, b) => a.day - b.day);
        if (entries.length === 0) return null;
        return entries.map(e => `${e.day}일 ${e.type}`).join(", ");
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{nm.month}월 OFF 현황 요약</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 12px" }}>
              팀별 입사일 순. 신청한 내용이 한 줄로 표시돼요.
            </p>

            {TEAMS.map(team => {
              const list = groups[team] || [];
              if (list.length === 0) return null;
              const c = teamColor(team);
              return (
                <div key={team} className="seniority-team-section">
                  <div className="seniority-team-header">
                    <span className="team-badge" style={{ background: c.bg, color: c.text }}>{team}</span>
                    <span style={{ fontSize: 12, color: "var(--text-soft)" }}>{list.length}명</span>
                  </div>
                  {list.map(u => {
                    const summary = summarizePerson(u.sabun);
                    return (
                      <div key={u.sabun} style={{
                        padding: "8px 0", borderBottom: "1px solid var(--border)",
                        fontSize: 13,
                      }}>
                        <span style={{ fontWeight: 600, marginRight: 8 }}>{u.name}</span>
                        {summary ? (
                          <span style={{ color: "var(--text-mute)" }}>{summary}</span>
                        ) : (
                          <span style={{ color: "var(--text-soft)", fontStyle: "italic" }}>신청 안 함</span>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ============================================================
    // <DutyStats> — 듀티 통계 모달
    // ============================================================
    function getMonthKeysForRange(today, range) {
      const y = today.year, m = today.month;
      const back = (n) => {
        const d = new Date(y, m - 1 - n, 1);
        return getMonthKey(d.getFullYear(), d.getMonth() + 1);
      };
      if (range === "this") return [getMonthKey(y, m)];
      if (range === "prev") return [back(1)];
      return [back(2), back(1), back(0)]; // 시간순
    }

    function DutyStats({ me, allUsers, allDuties, seniority, clinicOverrides, dbHolidays, admins, onClose }) {
      const today = todayInfo();
      const [range, setRange] = useState("this");
      const [targetSabun, setTargetSabun] = useState(me.sabun);
      const [dutiesData, setDutiesData] = useState(allDuties);
      const [loading, setLoading] = useState(false);

      const isAdmin = isAdminUser(me, admins);
      const monthKeys = useMemo(() => getMonthKeysForRange(today, range), [range, today.year, today.month]);

      // 구독 안 된 달 보충 fetch
      useEffect(() => {
        let cancelled = false;
        (async () => {
          const missing = monthKeys.filter(mk => !allDuties[mk]);
          if (missing.length === 0) {
            setDutiesData(allDuties);
            return;
          }
          setLoading(true);
          try {
            const snaps = await Promise.all(missing.map(mk => get(ref(db, `duties/${mk}`))));
            if (cancelled) return;
            const merged = { ...allDuties };
            missing.forEach((mk, i) => { merged[mk] = snaps[i].val() || {}; });
            setDutiesData(merged);
          } catch (e) {
            console.error(e);
            setDutiesData(allDuties);
          }
          setLoading(false);
        })();
        return () => { cancelled = true; };
      }, [monthKeys.join(","), allDuties]);

      const stats = useMemo(
        () => computeDutyStats(monthKeys, targetSabun, dutiesData, allUsers, clinicOverrides, dbHolidays),
        [monthKeys, dutiesData, allUsers, targetSabun, clinicOverrides, dbHolidays]
      );

      const userGroups = useMemo(
        () => groupUsersByTeam(allUsers, seniority),
        [allUsers, seniority]
      );

      const targetUser = allUsers[targetSabun];
      const targetTeam = targetUser?.team;

      const periodLabel = range === "this" ? `${today.year}년 ${today.month}월`
        : range === "prev" ? "지난 달"
        : "최근 3개월";

      if (!stats) {
        return (
          <div className="modal-backdrop" onClick={onClose}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <h2 className="modal-title">📊 듀티 통계</h2>
                <button className="modal-close" onClick={onClose}>×</button>
              </div>
              <div className="stats-empty">대상 사용자를 찾을 수 없어요.</div>
            </div>
          </div>
        );
      }

      const maxCount = Math.max(
        stats.shiftCounts.D, stats.shiftCounts.E, stats.shiftCounts.N,
        stats.shiftCounts.O, stats.shiftCounts.V, stats.shiftCounts.M, 1
      );
      const weekendTotal = stats.weekend.D + stats.weekend.E + stats.weekend.N;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">📊 듀티 통계</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            {/* 대상 선택 (admin만) */}
            {isAdmin ? (
              <div className="stats-target">
                <select value={targetSabun} onChange={e => setTargetSabun(e.target.value)}>
                  <option value={me.sabun}>{me.name} (나)</option>
                  {TEAMS.map(team => {
                    const list = userGroups[team] || [];
                    const others = list.filter(u => u.sabun !== me.sabun);
                    if (others.length === 0) return null;
                    return (
                      <optgroup key={team} label={`${team}팀`}>
                        {others.map(u => (
                          <option key={u.sabun} value={u.sabun}>{u.name}</option>
                        ))}
                      </optgroup>
                    );
                  })}
                </select>
                {targetSabun !== me.sabun && targetUser && (
                  <p style={{ fontSize: 11, color: "var(--text-soft)", margin: "6px 0 0" }}>
                    {targetUser.name} · {targetTeam} · {targetUser.hireDate || "입사일 미입력"}
                  </p>
                )}
              </div>
            ) : (
              <div style={{ marginBottom: 12, fontSize: 13, color: "var(--text-mute)" }}>
                {me.name} 본인 통계
              </div>
            )}

            {/* 기간 선택 */}
            <div className="stats-period-row">
              <button className={range === "this" ? "active" : ""} onClick={() => setRange("this")}>
                이번 달
              </button>
              <button className={range === "prev" ? "active" : ""} onClick={() => setRange("prev")}>
                지난 달
              </button>
              <button className={range === "3m" ? "active" : ""} onClick={() => setRange("3m")}>
                최근 3개월
              </button>
            </div>

            <p style={{ fontSize: 11, color: "var(--text-soft)", textAlign: "center", margin: "0 0 14px" }}>
              {periodLabel} · 입력된 듀티 {stats.totalDays}일
            </p>

            {loading && <div className="stats-loading">데이터 불러오는 중…</div>}

            {!loading && stats.totalDays === 0 && (
              <div className="stats-empty">이 기간에 입력된 듀티가 없어요.</div>
            )}

            {!loading && stats.totalDays > 0 && (
              <>
                {/* 시프트 카운트 */}
                <div className="stats-card">
                  <p className="stats-card-title">시프트 분포</p>
                  <div className="stats-shift-grid">
                    {["D", "E", "N", "O", "V", "M"].map(s => {
                      const n = stats.shiftCounts[s] || 0;
                      if (n === 0 && (s === "V" || s === "M")) return null;
                      const c = shiftColor(s);
                      return (
                        <div key={s} className="stats-shift-cell" style={{ background: c.bg, color: c.text }}>
                          <div className="num">{n}</div>
                          <div className="lbl">{s} · {SHIFT_LABELS[s] || s}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 막대 그래프 */}
                <div className="stats-card">
                  <p className="stats-card-title">시각화</p>
                  {["D", "E", "N", "O", "V", "M"].map(s => {
                    const n = stats.shiftCounts[s] || 0;
                    if (n === 0 && (s === "V" || s === "M")) return null;
                    const c = shiftColor(s);
                    const pct = maxCount > 0 ? (n / maxCount * 100) : 0;
                    return (
                      <div key={s} className="stats-bar-row">
                        <span className="bar-label" style={{ color: c.text, fontWeight: 600 }}>{s}</span>
                        <div className="bar-track">
                          <div className="bar-fill" style={{ width: `${pct}%`, background: c.bg }} />
                        </div>
                        <span className="bar-num">{n}</span>
                      </div>
                    );
                  })}
                </div>

                {/* 패턴 */}
                <div className="stats-card">
                  <p className="stats-card-title">근무 패턴</p>
                  <div className="stats-big-row">
                    <span className="label">토요일 근무</span>
                    <span className="value">{weekendTotal}일</span>
                  </div>
                  {weekendTotal > 0 && (
                    <div style={{ fontSize: 11, color: "var(--text-soft)", padding: "0 0 6px" }}>
                      D {stats.weekend.D} · E {stats.weekend.E} · N {stats.weekend.N}
                    </div>
                  )}
                  <div className="stats-big-row">
                    <span className="label">공휴일/일요일 근무</span>
                    <span className="value">{stats.holidayWork}일</span>
                  </div>
                  <div className="stats-big-row">
                    <span className="label">최대 연속 근무</span>
                    <span className="value">{stats.maxWorkStreak}일</span>
                  </div>
                  <div className="stats-big-row">
                    <span className="label">최대 연속 OFF</span>
                    <span className="value">{stats.maxOffStreak}일</span>
                  </div>
                </div>

                {/* 같이 일한 top 3 */}
                <div className="stats-card">
                  <p className="stats-card-title">가장 자주 같이 일한 사람</p>
                  <p style={{ fontSize: 10, color: "var(--text-soft)", margin: "-6px 0 8px" }}>
                    같은 팀에서 D/E/N 함께한 횟수
                  </p>
                  {stats.coworkTop.length === 0 ? (
                    <div className="stats-empty">데이터 없음</div>
                  ) : (
                    stats.coworkTop.map(([sabun, count], i) => {
                      const u = allUsers[sabun];
                      if (!u) return null;
                      const c = teamColor(u.team);
                      return (
                        <div key={sabun} className="stats-person-row">
                          <span className="rank">{i + 1}</span>
                          <span className="team-badge" style={{ background: c.bg, color: c.text, fontSize: 10, padding: "2px 6px" }}>
                            {u.team}
                          </span>
                          <span className="name">{u.name}</span>
                          <span className="count">{count}일</span>
                        </div>
                      );
                    })
                  )}
                </div>

                {/* 공동 OFF top 3 */}
                <div className="stats-card">
                  <p className="stats-card-title">가장 자주 같이 OFF인 사람</p>
                  {stats.coOffTop.length === 0 ? (
                    <div className="stats-empty">데이터 없음</div>
                  ) : (
                    stats.coOffTop.map(([sabun, count], i) => {
                      const u = allUsers[sabun];
                      if (!u) return null;
                      const c = teamColor(u.team);
                      return (
                        <div key={sabun} className="stats-person-row">
                          <span className="rank">{i + 1}</span>
                          <span className="team-badge" style={{ background: c.bg, color: c.text, fontSize: 10, padding: "2px 6px" }}>
                            {u.team}
                          </span>
                          <span className="name">{u.name}</span>
                          <span className="count">{count}일</span>
                        </div>
                      );
                    })
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // <AllUsersDutyGrid> — 가로 시트 전체보기 (조회 전용)
    // ============================================================
    function AllUsersDutyGrid({ year, month, allUsers, allDuties, seniority, clinicOverrides, dbHolidays, mySabun, isAdmin, onClose }) {
      const monthKey = getMonthKey(year, month);
      const { daysInMonth, startWeekday } = getMonthInfo(year, month);
      // 관리자 helper 지정 대상 셀 { sabun, day, name }
      const [helperTarget, setHelperTarget] = useState(null);

      // 그 달 기준 팀 그룹핑 (pendingTeam 반영) + 휴직/퇴사자 제외
      const groups = useMemo(() => {
        const g = {};
        for (const t of TEAMS) g[t] = [];
        Object.entries(allUsers).forEach(([sabun, user]) => {
          if (!isActiveInMonth(user, monthKey)) return; // 휴직/퇴사 제외
          const t = teamForMonth(user, monthKey);
          if (g[t]) g[t].push({ sabun, ...user });
        });
        for (const t of TEAMS) {
          g[t].sort((a, b) => compareUsersBySeniority(a, b, seniority));
        }
        return g;
      }, [allUsers, seniority, monthKey]);

      // 헤더 행 (날짜)
      const headerRow = (
        <div className="sheet-row header">
          <div className="sheet-cell-name header sheet-corner">이름</div>
          {Array.from({ length: daysInMonth }, (_, i) => {
            const day = i + 1;
            const dow = (startWeekday + i) % 7;
            const cls = dow === 0 ? "sun" : dow === 6 ? "sat" : "";
            return (
              <div key={day} className={`sheet-cell-day header ${cls}`}>{day}</div>
            );
          })}
        </div>
      );

      return (
        <div className="modal-backdrop" onClick={onClose} style={{ alignItems: "stretch" }}>
          <div className="modal sheet-modal" onClick={e => e.stopPropagation()}>
            <div className="sheet-header">
              <h2 className="modal-title" style={{ margin: 0, flex: 1 }}>
                {year}년 {month}월 전체 듀티
              </h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <p style={{ fontSize: 11, color: "var(--text-soft)", padding: "6px 16px 8px", margin: 0 }}>
              가로 스크롤 · 팀 → 입사일 순
            </p>

            <div className="sheet-scroll">
              <div className="sheet-grid">
                {TEAMS.map(team => {
                  const list = groups[team] || [];
                  if (list.length === 0) return null;
                  return (
                    <div key={team}>
                      <div className="sheet-team-label">{team}</div>
                      {team === TEAMS[0] || true ? headerRow : null}
                      {list.map(u => (
                        <div key={u.sabun} className="sheet-row">
                          <div className={`sheet-cell-name ${u.sabun === mySabun ? "me" : ""}`}>
                            {u.name}
                          </div>
                          {Array.from({ length: daysInMonth }, (_, i) => {
                            const day = i + 1;
                            const dow = (startWeekday + i) % 7;
                            const iso = isoDate(year, month, day);
                            const duty = getDutyAt(allDuties, monthKey, u.sabun, day);
                            const cls = dow === 0 ? "sun" : dow === 6 ? "sat" : "";
                            let style = {};
                            let text = "";
                            let helperBadge = null;
                            if (duty) {
                              const disp = getDisplayShift(duty.shift, iso, dow, clinicOverrides, dbHolidays);
                              if (disp) {
                                const c = shiftColor(disp);
                                style = { background: c.bg, color: c.text };
                                text = disp;
                              }
                              if (duty.helper?.team) {
                                const ht = duty.helper.team;
                                helperBadge = ht === "S-616" ? "616" : ht === "S-617" ? "617" : ht === "S-act" ? "S액" : ht === "main" ? "M" : ht;
                              }
                            }
                            return (
                              <SheetCell key={day}
                                text={text} style={style} cls={cls}
                                helperBadge={helperBadge}
                                canEdit={isAdmin && !!duty}
                                onLong={() => setHelperTarget({ sabun: u.sabun, day, name: u.name, duty })} />
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
          {helperTarget && (
            <SheetHelperModal
              target={helperTarget}
              monthKey={monthKey}
              onClose={() => setHelperTarget(null)} />
          )}
        </div>
      );
    }

    // 전체보기 셀 (관리자 long-press 가능)
    function SheetCell({ text, style, cls, helperBadge, canEdit, onLong }) {
      const timerRef = useRef(null);
      const firedRef = useRef(false);
      const start = () => {
        if (!canEdit) return;
        firedRef.current = false;
        timerRef.current = setTimeout(() => { firedRef.current = true; onLong(); }, 450);
      };
      const clear = () => { if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; } };
      return (
        <div className={`sheet-cell-day ${cls}`} style={{ ...style, position: "relative" }}
          onPointerDown={start} onPointerUp={clear} onPointerLeave={clear} onPointerCancel={clear}
          onContextMenu={e => e.preventDefault()}>
          {text}
          {helperBadge && <span style={{
            position: "absolute", top: 0, right: 1, fontSize: 6, fontWeight: 700, opacity: 0.85
          }}>{helperBadge}</span>}
        </div>
      );
    }

    // 전체보기 helper 팀 지정 모달
    function SheetHelperModal({ target, monthKey, onClose }) {
      const cur = target.duty?.helper?.team || "";
      const [busy, setBusy] = useState(false);
      const dKey = String(target.day).padStart(2, "0");
      const path = `duties/${monthKey}/${target.sabun}/${dKey}`;

      const setHelper = async (team) => {
        setBusy(true);
        try {
          if (team === "") {
            // helper 제거
            await update(ref(db, path), { helper: null });
          } else {
            await update(ref(db, path), { helper: { team } });
          }
          onClose();
        } catch (e) { console.error(e); alert("저장 실패"); setBusy(false); }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{target.name} · {target.day}일 근무 팀</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 12px" }}>
              다른 팀에서 근무(helper)하는 경우 팀을 지정하세요. '없음'이면 본인 팀 근무.
            </p>
            <div className="sheet-helper-grid">
              <button className={cur === "" ? "active" : ""} disabled={busy}
                onClick={() => setHelper("")} type="button">없음</button>
              {TEAMS.map(t => (
                <button key={t} className={cur === t ? "active" : ""} disabled={busy}
                  onClick={() => setHelper(t)} type="button">{t}</button>
              ))}
            </div>
          </div>
        </div>
      );
    }
    // ============================================================
    function WhitelistAdmin({ allUsers, admins, onClose }) {
      const [list, setList] = useState([]);
      const [bulkText, setBulkText] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        const r = ref(db, "whitelist");
        const unsub = onValue(r, snap => {
          const val = snap.val() || {};
          setList(Object.keys(val).sort());
        });
        return () => unsub();
      }, []);

      const addBulk = async () => {
        setErr("");
        const parts = bulkText.split(/[\s,;\n]+/).map(s => s.trim()).filter(Boolean);
        const invalid = parts.filter(s => !/^\d{5,6}$/.test(s));
        if (invalid.length) { setErr(`잘못된 사번: ${invalid.join(", ")}`); return; }
        if (!parts.length) { setErr("추가할 사번을 입력해 주세요."); return; }
        setBusy(true);
        try {
          const updates = {};
          parts.forEach(s => { updates[`whitelist/${s}`] = true; });
          await update(ref(db), updates);
          setBulkText("");
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const remove1 = async (sabun) => {
        if (!confirm(`${sabun} 화이트리스트에서 제거할까요? (이미 가입한 계정은 그대로 유지됨)`)) return;
        try { await remove(ref(db, `whitelist/${sabun}`)); }
        catch (e) { console.error(e); alert("삭제 실패"); }
      };

      const toggleAdmin = async (sabun, isCurrentlyAdmin) => {
        if (sabun === ADMIN_SABUN) {
          alert("기본 관리자는 변경할 수 없어요.");
          return;
        }
        try {
          if (isCurrentlyAdmin) {
            await remove(ref(db, `admins/${sabun}`));
          } else {
            await set(ref(db, `admins/${sabun}`), true);
          }
        } catch (e) {
          console.error(e); alert("저장 실패");
        }
      };

      // 등록된 사용자 리스트 (관리자 관리용)
      const registeredUsers = useMemo(() =>
        Object.entries(allUsers || {})
          .map(([sabun, u]) => ({ sabun, ...u }))
          .sort((a, b) => (a.hireDate || "").localeCompare(b.hireDate || ""))
      , [allUsers]);

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">화이트리스트 · 관리자</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <p className="menu-section-title">관리자 권한</p>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 8px" }}>
              체크된 사용자는 관리자 권한을 갖습니다. 본인(<code>{ADMIN_SABUN}</code>)은 자동.
            </p>
            <div style={{ maxHeight: 240, overflowY: "auto", border: "1px solid var(--border)", borderRadius: 10, padding: "4px 12px", marginBottom: 20 }}>
              {registeredUsers.length === 0 ? (
                <p style={{ color: "var(--text-soft)", fontSize: 13, padding: 12 }}>등록된 사용자가 없어요.</p>
              ) : (
                registeredUsers.map(u => {
                  const isMain = u.sabun === ADMIN_SABUN;
                  const isAdm = isMain || !!admins[u.sabun];
                  const c = teamColor(u.team);
                  return (
                    <div key={u.sabun} className="profile-row" style={{ borderColor: "var(--border)" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1 }}>
                        <span className="team-badge" style={{ background: c.bg, color: c.text, fontSize: 11, padding: "2px 8px" }}>{u.team}</span>
                        <span style={{ fontWeight: 500 }}>{u.name}</span>
                        <span style={{ fontSize: 11, color: "var(--text-soft)", fontFamily: "ui-monospace, monospace" }}>{u.sabun}</span>
                      </div>
                      <button className={`toggle ${isAdm ? "on" : ""}`}
                        onClick={() => toggleAdmin(u.sabun, isAdm)}
                        disabled={isMain}
                        type="button" aria-label="admin 토글"
                        style={isMain ? { opacity: 0.4 } : {}} />
                    </div>
                  );
                })
              )}
            </div>

            <p className="menu-section-title">가입 가능 사번</p>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 8px" }}>
              가입 가능한 사번 명단.
            </p>
            <div className="field" style={{ marginBottom: 8 }}>
              <textarea className="duty-textarea"
                style={{ letterSpacing: 0 }}
                value={bulkText} onChange={e => setBulkText(e.target.value)}
                placeholder="123456&#10;234567&#10;345678&#10;..." />
            </div>
            {err && <div className="auth-error" style={{ marginBottom: 10 }}>{err}</div>}
            <button className="btn-primary" onClick={addBulk} disabled={busy} style={{ marginBottom: 20 }}>
              {busy ? "추가 중…" : "추가"}
            </button>
            <p className="menu-section-title">현재 명단 ({list.length}명)</p>
            {list.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                아직 등록된 사번이 없어요.
              </p>
            ) : (
              <div>
                {list.map(s => (
                  <div key={s} className="profile-row">
                    <span className="profile-value" style={{ fontFamily: "ui-monospace, monospace" }}>{s}</span>
                    <button className="icon-btn" onClick={() => remove1(s)}
                      style={{ color: "var(--c-closed)" }} aria-label="삭제">×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW 등록 실패:", err));
      });
    }
  </script>
</body>
</html>
