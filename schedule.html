    function ProfileEdit({ me, onCancel, onSaved }) {
      const [name, setName] = useState(me.name);
      const [team, setTeam] = useState(me.team);
      const [hireDate, setHireDate] = useState(isoToHireDate(me.hireDate));
      const [phone, setPhone] = useState(formatPhone(me.phone || ""));
      const [teamTiming, setTeamTiming] = useState("now"); // now | next
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const teamChanged = team !== me.team;

      // 다음 달 monthKey
      const nextMonthKey = useMemo(() => {
        const t = todayInfo();
        const d = new Date(t.year, t.month, 1); // 다음 달 1일
        return getMonthKey(d.getFullYear(), d.getMonth() + 1);
      }, []);

      const save = async () => {
        setErr("");
        if (!name.trim()) return setErr("이름을 입력해 주세요.");
        const hireISO = hireDateToISO(hireDate);
        if (!hireISO) return setErr("입사일은 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        setBusy(true);
        try {
          const newData = {
            name: name.trim(), hireDate: hireISO,
            phone: phone.replace(/\D/g, ""),
          };
          if (!teamChanged) {
            newData.team = team;
          } else if (teamTiming === "now") {
            // 즉시 변경: team 바로 적용, pendingTeam 제거
            newData.team = team;
            newData.pendingTeam = null;
          } else {
            // 다음 달부터: 현재 team 유지, pendingTeam 예약
            newData.team = me.team;
            newData.pendingTeam = { team, fromMonth: nextMonthKey };
          }
          await update(ref(db, `users/${me.sabun}`), newData);
          onSaved(newData);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      // 기존 예약된 변경 표시
      const pending = me.pendingTeam;

      return (
        <div className="modal-backdrop" onClick={onCancel}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">정보 수정</h2>
              <button className="modal-close" onClick={onCancel} aria-label="닫기">×</button>
            </div>
            <div className="modal-fields">
              <div className="field"><label>이름</label>
                <input value={name} onChange={e => setName(e.target.value)} /></div>
              <div className="field"><label>팀</label>
                <select value={team} onChange={e => setTeam(e.target.value)}>
                  {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select></div>

              {pending && pending.team && (
                <div style={{
                  fontSize: 12, color: "var(--accent)", fontWeight: 600,
                  padding: "6px 10px", background: "var(--surface-alt)",
                  borderRadius: 8, marginTop: -4
                }}>
                  예약됨: {pending.fromMonth}부터 {pending.team}팀으로 변경
                </div>
              )}

              {teamChanged && (
                <div className="field">
                  <label>팀 변경 적용 시점</label>
                  <div className="seg seg-2">
                    <button className={teamTiming === "now" ? "active" : ""}
                      onClick={() => setTeamTiming("now")} type="button">즉시</button>
                    <button className={teamTiming === "next" ? "active" : ""}
                      onClick={() => setTeamTiming("next")} type="button">다음 달부터</button>
                  </div>
                  <p style={{ fontSize: 11, color: "var(--text-soft)", margin: "6px 0 0" }}>
                    {teamTiming === "now"
                      ? "이번 달 포함 즉시 새 팀으로 적용돼요."
                      : `${nextMonthKey}부터 입력하는 근무가 ${team}팀으로 들어가요. 이번 달은 ${me.team}팀 유지.`}
                  </p>
                </div>
              )}

              <div className="field"><label>입사일 (YYYYMMDD)</label>
                <input type="tel" inputMode="numeric" value={hireDate}
                  onChange={e => setHireDate(formatHireDateInput(e.target.value))} /></div>
              <div className="field"><label>전화번호</label>
                <input type="tel" inputMode="numeric" value={phone}
                  onChange={e => setPhone(formatPhone(e.target.value))} /></div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy}>
                {busy ? "저장 중…" : "저장"}
              </button>
              <button className="btn-ghost" onClick={onCancel}>취소</button>
            </div>
          </div>
        </div>
      );
    }

    function PasswordChangeModal({ sabun, onClose }) {
      const [pw, setPw] = useState("");

        setBusy(true);
        try {
          const newHash = await hashPassword(sabun, pw);
          await update(ref(db, `users/${sabun}`), { loginHash: newHash });
          setDone(true);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>

                  </button>
                  <button className="btn-ghost" onClick={onClose}>취소</button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function NoticesModal({ me, notices, noticeCategories, admins, onMarkedRead, onClose }) {
      const [view, setView] = useState("list");
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        Object.keys(notices).forEach(id => {
          localStorage.setItem(`notice_read_${id}`, "true");
        });
        onMarkedRead && onMarkedRead();
      }, [notices]);

      const noticeList = useMemo(() =>
        Object.entries(notices)
          .map(([id, n]) => ({ id, ...n }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
      , [notices]);

      const isAdmin = isAdminUser(me, admins);

      const handleDelete = async (id) => {
        if (!confirm("이 공지를 삭제할까요?")) return;
        try {
          await remove(ref(db, `notices/${id}`));
        } catch (e) {
          console.error(e); alert("삭제 실패");
        }
      };

      if (view === "editor") {
        return (
          <NoticeEditor
            me={me}
            existingNotice={editingId ? { id: editingId, ...notices[editingId] } : null}
            noticeCategories={noticeCategories}
            onBack={() => { setView("list"); setEditingId(null); }}
            onGoCategoryEditor={() => setView("category-editor")}
            onClose={onClose} />
        );
      }
      if (view === "category-editor") {
        return (
          <NoticeCategoryEditor
            me={me} admins={admins}
            noticeCategories={noticeCategories}
            onBack={() => setView("editor")}
            onClose={onClose} />
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">📢 공지</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            {noticeList.length === 0 ? (
              <div className="notice-list-empty">아직 공지가 없어요.</div>
            ) : (
              <div>
                {noticeList.map(n => {
                  const cat = noticeCategories[n.category];
                  const colorId = cat?.color || n.categoryColor || "gray";
                  const c = getNoticeColor(colorId);
                  const canEdit = n.authorId === me.sabun;
                  const canDelete = n.authorId === me.sabun || isAdmin;
                  return (
                    <div key={n.id} className="notice-list-row">
                      <div className="notice-list-meta">
                        {cat && (
                          <span className="notice-category-tag"
                            style={{ background: c.bg, color: c.text }}>
                            {cat.name}
                          </span>
                        )}
                        <span className="author">{n.authorName}</span>
                        <span>·</span>
                        <span>{formatRelativeTime(n.createdAt)}</span>
                      </div>
                      <div className="notice-list-text">{n.text}</div>
                      {(canEdit || canDelete) && (
                        <div className="notice-list-actions">
                          {canEdit && (
                            <button className="notice-action-btn"
                              onClick={() => { setEditingId(n.id); setView("editor"); }}>수정</button>
                          )}
                          {canDelete && (
                            <button className="notice-action-btn danger"
                              onClick={() => handleDelete(n.id)}>삭제</button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            <div className="modal-actions" style={{ marginTop: 16 }}>
              <button className="btn-primary"
                onClick={() => { setEditingId(null); setView("editor"); }}>
                + 새 공지 작성
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <NoticeEditor> — 공지 작성/수정
    // ============================================================
    function NoticeEditor({ me, existingNotice, noticeCategories, onBack, onGoCategoryEditor, onClose }) {
      const [text, setText] = useState(existingNotice?.text || "");
      const [categoryId, setCategoryId] = useState(existingNotice?.category || "_default");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const categoryList = useMemo(() => {
        const arr = Object.entries(noticeCategories).map(([id, c]) => ({ id, ...c }));
        return [{ id: "_default", name: DEFAULT_CATEGORY.name, color: DEFAULT_CATEGORY.color }, ...arr];
      }, [noticeCategories]);

      const submit = async () => {
        setErr("");
        if (!text.trim()) return setErr("내용을 입력해 주세요.");
        if (text.length > 500) return setErr("500자 이내로 작성해 주세요.");

        const cat = categoryList.find(c => c.id === categoryId);
        const colorId = cat?.color || "gray";

        setBusy(true);
        try {
          if (existingNotice) {
            // 수정 — 본인이 작성자일 때만
            await update(ref(db, `notices/${existingNotice.id}`), {
              text: text.trim(),
              category: categoryId === "_default" ? null : categoryId,
              categoryColor: colorId,
            });
          } else {
            // 신규
            const id = genNoticeId();
            await set(ref(db, `notices/${id}`), {
              text: text.trim(),
              authorId: me.sabun,
              authorName: me.name,
              category: categoryId === "_default" ? null : categoryId,
              categoryColor: colorId,
              createdAt: Date.now(),
            });
          }
          onBack();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{existingNotice ? "공지 수정" : "새 공지"}</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="mode-switch">
              <button onClick={onBack}>← 목록으로</button>
              <button onClick={onGoCategoryEditor} style={{ background: "var(--surface-alt)" }}>
                ⚙ 카테고리
              </button>
            </div>

            <div className="modal-fields">
              <div className="field">
                <label>카테고리</label>
                <div className="category-select">
                  {categoryList.map(c => {
                    const col = getNoticeColor(c.color);
                    const active = categoryId === c.id;
                    return (
                      <button key={c.id}
                        className={active ? "active" : ""}
                        style={active ? { background: col.bg, color: col.text } : {}}
                        onClick={() => setCategoryId(c.id)}>
                        {c.name}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="field">
                <label>내용 ({text.length}/500)</label>
                <textarea className="duty-textarea"
                  style={{ minHeight: 120, letterSpacing: 0, fontFamily: "inherit", fontSize: 15 }}
                  value={text} onChange={e => setText(e.target.value.slice(0, 500))}
                  placeholder="공지 내용을 입력해 주세요…" autoFocus />
              </div>

              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={submit} disabled={busy || !text.trim()}>
                {busy ? "저장 중…" : (existingNotice ? "수정" : "공지 등록")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <NoticeCategoryEditor> — 카테고리 추가/수정/삭제
    // ============================================================
    function NoticeCategoryEditor({ me, admins, noticeCategories, onBack, onClose }) {
      const [adding, setAdding] = useState(false);
      const [newName, setNewName] = useState("");
      const [newColor, setNewColor] = useState("gray");
      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState("");
      const [editColor, setEditColor] = useState("gray");
      const [busy, setBusy] = useState(false);

      const isAdmin = isAdminUser(me, admins);
      const categoryList = useMemo(() =>
        Object.entries(noticeCategories).map(([id, c]) => ({ id, ...c }))
      , [noticeCategories]);

      const addCategory = async () => {
        if (!newName.trim()) return;
        setBusy(true);
        try {
          const id = genCategoryId();
          await set(ref(db, `noticeCategories/${id}`), {
            name: newName.trim(),
            color: newColor,
            createdBy: me.sabun,
          });
          setNewName(""); setNewColor("gray"); setAdding(false);
        } catch (e) {
          console.error(e); alert("저장 실패");
        }
        setBusy(false);
      };

      const saveEdit = async () => {
        if (!editName.trim()) return;
        setBusy(true);
        try {
          await update(ref(db, `noticeCategories/${editingId}`), {
            name: editName.trim(),
            color: editColor,
          });
          setEditingId(null);
        } catch (e) {
          console.error(e); alert("저장 실패");
        }
        setBusy(false);
      };

      const removeCategory = async (id, cat) => {
        const canDelete = cat.createdBy === me.sabun || isAdmin;
        if (!canDelete) { alert("만든 사람 또는 admin만 삭제 가능해요."); return; }
        if (!confirm(`'${cat.name}' 카테고리를 삭제할까요?\n(이미 이 카테고리로 작성된 공지는 '일반'으로 표시됩니다.)`)) return;
        try {
          await remove(ref(db, `noticeCategories/${id}`));
        } catch (e) {
          console.error(e); alert("삭제 실패");
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">카테고리 관리</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="mode-switch">
              <button onClick={onBack}>← 공지로</button>
            </div>

            {categoryList.length === 0 && !adding && (
              <p style={{ fontSize: 13, color: "var(--text-soft)", padding: "16px 0", textAlign: "center" }}>
                아직 카테고리가 없어요. 추가해 보세요.
              </p>
            )}

            {categoryList.map(c => {
              const col = getNoticeColor(c.color);
              const canEdit = c.createdBy === me.sabun || isAdmin;
              if (editingId === c.id) {
                return (
                  <div key={c.id} style={{ padding: "14px 0", borderBottom: "1px solid var(--border)" }}>
                    <div className="field">
                      <label>이름</label>
                      <input value={editName} onChange={e => setEditName(e.target.value)} />
                    </div>
                    <div className="field" style={{ marginTop: 10 }}>
                      <label>색</label>
                      <div className="color-grid">
                        {NOTICE_COLORS.map(opt => (
                          <button key={opt.id} type="button"
                            className={`color-swatch ${editColor === opt.id ? "active" : ""}`}
                            style={{ background: opt.bg }}
                            onClick={() => setEditColor(opt.id)} />
                        ))}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                      <button className="btn-primary" onClick={saveEdit} disabled={busy} style={{ flex: 1 }}>
                        저장
                      </button>
                      <button className="btn-ghost" onClick={() => setEditingId(null)}>취소</button>
                    </div>
                  </div>
                );
              }
              return (
                <div key={c.id} className="category-row">
                  <span className="cat-name" style={{ background: col.bg, color: col.text }}>
                    {c.name}
                  </span>
                  {canEdit && (
                    <>
                      <button className="notice-action-btn"
                        onClick={() => {
                          setEditingId(c.id);
                          setEditName(c.name);
                          setEditColor(c.color);
                        }}>수정</button>
                      <button className="notice-action-btn danger"
                        onClick={() => removeCategory(c.id, c)}>삭제</button>
                    </>
                  )}
                </div>
              );
            })}

            {adding ? (
              <div style={{ marginTop: 16, padding: 14, background: "var(--surface)", borderRadius: 10, border: "1px solid var(--border)" }}>
                <div className="field">
                  <label>이름</label>
                  <input value={newName} onChange={e => setNewName(e.target.value)}
                    placeholder="예: 회식, 교육, 긴급" autoFocus />
                </div>
                <div className="field" style={{ marginTop: 10 }}>
                  <label>색</label>
                  <div className="color-grid">
                    {NOTICE_COLORS.map(opt => (

                    추가

                    onClick={() => { setAdding(false); setNewName(""); setNewColor("gray"); }}>취소</button>
                </div>

            ) : (
              <div className="modal-actions" style={{ marginTop: 16 }}>

    // ============================================================
    // <ClinicHoursEditor>
    // ============================================================
    function ClinicHoursEditor({ clinicOverrides, dbHolidays, onClose }) {
      const today = todayInfo();
      const [year, setYear] = useState(today.year);
      const [month, setMonth] = useState(today.month);
      const [pickDate, setPickDate] = useState(null); // ISO

      const goPrev = () => {
        if (month === 1) { setYear(y => y - 1); setMonth(12); }
        else setMonth(m => m - 1);
      };
      const goNext = () => {
        if (month === 12) { setYear(y => y + 1); setMonth(1); }
        else setMonth(m => m + 1);
      };

      const { daysInMonth, startWeekday } = getMonthInfo(year, month);

      const setStatus = async (iso, status) => {
        try {
          if (status === null) {
            // 기본값으로 리셋
            await remove(ref(db, `clinicHours/${iso}`));
          } else {
            await set(ref(db, `clinicHours/${iso}`), status);
          }
          setPickDate(null);
        } catch (e) {
          console.error(e);
          alert("저장 실패");
        }
      };

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="ce-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const isOverride = !!clinicOverrides[iso];
        const isHoliday = !!getHolidayName(iso, dbHolidays);
        cells.push(
          <button key={day}
            className={`ce-cell ${status} ${isOverride ? "overridden" : ""} ${isHoliday ? "holiday-marker" : ""}`}
            onClick={() => setPickDate(iso)} type="button">
            {day}
          </button>
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">진료시간 수정</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 12px" }}>
              날짜를 탭하면 진료시간을 바꿀 수 있어요. 보라색 테두리는 직접 설정한 날.
            </p>

            <div className="month-nav" style={{ justifyContent: "center", marginBottom: 6 }}>
              <button onClick={goPrev}>‹</button>
              <span style={{ padding: "0 14px", fontSize: 15, fontWeight: 600 }}>
                {year}년 {month}월
              </span>
              <button onClick={goNext}>›</button>
            </div>

            <div className="cal-weekdays">
              {WEEKDAYS_KR.map((w, i) => (
                <div key={w} style={{
                  color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
                }}>{w}</div>
              ))}
            </div>
            <div className="ce-grid">{cells}</div>

            <div style={{ marginTop: 16, padding: 12, background: "var(--surface-alt)", borderRadius: 10, fontSize: 12, color: "var(--text-mute)", lineHeight: 1.6 }}>
              <span style={{ color: "var(--c-full)", fontWeight: 600 }}>● 검정</span> 오전·오후 진료 ·
              <span style={{ color: "var(--c-morning)", fontWeight: 600 }}> 파랑</span> 오전만 ·
              <span style={{ color: "var(--c-closed)", fontWeight: 600 }}> 빨강</span> 휴진<br />
              우상단 빨간 점은 공휴일 표시. 공휴일에 진료 있으면 색을 바꿔도 점은 유지돼요.
            </div>

            {pickDate && (
              <ClinicHoursPicker
                iso={pickDate}
                current={clinicOverrides[pickDate]}
                isHoliday={!!getHolidayName(pickDate, dbHolidays)}
                onClose={() => setPickDate(null)}
                onPick={(s) => setStatus(pickDate, s)} />
            )}
          </div>
        </div>
      );
    }

    function ClinicHoursPicker({ iso, current, isHoliday, onClose, onPick }) {
      const [y, m, d] = iso.split("-").map(Number);
      const dow = getWeekday(y, m, d);
      // 기본값 설명용
      const baseDefault = isHoliday ? "휴진" : (dow === 0 ? "휴진" : (dow === 6 ? "오전만" : "오전·오후"));

      return (
        <div className="modal-backdrop" onClick={onClose} style={{ zIndex: 200 }}>

            <div className="modal-header">
              <h2 className="modal-title">{m}월 {d}일 ({WEEKDAYS_KR[dow]})</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>

            <div className="picker-options">

              </button>
              <button className={current === "full" ? "active" : ""} onClick={() => onPick("full")}>
                <span className="picker-dot" style={{ background: "var(--c-full)" }}></span>
                <span>오전·오후 진료</span>
              </button>
              <button className={current === "morning" ? "active" : ""} onClick={() => onPick("morning")}>
                <span className="picker-dot" style={{ background: "var(--c-morning)" }}></span>
                <span>오전만 진료</span>
              </button>
              <button className={current === "closed" ? "active" : ""} onClick={() => onPick("closed")}>

                <span>휴진</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <HolidaysEditor>
    // ============================================================
    function HolidaysEditor({ dbHolidays, onClose }) {
      const [adding, setAdding] = useState(false);
      const [newDate, setNewDate] = useState("");
      const [newName, setNewName] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      // 통합 리스트: BUILTIN + DB. DB가 같은 날짜면 덮어쓰기 (수동 우선)
      const merged = useMemo(() => {
        const all = {};
        Object.entries(BUILTIN_HOLIDAYS).forEach(([iso, name]) => {
          all[iso] = { name, source: "builtin" };
        });
        Object.entries(dbHolidays || {}).forEach(([iso, info]) => {
          all[iso] = { name: info.name || "공휴일", source: "manual" };
        });
        // 정렬 (오름차순)
        return Object.entries(all)
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([iso, info]) => ({ iso, ...info }));
      }, [dbHolidays]);

      // 미래 + 최근 6개월
      const cutoff = (() => {
        const d = new Date();
        d.setMonth(d.getMonth() - 6);
        return d.toISOString().slice(0, 10);
      })();
      const visible = merged.filter(h => h.iso >= cutoff);

      const addHoliday = async () => {
        setErr("");
        const digits = newDate.replace(/\D/g, "");
        if (digits.length !== 8) return setErr("날짜는 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        const iso = `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
        // 유효성: parse 후 다시 ISO 비교
        const [yy, mm, dd] = iso.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        if (dt.getFullYear() !== yy || dt.getMonth() + 1 !== mm || dt.getDate() !== dd) {
          return setErr("유효하지 않은 날짜예요.");
        }
        if (!newName.trim()) return setErr("공휴일 이름을 입력해 주세요.");
        setBusy(true);
        try {
          await set(ref(db, `holidays/${iso}`), { name: newName.trim() });
          setNewDate(""); setNewName(""); setAdding(false);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const removeManual = async (iso) => {
        if (!confirm("이 공휴일을 제거할까요?")) return;
        try {
          await remove(ref(db, `holidays/${iso}`));
        } catch (e) {
          console.error(e); alert("삭제 실패");
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">공휴일 관리</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            {!adding ? (
              <button className="btn-primary" onClick={() => setAdding(true)} style={{ marginBottom: 16 }}>
                + 공휴일 추가
              </button>
            ) : (
              <div style={{ background: "var(--surface)", padding: 14, borderRadius: 10, marginBottom: 16, border: "1px solid var(--border)" }}>
                <div className="modal-fields">
                  <div className="field"><label>날짜 (YYYYMMDD)</label>
                    <input type="tel" inputMode="numeric" value={newDate}
                      onChange={e => setNewDate(formatHireDateInput(e.target.value))}
                      placeholder="20261225" autoFocus /></div>
                  <div className="field"><label>이름</label>
                    <input value={newName} onChange={e => setNewName(e.target.value)}
                      placeholder="예: 임시공휴일" /></div>
                  {err && <div className="auth-error">{err}</div>}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn-primary" onClick={addHoliday} disabled={busy} style={{ flex: 1 }}>
                    {busy ? "추가 중…" : "추가"}
                  </button>
                  <button className="btn-ghost" onClick={() => { setAdding(false); setErr(""); }}>취소</button>
                </div>
              </div>
            )}

            <p className="menu-section-title">목록 ({visible.length}개)</p>
            {visible.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                표시할 공휴일이 없어요.
              </p>
            ) : (
              visible.map(h => (
                <div key={h.iso} className="holiday-row">
                  <div className="holiday-info">
                    <div className="holiday-date">{h.iso}</div>
                    <div className="holiday-name">
                      {h.name}
                      <span className="holiday-source">{h.source === "builtin" ? "기본" : "수동"}</span>
                    </div>
                  </div>
                  {h.source === "manual" && (
                    <button className="icon-btn" onClick={() => removeManual(h.iso)}
                      style={{ color: "var(--c-closed)" }} aria-label="삭제">×</button>
                  )}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // <SeniorityEditor> — 연명부 (연차/경력 + 팀변동 + 재직상태 통합 관리, admin)
    // ============================================================
    function SeniorityEditor({ allUsers, seniority, onClose }) {
      const [busy, setBusy] = useState(false);
      const [savedMsg, setSavedMsg] = useState("");
      const [expandedSabun, setExpandedSabun] = useState(null);

      // 경력 로컬 입력
      const [expLocal, setExpLocal] = useState(() => {
        const out = {};
        Object.keys(allUsers).forEach(s => {
          const v = seniority?.[s];
          out[s] = v != null ? String(v) : "";
        });
        return out;
      });

      // 다음 달 monthKey (12월 넘김 처리)
      const realNextMonthKey = useMemo(() => {
        const t = todayInfo();
        const d = new Date(t.year, t.month, 1); // month는 1-base라 이게 다음달 1일
        return getMonthKey(d.getFullYear(), d.getMonth() + 1);
      }, []);
      const curMonthKey = useMemo(() => {
        const t = todayInfo();
        return getMonthKey(t.year, t.month);
      }, []);

      // 정렬: 재직 간호사 연차순 → (이송은 별도) → 휴직/퇴사자 맨 아래(회색)
      // 이송팀(noLogin 또는 team==="이송")은 sortedUsers에서 제외하고 transferList로 따로
      const sortedUsers = useMemo(() => {
        const list = Object.entries(allUsers)
          .map(([sabun, u]) => ({ sabun, ...u }))
          .filter(u => u.team !== "이송" && !u.noLogin); // 간호사만
        const isInactive = (u) => {
          const s = u.status;
          if (!s || !s.type) return false;
          // 현재 달 기준 비활성이면 아래로
          return !isActiveInMonth(u, curMonthKey);
        };
        list.sort((a, b) => {
          const ia = isInactive(a), ib = isInactive(b);
          if (ia !== ib) return ia ? 1 : -1;
          return compareUsersBySeniority(a, b, seniority);
        });
        return list;
      }, [allUsers, seniority, curMonthKey]);

      // 이송팀 명단 (이름순)
      const transferList = useMemo(() => {
        return Object.entries(allUsers)
          .map(([sabun, u]) => ({ sabun, ...u }))
          .filter(u => u.team === "이송" || u.noLogin)
          .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      }, [allUsers]);

      const setExp = (sabun, val) => {
        if (val === "" || /^\d{1,3}$/.test(val)) {
          setExpLocal(prev => ({ ...prev, [sabun]: val }));
        }
      };

      const previewTotal = (user) => {
        const yos = yearsOfService(user.hireDate);
        const expStr = expLocal[user.sabun];
        const exp = expStr ? parseInt(expStr, 10) : 0;
        return yos + (isNaN(exp) ? 0 : exp);
      };

      // 경력 일괄 저장
      const saveExp = async () => {
        setBusy(true);
        setSavedMsg("");
        try {
          const updates = {};
          Object.keys(expLocal).forEach(s => {
            const v = expLocal[s];
            if (v === "" || v === "0") updates[`seniority/${s}`] = null;
            else updates[`seniority/${s}`] = parseInt(v, 10);
          });
          await update(ref(db), updates);
          setSavedMsg("저장됨");
          setTimeout(() => setSavedMsg(""), 1500);
        } catch (e) {
          console.error(e);
          alert("저장 실패");
        }
        setBusy(false);
      };

      // 팀 변경 적용 (admin이 특정 사용자에게)
      const applyTeamChange = async (sabun, newTeam, timing) => {
        const user = allUsers[sabun];
        if (!user) return;
        try {
          const updates = {};
          if (timing === "now") {
            updates[`users/${sabun}/team`] = newTeam;
            updates[`users/${sabun}/pendingTeam`] = null;
          } else {
            updates[`users/${sabun}/pendingTeam`] = { team: newTeam, fromMonth: realNextMonthKey };
          }
          await update(ref(db), updates);
        } catch (e) { console.error(e); alert("팀 변경 실패"); }
      };

      // 재직 상태 변경
      const applyStatus = async (sabun, status) => {
        try {
          await update(ref(db, `users/${sabun}`), { status: status });
        } catch (e) { console.error(e); alert("상태 변경 실패"); }
      };

      // 이송 명단 추가 (이름만, 로그인 불가)
      const [newTransfer, setNewTransfer] = useState("");
      const addTransfer = async () => {
        const name = newTransfer.trim();
        if (!name) return;
        try {
          // 이송용 사번: t- 접두 + 타임스탬프 (중복 방지, 숫자 사번과 구분)
          const tSabun = `t-${Date.now().toString(36)}`;
          await set(ref(db, `users/${tSabun}`), {
            name, team: "이송", noLogin: true,
          });
          setNewTransfer("");
        } catch (e) { console.error(e); alert("이송 추가 실패"); }
      };
      const renameTransfer = async (sabun, name) => {
        const n = (name || "").trim();
        if (!n) return;
        try { await update(ref(db, `users/${sabun}`), { name: n }); }
        catch (e) { console.error(e); alert("이름 수정 실패"); }
      };
      const removeTransfer = async (sabun, name) => {
        if (!confirm(`이송 '${name}'을(를) 삭제할까요? 기존 근무 기록도 함께 사라집니다.`)) return;
        try { await remove(ref(db, `users/${sabun}`)); }
        catch (e) { console.error(e); alert("삭제 실패"); }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">연명부</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="duty-help" style={{ marginBottom: 14 }}>
              연차는 1월 1일마다 +1. 경력 입력 시 합산 정렬돼요. 행을 누르면 팀변동·재직상태를 관리할 수 있어요.<br />
              경력 저장은 하단 버튼, 팀·재직은 각자 즉시 반영됩니다.
            </div>

            <div className="roster-list">
              {(() => {
                const active = sortedUsers.filter(u => !(u.status?.type && !isActiveInMonth(u, curMonthKey)));
                const inactiveUsers = sortedUsers.filter(u => u.status?.type && !isActiveInMonth(u, curMonthKey));

                const renderNurse = (u) => {
                  const total = previewTotal(u);
                  const expVal = expLocal[u.sabun];
                  const isExpanded = expandedSabun === u.sabun;
                  const st = u.status;
                  const inactive = st && st.type && !isActiveInMonth(u, curMonthKey);
                  const pending = u.pendingTeam;
                  let statusLabel = null;
                  if (st?.type === "leave") statusLabel = `휴직 ${st.from}~${st.to}`;
                  else if (st?.type === "resigned") statusLabel = `퇴사 ${st.from}~`;
                  return (
                    <div key={u.sabun} className={`roster-item ${inactive ? "inactive" : ""}`}>
                      <div className="roster-head" onClick={() => setExpandedSabun(isExpanded ? null : u.sabun)}>
                        <span className="r-name">{u.name}</span>
                        <span className="r-team">{teamForMonth(u, curMonthKey)}</span>
                        <span className="r-year">{total}년차</span>
                        {statusLabel && <span className="r-status">{statusLabel}</span>}
                        {pending?.team && <span className="r-pending">→{pending.team}({pending.fromMonth})</span>}
                        <span className="r-arrow">{isExpanded ? "▾" : "▸"}</span>
                      </div>
                      {isExpanded && (
                        <div className="roster-detail">
                          <div className="rd-row">
                            <span className="rd-label">경력</span>
                            <input className="rd-exp" type="tel" inputMode="numeric"
                              value={expVal || ""} onChange={e => setExp(u.sabun, e.target.value)}
                              placeholder="0" />
                            <span className="rd-unit">년</span>
                            <span className="rd-hire">입사 {isoToHireDate(u.hireDate) || "—"}</span>
                          </div>
                          <TeamChangeRow user={u} curTeam={teamForMonth(u, curMonthKey)}
                            nextMonthKey={realNextMonthKey}
                            onApply={(t, timing) => applyTeamChange(u.sabun, t, timing)} />
                          <StatusRow user={u} onApply={(s) => applyStatus(u.sabun, s)} />
                        </div>
                      )}
                    </div>
                  );
                };

                return (
                  <>
                    {active.map(renderNurse)}

                    {/* 이송 섹션 */}
                    <div className="roster-section-label">이송</div>
                    {transferList.map(t => (
                      <div key={t.sabun} className="roster-item transfer">
                        <div className="roster-head" style={{ cursor: "default" }}>
                          <input className="transfer-name-input"
                            defaultValue={t.name}
                            onBlur={e => { if (e.target.value.trim() !== t.name) renameTransfer(t.sabun, e.target.value); }} />
                          <button className="transfer-del" onClick={() => removeTransfer(t.sabun, t.name)} type="button">삭제</button>
                        </div>
                      </div>
                    ))}
                    <div className="roster-item transfer-add">
                      <div className="roster-head" style={{ cursor: "default" }}>
                        <input className="transfer-name-input" placeholder="이송 이름 추가"
                          value={newTransfer}
                          onChange={e => setNewTransfer(e.target.value)}
                          onKeyDown={e => { if (e.key === "Enter") addTransfer(); }} />
                        <button className="transfer-add-btn" onClick={addTransfer} type="button">추가</button>
                      </div>
                    </div>

                    {/* 휴직/퇴사 */}
                    {inactiveUsers.length > 0 && <div className="roster-section-label">휴직 / 퇴사</div>}
                    {inactiveUsers.map(renderNurse)}
                  </>
                );
              })()}
            </div>

            <div className="modal-actions" style={{ marginTop: 18 }}>
              <button className="btn-primary" onClick={saveExp} disabled={busy}>
                {busy ? "저장 중…" : (savedMsg || "경력 저장")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 팀 변경 행
    function TeamChangeRow({ user, curTeam, nextMonthKey, onApply }) {
      const [newTeam, setNewTeam] = useState(curTeam);
      const [timing, setTiming] = useState("now");
      const changed = newTeam !== curTeam;
      return (
        <div className="rd-row">
          <span className="rd-label">팀</span>
          <select className="rd-select" value={newTeam} onChange={e => setNewTeam(e.target.value)}>
            {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
          {changed && (
            <>
              <div className="seg seg-2 rd-seg">
                <button className={timing === "now" ? "active" : ""} onClick={() => setTiming("now")} type="button">즉시</button>
                <button className={timing === "next" ? "active" : ""} onClick={() => setTiming("next")} type="button">다음달</button>
              </div>
              <button className="rd-apply" onClick={() => onApply(newTeam, timing)} type="button">적용</button>
            </>
          )}
        </div>
      );
    }

    // 재직 상태 행
    function StatusRow({ user, onApply }) {
      const st = user.status;
      const initActive = !st || !st.type;
      const [active, setActive] = useState(initActive);
      const [type, setType] = useState(st?.type === "resigned" ? "resigned" : "leave");
      const [leaveFrom, setLeaveFrom] = useState(st?.type === "leave" ? (st.from || "") : "");
      const [leaveTo, setLeaveTo] = useState(st?.type === "leave" ? (st.to || "") : "");
      const [resignFrom, setResignFrom] = useState(st?.type === "resigned" ? (st.from || "") : "");

      const save = () => {
        if (active) { onApply(null); return; }
        if (type === "leave") {
          if (!/^\d{4}-\d{2}$/.test(leaveFrom) || !/^\d{4}-\d{2}$/.test(leaveTo)) {
            alert("휴직 기간을 YYYY-MM 형식으로 입력해 주세요."); return;
          }
          onApply({ type: "leave", from: leaveFrom, to: leaveTo });
        } else {
          if (!/^\d{4}-\d{2}$/.test(resignFrom)) {
            alert("퇴사 시작월을 YYYY-MM 형식으로 입력해 주세요."); return;
          }
          onApply({ type: "resigned", from: resignFrom });
        }
      };

      return (
        <div className="rd-status">
          <label className="rd-check">
            <input type="checkbox" checked={active} onChange={e => setActive(e.target.checked)} />
            <span>재직</span>
          </label>
          {!active && (
            <div className="rd-status-detail">
              <div className="seg seg-2 rd-seg">
                <button className={type === "leave" ? "active" : ""} onClick={() => setType("leave")} type="button">휴직</button>
                <button className={type === "resigned" ? "active" : ""} onClick={() => setType("resigned")} type="button">퇴사</button>
              </div>
              {type === "leave" ? (
                <div className="rd-period">
                  <input type="text" placeholder="2026-03" value={leaveFrom} onChange={e => setLeaveFrom(e.target.value)} />
                  <span>~</span>
                  <input type="text" placeholder="2026-08" value={leaveTo} onChange={e => setLeaveTo(e.target.value)} />
                </div>
              ) : (
                <div className="rd-period">
                  <input type="text" placeholder="2026-09" value={resignFrom} onChange={e => setResignFrom(e.target.value)} />
                  <span>부터</span>
                </div>
              )}
            </div>
          )}
          <button className="rd-apply" onClick={save} type="button">적용</button>
        </div>
      );
    }

    // ============================================================
    // <OffToggleModal> — OFF 신청 활성화/비활성화
    // ============================================================
    function OffToggleModal({ year, month, me, requestSettings, onClose }) {
      const nm = nextMonthInfo(year, month);
      const nmk = nextMonthKey(year, month);
      const current = requestSettings?.[nmk];
      const active = !!current?.active;
      const [busy, setBusy] = useState(false);

      const activate = async () => {
        setBusy(true);
        try {
          await set(ref(db, `requestSettings/${nmk}`), {
            active: true,
            activatedBy: me.sabun,
            activatedByName: me.name,
            activatedAt: Date.now(),
          });
          onClose();
        } catch (e) { console.error(e); alert("저장 실패"); }
        setBusy(false);
      };
      const deactivate = async () => {
        if (!confirm("OFF 신청을 마감할까요? (기존 신청 데이터는 유지됩니다)")) return;
        setBusy(true);
        try {
          await update(ref(db, `requestSettings/${nmk}`), { active: false });
          onClose();
        } catch (e) { console.error(e); alert("저장 실패"); }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{nm.month}월 OFF 신청</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="duty-help" style={{ marginBottom: 18 }}>
              활성화하면 모든 사용자가 {nm.year}년 {nm.month}월 OFF 신청을 시작할 수 있어요.
              마감은 언제든 다시 비활성화하면 됩니다.<br /><br />
              현재 상태: <strong>{active ? "🟢 활성화됨" : "🔴 비활성화"}</strong>
              {active && current?.activatedByName && (
                <><br /><span style={{ fontSize: 11, color: "var(--text-soft)" }}>
                  활성화: {current.activatedByName} · {formatRelativeTime(current.activatedAt)}
                </span></>
              )}
            </div>
            <div className="modal-actions">
              {active ? (
                <button className="btn-primary" onClick={deactivate} disabled={busy}
                  style={{ background: "var(--c-closed)" }}>
                  {busy ? "처리 중…" : "신청 마감"}
                </button>
              ) : (
                <button className="btn-primary" onClick={activate} disabled={busy}>
                  {busy ? "처리 중…" : "신청 받기 시작"}
                </button>
              )}
              <button className="btn-ghost" onClick={onClose}>취소</button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <OffRequestModal> — OFF 신청 화면 (다음 달 캘린더)
    // ============================================================
    function OffRequestModal({ year, month, me, allUsers, allRequests, memos, clinicOverrides, dbHolidays, onClose, forceReadOnly }) {
      const nm = nextMonthInfo(year, month);
      const nmk = nextMonthKey(year, month);
      const { daysInMonth, startWeekday } = getMonthInfo(nm.year, nm.month);

      const [mode, setMode] = useState(null);
      const [busy, setBusy] = useState(false);
      const [viewTeam, setViewTeam] = useState(me.team);
      const isReadOnly = !!forceReadOnly || viewTeam !== me.team;

      // 본인 신청 데이터 (이 달, 본인 팀일 때만 의미)
      const myMonthRequests = useMemo(() => {
        const m = allRequests?.[nmk]?.[me.sabun] || {};
        const out = {};
        Object.keys(m).forEach(k => { out[parseInt(k, 10)] = m[k]; });
        return out;
      }, [allRequests, nmk, me.sabun]);

      const myMemo = memos?.[nmk]?.text || "";
      const [memoText, setMemoText] = useState(myMemo);
      const memoSaveTimer = useRef(null);
      useEffect(() => { setMemoText(myMemo); }, [myMemo]);

      const onMemoChange = (val) => {
        setMemoText(val);
        if (memoSaveTimer.current) clearTimeout(memoSaveTimer.current);
        memoSaveTimer.current = setTimeout(async () => {
          try {
            await set(ref(db, `memos/${nmk}/text`), val);
          } catch (e) { console.error(e); }
        }, 600);
      };

      const onCellClick = async (day) => {
        if (busy || isReadOnly) return;
        const dKey = String(day).padStart(2, "0");
        const path = `requests/${nmk}/${me.sabun}/${dKey}`;
        const existing = myMonthRequests[day];
        const desiredType = mode || "OFF";

        // 동일 타입 다시 클릭 → 삭제
        if (existing && existing.type === desiredType) {
          setBusy(true);
          try { await remove(ref(db, path)); }
          catch (e) { console.error(e); alert("삭제 실패"); }
          setBusy(false);
          return;
        }

        // 4명 제한 체크
        const list = getRequestsForDay(allRequests, nmk, day, allUsers, me.team);
        const meAlreadyIn = list.some(r => r.sabun === me.sabun);
        if (!meAlreadyIn && list.length >= 4) {
          alert("이 날 신청이 이미 4명입니다.");
          return;
        }

        setBusy(true);
        try {
          await set(ref(db, path), { type: desiredType, timestamp: Date.now() });
        } catch (e) { console.error(e); alert("저장 실패"); }
        setBusy(false);
      };

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="req-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(nm.year, nm.month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const dateColor = status === "closed" ? "var(--c-closed)"
          : status === "morning" ? "var(--c-morning)" : "var(--text)";
        const list = getRequestsForDay(allRequests, nmk, day, allUsers, viewTeam);
        const isFull = list.length >= 4;

        cells.push(
          <button key={day} className={`req-cell ${isFull ? "full" : ""}`}
            onClick={() => onCellClick(day)} type="button"
            disabled={isReadOnly}
            style={isReadOnly ? { cursor: "default", opacity: 0.95 } : {}}>
            {isFull && <span className="full-mark">FULL</span>}
            <div className="date-num" style={{ color: dateColor }}>{day}</div>
            <div className="req-list">
              {list.slice(0, 4).map((r, i) => (
                <div key={r.sabun} className={`row shift-${r.type === "OFF" ? "O" : r.type}`}>
                  {r.type === "OFF" ? "O" : r.type} {r.name}
                </div>
              ))}
            </div>
          </button>
        );
      }

      const promptText = (() => {
        if (isReadOnly) return `${viewTeam}팀 OFF 현황 (조회만 가능)`;
        if (mode === null) return "희망 OFF 날짜를 선택하세요";
        if (mode === "D") return "희망 D 근무 날짜 선택하세요";
        if (mode === "E") return "희망 E 근무 날짜 선택하세요";
        if (mode === "N") return "희망 N 근무 날짜 선택하세요";
        if (mode === "V") return "희망 V(반차) 날짜 선택하세요";
        return "";
      })();

      const showButtons = me.team === "main" ? ["V"] : ["D", "E", "N"];

      return (
        <div className="modal-backdrop" onClick={onClose} style={{ alignItems: "stretch" }}>
          <div className="modal" onClick={e => e.stopPropagation()}
            style={{ maxHeight: "100vh", borderRadius: 0, padding: 0 }}>
