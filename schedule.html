    function CalendarCell({
      day, dateISO, status, isToday, holidayName, duty, myTeam, clinicOverrides, dbHolidays, dayOfWeek,
      requestCount,
      onShortTap, onLongPress
    }) {
      const timerRef = useRef(null);
      const triggeredRef = useRef(false);
      const [pressing, setPressing] = useState(false);

      const startTimer = () => {
        triggeredRef.current = false;
        setPressing(true);
        timerRef.current = setTimeout(() => {
          triggeredRef.current = true;
          timerRef.current = null;
          setPressing(false);
          onLongPress(day);
        }, 500);
      };
      const cancelTimer = () => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
        }
        setPressing(false);
      };
      const handlePointerDown = (e) => { startTimer(); };
      const handlePointerUp = (e) => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
          setPressing(false);
          if (!triggeredRef.current) onShortTap(day);
        }
      };
      const handlePointerLeave = () => { cancelTimer(); };
      const handleContextMenu = (e) => { e.preventDefault(); };

      const rawShift = duty?.shift;
      // V → O 변환 (morning 진료일)
      const displayShift = rawShift
        ? getDisplayShift(rawShift, dateISO, dayOfWeek, clinicOverrides, dbHolidays)
        : null;
      const isHelper = !!duty?.helper;
      const cellLabel = getCellLabel(duty);
      // 변환되어 O가 된 V는 라벨도 의미 없음 (사실상 off)
      const showLabel = cellLabel && !(rawShift === "V" && displayShift === "O");
      // 셀 색: 항상 시프트(displayShift) 기준
      const cellColor = displayShift ? shiftColor(displayShift) : null;

      return (
        <button
          className={`cal-cell ${isToday ? "today" : ""} ${pressing ? "long-pressing" : ""}`}
          onPointerDown={handlePointerDown}
          onPointerUp={handlePointerUp}
          onPointerLeave={handlePointerLeave}
          onPointerCancel={handlePointerLeave}
          onContextMenu={handleContextMenu}
          type="button"
        >
          <div className={`cal-date ${status}`}>{day}</div>
          {requestCount > 0 && (
            <span style={{
              position: "absolute", top: 3, right: 4,
              fontSize: 9, fontWeight: 700,
              color: requestCount >= 4 ? "var(--c-closed)" : "var(--text-mute)",
              background: requestCount >= 4 ? "#FFE0E0" : "var(--surface-alt)",
              padding: "1px 4px", borderRadius: 999,
              lineHeight: 1,
            }}>{requestCount}</span>
          )}
          <div className="duty-stack">
            {displayShift && (
              <div className="duty-pill"
                style={{ background: cellColor.bg, color: cellColor.text }}>
                <span className={`shift-letter-wrap ${isHelper ? "helper" : ""}`}>{displayShift}</span>
                {showLabel && <span className="role-suffix">{cellLabel}</span>}
              </div>
            )}
          </div>
        </button>
      );
    }

    function CalendarGrid({ year, month, myDuties, clinicOverrides, dbHolidays, today, myTeam, onShortTap, onLongPress, onSwipeLeft, onSwipeRight, allRequests, allUsers }) {
      const { daysInMonth, startWeekday } = getMonthInfo(year, month);
      const swipeStartRef = useRef(null);

      const handleTouchStart = (e) => {
        const t = e.touches[0];
        swipeStartRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
      };
      const handleTouchEnd = (e) => {
        const start = swipeStartRef.current;
        if (!start) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        const dt = Date.now() - start.time;
        swipeStartRef.current = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) {
          if (dx < 0) onSwipeLeft && onSwipeLeft();
          else onSwipeRight && onSwipeRight();
        }
      };

      const monthKey = getMonthKey(year, month);

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="cal-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const isToday = (year === today.year && month === today.month && day === today.day);
        const duty = myDuties[day];
        const holidayName = getHolidayName(iso, dbHolidays);
        const reqCount = allRequests && allUsers
          ? getRequestCountForDay(allRequests, monthKey, day, allUsers, myTeam)
          : 0;

        cells.push(
          <CalendarCell key={day}
            day={day} dateISO={iso} dayOfWeek={dow}
            status={status} isToday={isToday}
            holidayName={holidayName} duty={duty} myTeam={myTeam}
            clinicOverrides={clinicOverrides} dbHolidays={dbHolidays}
            requestCount={reqCount}
            onShortTap={onShortTap} onLongPress={onLongPress} />
        );
      }

      return (
        <div className="cal-wrap" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
          <div className="cal-weekdays">
            {WEEKDAYS_KR.map((w, i) => (
              <div key={w} style={{
                color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
              }}>{w}</div>
            ))}
          </div>
          <div className="cal-grid">{cells}</div>
        </div>
      );
    }

    // ============================================================
    // <DayDetailModal>
    // ============================================================
    // 공지 카테고리 색 팔레트 (10가지)
    const NOTICE_COLORS = [
      { id: "coral",  bg: "#FCC8C8", text: "#5B1414", name: "코랄" },
      { id: "orange", bg: "#FCD7B0", text: "#5C2D04", name: "주황" },
      { id: "pink",   bg: "#F8C0DC", text: "#4F1234", name: "핑크" },
      { id: "lime",   bg: "#E5EDB8", text: "#36400C", name: "라임" },
      { id: "mint",   bg: "#BFE8D8", text: "#0F3B2A", name: "민트" },
      { id: "teal",   bg: "#B8E0E8", text: "#0A363F", name: "청록" },
      { id: "lilac",  bg: "#E0C8EC", text: "#3D1A4B", name: "라일락" },
      { id: "brown",  bg: "#E0C8A8", text: "#3D2308", name: "연갈" },
      { id: "gray",   bg: "#D8D8D8", text: "#252525", name: "회색" },
      { id: "beige",  bg: "#ECE0C8", text: "#3C2D0E", name: "베이지" },
    ];
    const DEFAULT_CATEGORY = { id: "_default", name: "일반", color: "gray" };

    function getNoticeColor(colorId) {
      const c = NOTICE_COLORS.find(c => c.id === colorId);
      return c || NOTICE_COLORS[8]; // 회색 기본
    }

    // 시간 표시 (방금/n분 전/...)
    function formatRelativeTime(ts) {
      if (!ts) return "";
      const now = Date.now();
      const diff = now - ts;
      const min = Math.floor(diff / 60000);
      if (min < 1) return "방금";
      if (min < 60) return `${min}분 전`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}시간 전`;
      const days = Math.floor(hr / 24);
      if (days < 7) return `${days}일 전`;
      const d = new Date(ts);
      return `${d.getMonth() + 1}월 ${d.getDate()}일`;
    }

    // 공지 ID 생성
    function genNoticeId() {
      return `notice_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }
    function genCategoryId() {
      return `cat_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    // OFF 신청 시스템: 다음 달 monthKey
    function nextMonthKey(year, month) {
      const d = new Date(year, month, 1); // month는 1-based이므로 month로 넣으면 다음 달
      return getMonthKey(d.getFullYear(), d.getMonth() + 1);
    }
    function nextMonthInfo(year, month) {
      const d = new Date(year, month, 1);
      return { year: d.getFullYear(), month: d.getMonth() + 1 };
    }
    // 요청 데이터 헬퍼
    function getRequestAt(allRequests, monthKey, sabun, day) {
      const dKey = String(day).padStart(2, "0");
      return allRequests?.[monthKey]?.[sabun]?.[dKey] || null;
    }
    function getRequestsForDay(allRequests, monthKey, day, allUsers, teamFilter) {
      // teamFilter가 있으면 해당 팀 사람만 (A팀은 모든 A 포함, S-616만 등)
      const dKey = String(day).padStart(2, "0");
      const monthData = allRequests?.[monthKey] || {};
      const result = [];
      Object.entries(monthData).forEach(([sabun, sabunData]) => {
        const req = sabunData?.[dKey];
        if (!req) return;
        const user = allUsers[sabun];
        if (!user) return;
        if (teamFilter && user.team !== teamFilter) return;
        result.push({ sabun, ...req, name: user.name, team: user.team, hireDate: user.hireDate });
      });
      // 입사일 순 (오래된 사람 먼저)
      result.sort((a, b) => (a.hireDate || "").localeCompare(b.hireDate || ""));
      return result;
    }
    function getRequestCountForDay(allRequests, monthKey, day, allUsers, teamFilter) {
      return getRequestsForDay(allRequests, monthKey, day, allUsers, teamFilter).length;
    }

    // 시간 기반 디폴트 시프트 (main 팀이 사용)
    function getCurrentTimeShift() {
      const h = new Date().getHours();
      if (h >= 6 && h < 13) return "D";
      if (h >= 13 && h < 21) return "E";
      return "N";
    }

    function DayDetailModal({ year, month, day, me, allUsers, allDuties, clinicOverrides, dbHolidays, onClose, onNavigate }) {
      const monthKey = getMonthKey(year, month);
      const iso = isoDate(year, month, day);
      const dow = getWeekday(year, month, day);
      const clinic = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
      const holidayName = getHolidayName(iso, dbHolidays);

      const myDuty = getDutyAt(allDuties, monthKey, me.sabun, day);
      const myRawShift = myDuty?.shift;
      // V→O 변환 적용
      const myShift = myRawShift
        ? getDisplayShift(myRawShift, iso, dow, clinicOverrides, dbHolidays)
        : null;
      const myEffectiveTeam = getEffectiveTeam(myDuty, me.team);
      const myEffectiveRole = getEffectiveRole(myDuty);
      const myIsHelper = isManualHelper(myDuty);

      // selectedShift 디폴트
      // - 본인이 D/E/N이면 그 시프트
      // - 아니고 본인이 main 팀이면 시간 기반
      // - 아니면 null
      const initialSelected = (() => {
        if (HANDOVER_SHIFTS.includes(myShift)) return myShift;
        if (me.team === "main") return getCurrentTimeShift();
        return null;
      })();
      const [selectedShift, setSelectedShift] = useState(initialSelected);

      const handover = selectedShift ? getHandoverConfig(selectedShift) : null;
      // 인계는 selectedShift == myShift이고 본인 effective team이 main이 아닐 때만
      const showHandover = handover
        && myEffectiveTeam !== "main"
        && selectedShift === myShift;

      let prevPeople = [], nextPeople = [];
      let prevMK = monthKey, prevDay = day, nextMK = monthKey, nextDay = day;
      if (showHandover) {
        const pd = shiftDate(year, month, day, handover.prev.offset);
        prevMK = getMonthKey(pd.year, pd.month);
        prevDay = pd.day;
        const all = getPeopleByShift(allDuties, prevMK, prevDay, handover.prev.shift);
        prevPeople = all.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, prevMK, s, prevDay);
          return getEffectiveTeam(d, u.team) === myEffectiveTeam;
        });

        const nd = shiftDate(year, month, day, handover.next.offset);
        nextMK = getMonthKey(nd.year, nd.month);
        nextDay = nd.day;
        const allN = getPeopleByShift(allDuties, nextMK, nextDay, handover.next.shift);
        nextPeople = allN.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, nextMK, s, nextDay);
          return getEffectiveTeam(d, u.team) === myEffectiveTeam;
        });
      }

      // 라인업: selectedShift 있을 때만
      const showLineup = !!selectedShift;
      let lineup = null;
      if (showLineup) {
        // 그날 selectedShift인 모든 사람 (D/E/N)
        const directSabuns = getPeopleByShift(allDuties, monthKey, day, selectedShift);
        // V는 morning 진료일이면 O로 변환되어 사실상 사라짐 (인계/라인업도 X)
        // 여기서 V→O 변환된 사람을 직접 라인업에서 제외하기 위해 filter
        const filteredDirect = directSabuns.filter(s => {
          const d = getDutyAt(allDuties, monthKey, s, day);
          if (!d) return false;
          const disp = getDisplayShift(d.shift, iso, dow, clinicOverrides, dbHolidays);
          return disp === selectedShift;
        });
        // D 라인업: + main 팀의 M·V 근무자 (V는 morning 진료일이면 O로 변환되니 제외)
        // E 라인업: + main 팀의 M 근무자만 (V는 오후 없음)
        // N 라인업: 추가 없음
        let extraMain = [];
        if (selectedShift === "D") {
          const mAll = getPeopleByShift(allDuties, monthKey, day, "M");
          const vAll = getPeopleByShift(allDuties, monthKey, day, "V");
          // V는 displayShift가 V로 남아있는 경우만 (morning 진료일은 O가 되어 라인업 제외)
          const vKeep = vAll.filter(s => {
            const d = getDutyAt(allDuties, monthKey, s, day);
            const disp = getDisplayShift(d.shift, iso, dow, clinicOverrides, dbHolidays);
            return disp === "V";
          });
          extraMain = [...mAll, ...vKeep];
        } else if (selectedShift === "E") {
          extraMain = getPeopleByShift(allDuties, monthKey, day, "M");
        }
        // main 팀에 속한 사람만 추가 (effective team)
        const mainSabuns = extraMain.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, monthKey, s, day);
          return getEffectiveTeam(d, u.team) === "main";
        });
        // 합쳐서 그룹핑 (중복 제거)
        const allSabuns = Array.from(new Set([...filteredDirect, ...mainSabuns]));
        lineup = groupByEffectiveTeam(allSabuns, allUsers, allDuties, monthKey, day);
      }

      const dateColorClass = clinic;
      const sColor = myShift ? shiftColor(myShift) : null;
      const myTeamColor = teamColor(myEffectiveTeam);

      // 본인 큰 글씨 색: 항상 시프트 색 (helper여도 시프트 색)
      const bigBg = sColor?.bg;
      const bigText = sColor?.text;

      // 가운데 줄 (M 또는 V)
      // - rawShift M → [M], rawShift V → [V] (V→O 변환 시 표시 안 함), rawShift T(호환) → [T]
      const showMidRow = (myRawShift === "M" || myRawShift === "T")
        || (myRawShift === "V" && myShift === "V"); // V가 O로 변환되면 표시 안 함
      const midShift = (() => {
        if (myRawShift === "M") return "M";
        if (myRawShift === "T") return "T";
        if (myRawShift === "V" && myShift === "V") return "V";
        return null;
      })();

      const shiftTabClass = (s) => {
        const base = `shift-tab shift-${s}`;
        return selectedShift === s ? `${base} active` : base;
      };

      const handleShiftTabClick = (s) => {
        if (selectedShift === s) setSelectedShift(null);
        else setSelectedShift(s);
      };

      // 좌우 swipe 핸들러
      const swipeStartRef = useRef(null);
      const handleTouchStart = (e) => {
        const t = e.touches[0];
        swipeStartRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
      };
      const handleTouchEnd = (e) => {
        const start = swipeStartRef.current;
        if (!start) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        const dt = Date.now() - start.time;
        swipeStartRef.current = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) {
          if (dx < 0) onNavigate && onNavigate(1);
          else onNavigate && onNavigate(-1);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}
            onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            <div className="modal-header">
              <div>
                <p className={`day-modal-date ${dateColorClass}`} style={{ marginBottom: holidayName ? 4 : 8 }}>
                  <span className="day-num">{month}월 {day}일</span>
                  <span className="weekday">({WEEKDAYS_KR[dow]})</span>
                </p>
                <p className="day-clinic-tag">
                  {holidayName && <span style={{ color: "var(--c-closed)", fontWeight: 600 }}>{holidayName} · </span>}
                  진료 {CLINIC_LABELS[clinic]}
                </p>
              </div>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="day-section">
              <p className="day-section-title">내 근무</p>

              <div className="myshift-display">
                {myShift ? (
                  <div className="myshift-big" style={{ background: bigBg, color: bigText }}>
                    <span style={myIsHelper ? {
                      textDecoration: "underline",
                      textDecorationThickness: "2px",
                      textUnderlineOffset: "4px"
                    } : {}}>{myShift}</span>
                    {myEffectiveRole && (
                      <span style={{ fontSize: 16, fontWeight: 600, marginLeft: 4, opacity: 0.8 }}>
                        {ROLE_SHORT[myEffectiveRole]}
                      </span>
                    )}
                  </div>
                ) : (
                  <div className="myshift-big empty">듀티 없음</div>
                )}
                {myShift && (
                  <div className="myshift-meta">
                    <span>{SHIFT_LABELS[myShift] || myShift}</span>
                    {myEffectiveRole && <span className="role-badge">{ROLE_LABELS[myEffectiveRole]}</span>}
                    <span className="meta-team" style={{ background: myTeamColor.bg, color: myTeamColor.text }}>
                      {myEffectiveTeam}
                    </span>
                    {myIsHelper && myEffectiveTeam !== "main" && <span className="role-badge">helper</span>}
                  </div>
                )}
              </div>

              {/* M 또는 V 단일 표시 줄 */}
              {showMidRow && midShift && (
                <div className="shift-tabs-row row-tmv-1">
                  <button
                    className={`shift-tab read-only active shift-${midShift}`}
                    type="button" disabled>
                    {midShift}
                  </button>
                </div>
              )}

              {/* D/E/N 탭 */}
              <div className="shift-tabs-row row-den">
                {["D", "E", "N"].map(s => (
                  <button key={s}
                    className={shiftTabClass(s)}
                    onClick={() => handleShiftTabClick(s)}
                    type="button">
                    {s}
                  </button>
                ))}
              </div>
              <p className="edit-hint">D/E/N 탭하여 인계·라인업 전환 · 셀 길게 눌러 수정 · 좌우 swipe로 날짜 이동</p>
            </div>

            {showHandover && (
              <div className="day-section">
                <p className="day-section-title">{myEffectiveTeam}팀 {selectedShift} 인수인계</p>
                <HandoverRow direction="prev" config={handover.prev}
                  people={prevPeople} allUsers={allUsers} allDuties={allDuties}
                  monthKey={prevMK} day={prevDay}
                  mySabun={me.sabun} myTeam={myEffectiveTeam} />
                <HandoverRow direction="next" config={handover.next}
                  people={nextPeople} allUsers={allUsers} allDuties={allDuties}
                  monthKey={nextMK} day={nextDay}
                  mySabun={me.sabun} myTeam={myEffectiveTeam} />
              </div>
            )}

            {showLineup && lineup && (
              <div className="day-section">
                <p className="day-section-title">{selectedShift} 라인업</p>
                <LineupBlock lineup={lineup} mySabun={me.sabun} allUsers={allUsers}
                  monthKey={monthKey} day={day} allDuties={allDuties}
                  iso={iso} dayOfWeek={dow}
                  clinicOverrides={clinicOverrides} dbHolidays={dbHolidays} />
              </div>
            )}
          </div>
        </div>
      );
    }

    function HandoverRow({ direction, config, people, allUsers, allDuties, monthKey, day, mySabun, myTeam }) {
      const arrow = direction === "prev" ? "←" : "→";
      return (
        <div className="handover-row">
          <div className="handover-arrow">{arrow}</div>
          <div className="handover-info">
            <div className="handover-meta">
              {direction === "prev" ? "받음" : "넘김"} · {config.labelTime}
            </div>
            {people.length === 0 ? (
              <div className="handover-empty">
                {direction === "prev" ? "이전번 근무자가 없어요" : "다음번 근무자가 없어요"}
              </div>
            ) : (
              <div className="handover-people">
                {people.map(s => {
                  const duty = getDutyAt(allDuties, monthKey, s, day);
                  return (
                    <PersonChip key={s} sabun={s} user={allUsers[s]}
                      isMe={s === mySabun} teamForColor={myTeam}
                      role={getEffectiveRole(duty)}
                      isHelper={isManualHelper(duty)} />
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function LineupBlock({ lineup, mySabun, allUsers, monthKey, day, allDuties, iso, dayOfWeek, clinicOverrides, dbHolidays }) {
      return (
        <div>
          {TEAMS.map(team => {
            const sabuns = lineup[team] || [];
            if (sabuns.length === 0) return null;
            const c = teamColor(team);
            return (
              <div key={team} className="lineup-team">
                <div className="lineup-team-label">
                  <span className="team-badge" style={{ background: c.bg, color: c.text }}>{team}</span>
                </div>
                <div className="lineup-people">
                  {sabuns.map(s => {
                    const duty = getDutyAt(allDuties, monthKey, s, day);
                    const isHelper = isManualHelper(duty);
                    const showHelperBadge = isHelper && team !== "main";
                    // main 팀 사람의 시프트 라벨 (D/E 라인업에 합쳐진 경우 구분)
                    const personRawShift = duty?.shift;
                    const personDispShift = personRawShift
                      ? getDisplayShift(personRawShift, iso, dayOfWeek, clinicOverrides, dbHolidays)
                      : null;
                    const showShiftLabel = team === "main" && personDispShift;
                    return (
                      <PersonChip key={s}
                        sabun={s} user={allUsers[s]}
                        isMe={s === mySabun}
                        teamForColor={team}
                        role={getEffectiveRole(duty)}
                        isHelper={showHelperBadge}
                        chipShift={showShiftLabel ? personDispShift : null} />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function PersonChip({ sabun, user, isMe, teamForColor, role, isHelper, chipShift }) {
      if (!user) {
        return <span className="person-chip" style={{
          background: "var(--surface-alt)", color: "var(--text-soft)"
        }}>{sabun}</span>;
      }
      const c = teamColor(teamForColor || user.team);
      return (
        <span className={`person-chip ${isMe ? "me" : ""} ${isHelper ? "helper-chip" : ""}`}
          style={{ background: c.bg, color: c.text }}>
          {chipShift && <span className="role-tag" style={{ fontWeight: 700, marginRight: 2 }}>{chipShift}</span>}
          {user.name}
          {role && <span className="role-tag">({ROLE_LABELS[role]})</span>}
          {isHelper && <span className="role-tag">·helper</span>}
        </span>
      );
    }

    // ============================================================
    // <DutyQuickEdit>
    // ============================================================
    function DutyQuickEdit({ year, month, day, me, currentDuty, onClose }) {
      const initialShift = currentDuty?.shift || "O";
      const initialRole = getEffectiveRole(currentDuty);
      const initialHelperOpt = (() => {
        if (!currentDuty?.helper) return null;
        const h = currentDuty.helper;
        if (h.team === "A") {
          return HELPER_OPTIONS.find(o => o.team === "A" && o.role === (h.role || null))?.key
              || HELPER_OPTIONS.find(o => o.team === "A" && o.role === "act")?.key;
        }
        return HELPER_OPTIONS.find(o => o.team === h.team)?.key || null;
      })();

      const [shift, setShift] = useState(initialShift);
      const [role, setRole] = useState(initialRole);
      const [helperOn, setHelperOn] = useState(!!initialHelperOpt);
      const [helperKey, setHelperKey] = useState(initialHelperOpt);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const helperOpt = helperKey ? HELPER_OPTIONS.find(o => o.key === helperKey) : null;
      const helperTeam = helperOpt?.team;

      // 현재 컨텍스트가 main인지: 본인 main + helper 안 켰거나, helper로 main 갔거나
      const isMainContext = (!helperOn && me.team === "main") || (helperOn && helperTeam === "main");
      const allowedShifts = isMainContext ? ALL_SHIFTS : BASIC_SHIFTS;
      const isRoleShift = ROLE_SHIFTS.includes(shift);
      const isAteam = me.team === "A";

      // shift가 허용 범위 밖으로 나가면 자동 D로 리셋
      useEffect(() => {
        if (!allowedShifts.includes(shift)) {
          setShift("D");
        }
      }, [allowedShifts, shift]);

      // shift가 D/E/N이 아니게 되면 role 초기화
      useEffect(() => {
        if (!isRoleShift) setRole(null);
      }, [isRoleShift]);

      // helper 토글 끄면 helperKey 초기화
      useEffect(() => {
        if (!helperOn) setHelperKey(null);
      }, [helperOn]);

      const pickHelper = (opt) => {
        if (helperKey === opt.key) {
          setHelperKey(null);
          return;
        }
        setHelperKey(opt.key);
        // main으로 가면 시프트 자동 M (현재 시프트가 BASIC인 경우만 변경)
        if (opt.team === "main" && BASIC_SHIFTS.includes(shift)) {
          setShift("M");
        }
      };

      const save = async () => {
        setErr("");
        const monthKey = getMonthKey(year, month);
        const dKey = String(day).padStart(2, "0");
        const path = `duties/${monthKey}/${me.sabun}/${dKey}`;

        let payload;
        if (shift === "O") {
          payload = { shift: "O", team: me.team };
        } else {
          payload = { shift, team: me.team };

          if (helperOn && helperKey) {
            const opt = HELPER_OPTIONS.find(o => o.key === helperKey);
            if (!opt) { setErr("helper 팀을 선택해 주세요."); return; }
            // helper.team이 본인 팀과 같으면 helper 무의미 → role만 남김
            if (opt.team === me.team) {
              if (opt.role && isRoleShift) payload.role = opt.role;
            } else {
              payload.helper = { team: opt.team };
              if (opt.role && isRoleShift) payload.helper.role = opt.role;
            }
          } else if (isAteam && isRoleShift && role) {
            // A팀이 helper 안 켜고 role 직접 선택
            payload.role = role;
          }
        }

        setBusy(true);
        try {
          await set(ref(db, path), payload);
          onClose();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      const removeIt = async () => {
        if (!confirm("이 날 듀티를 삭제할까요?")) return;
        setBusy(true);
        try {
          const monthKey = getMonthKey(year, month);
          const dKey = String(day).padStart(2, "0");
          await remove(ref(db, `duties/${monthKey}/${me.sabun}/${dKey}`));
          onClose();
        } catch (e) {
          console.error(e);
          setErr("삭제 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      // helper 토글 가능: D/E/N (O면 어차피 무의미, T/M/V는 main 전용이라 본인이 main이거나 이미 main helper)
      const canHelperToggle = isRoleShift || (isMainContext && (shift === "T" || shift === "M" || shift === "V"));
      // 더 단순: 항상 켤 수 있음. 사용자가 알아서.
      const showHelperToggle = true;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 {day}일 수정</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="modal-fields">
              <div className="field">
                <label>근무</label>
                <div className={isMainContext ? "seg seg-7" : "seg seg-4"}>
                  {allowedShifts.map(c => (
                    <button key={c} className={shift === c ? "active" : ""}
                      onClick={() => setShift(c)} type="button">{c}</button>
                  ))}
                </div>
              </div>

              {isRoleShift && isAteam && !helperOn && (
                <div className="field">
                  <div className="field-label-row">
                    <span className="field-label">A팀 역할</span>
                    <span className="field-hint">없음 = 일반 근무</span>
                  </div>
                  <div className="seg seg-4">
                    <button className={!role ? "active" : ""} onClick={() => setRole(null)} type="button">없음</button>
                    <button className={role === "front" ? "active" : ""} onClick={() => setRole("front")} type="button">앞</button>
                    <button className={role === "back" ? "active" : ""} onClick={() => setRole("back")} type="button">뒤</button>
                    <button className={role === "act" ? "active" : ""} onClick={() => setRole("act")} type="button">act</button>
                  </div>
                </div>
              )}

              {showHelperToggle && (
                <>
                  <button className={`toggle-row ${helperOn ? "expanded" : ""}`}
                    onClick={() => setHelperOn(!helperOn)} type="button">
                    <div>
                      <div className="toggle-label">
                        다른 팀에서 근무
                        {helperKey && (
                          <span style={{
                            fontSize: 11, fontWeight: 600, color: "var(--accent)",
                            marginLeft: 8, padding: "1px 6px",
                            background: "var(--surface-alt)", borderRadius: 999
                          }}>
                            {HELPER_OPTIONS.find(o => o.key === helperKey)?.label}
                          </span>
                        )}
                      </div>
                    </div>
                    <span className={`chevron ${helperOn ? "up" : ""}`}>⌄</span>
                  </button>

                  {helperOn && (
                    <div className="field">
                      <div className="helper-team-grid">
                        {HELPER_OPTIONS.map(opt => (
                          <button key={opt.key}
                            className={helperKey === opt.key ? "active" : ""}
                            onClick={() => pickHelper(opt)} type="button">
                            {opt.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              )}

              {(shift === "T" || shift === "M") && isMainContext && (
                <div className="duty-help">
                  {shift === "T" ? "T(Top, 호환용)" : "M(Mid, 8am-5pm)"} 근무는 main 팀에 표시돼요.
                </div>
              )}

              {err && <div className="auth-error">{err}</div>}
            </div>

            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy}>
                {busy ? "저장 중…" : "저장"}
              </button>
              {currentDuty && (
                <button className="btn-ghost" onClick={removeIt} disabled={busy}
                  style={{ color: "var(--c-closed)" }}>
                  이 날 듀티 삭제
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <DutyInputModal>
    // ============================================================
    function DutyInputModal({ year, month, sabun, myTeam, currentDuties, allUsers, allDuties, seniority, onClose }) {
      const { daysInMonth } = getMonthInfo(year, month);
      const [mode, setMode] = useState("me"); // "me" | "bulk"

      const initial = useMemo(() => serializeDuties(currentDuties, daysInMonth), []);

      const [text, setText] = useState(initial);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const parsed = useMemo(() => {
        try { return parseDutyStringV3(text, myTeam); } catch { return null; }
      }, [text, myTeam]);

      const save = async () => {
        setErr("");
        let codes;
        try { codes = parseDutyStringV3(text, myTeam); }
        catch (e) { setErr(e.message); return; }
        if (codes.length > daysInMonth) {
          setErr(`이 달은 ${daysInMonth}일까지인데 ${codes.length}개가 입력됐어요.`);
          return;
        }
        setBusy(true);
        try {
          const monthKey = getMonthKey(year, month);
          const updates = {};
          for (let d = 1; d <= daysInMonth; d++) {
            const dKey = String(d).padStart(2, "0");
            const path = `duties/${monthKey}/${sabun}/${dKey}`;
            if (d <= codes.length) {
              const code = codes[d - 1];
              const payload = { shift: code.shift, team: myTeam };
              if (code.role) payload.role = code.role;
              updates[path] = payload;
            } else {
              updates[path] = null;
            }
          }
          await update(ref(db), updates);
          onClose();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      // 도움말 분기
      const teamHelp = myTeam === "main" ? (
        <>
          <strong>main 팀 시프트</strong>: <code>M</code> Mid · <code>V</code> 반차
        </>
      ) : myTeam === "A" ? (
        <>
          <strong>A팀 역할</strong>: D/E/N 뒤에 <code>1</code>/<code>앞</code>=앞, <code>2</code>/<code>뒤</code>=뒤, <code>a</code>=act<br />
          예: <code>D1E뒤Na</code> = D(앞), E(뒤), N(act)
        </>
      ) : null;

      if (mode === "bulk") {
        return (
          <BulkDutyInput
            year={year} month={month}
            allUsers={allUsers} allDuties={allDuties} seniority={seniority}
            onBack={() => setMode("me")}
            onClose={onClose} />
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 듀티 입력</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="mode-switch">
              <span className="mode-label">본인 듀티 입력 중</span>
              <button onClick={() => setMode("bulk")}>전체 일괄 입력 →</button>
            </div>

            <div className="modal-fields">
              <div className="duty-help">
                1일부터 순서대로 한 글자씩 입력. 공백/줄바꿈 무시.<br />
                <code>D</code> Day · <code>E</code> Evening · <code>N</code> Night · <code>O</code> Off
                {teamHelp && <><br /><br />{teamHelp}</>}
                <br /><br />
                helper 근무는 일별 캘린더에서 수정해 주세요.
              </div>
              <textarea className="duty-textarea" value={text}
                onChange={e => setText(e.target.value)}
                placeholder={
                  myTeam === "main" ? "예: MMOOMMOM..." :
                  myTeam === "A" ? "예: D1E뒤NaOOD..." : "예: DENNOOD..."}
                autoFocus />
              <div className="day-counter">
                {parsed ? `${parsed.length}일` : "—"} / {daysInMonth}일
              </div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy || !text.trim()}>
                {busy ? "저장 중…" : "저장"}
              </button>
              <p style={{ fontSize: 11, color: "var(--text-soft)", textAlign: "center", margin: 0 }}>
                ※ 이 입력은 월 전체를 덮어써요. helper 설정은 일별 수정에서.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <BulkDutyInput> — 전체 사용자 듀티 일괄 입력
    // 형식: 한 줄 = 한 사람. "[팀] 이름 듀티텍스트" 또는 "이름 듀티텍스트"
    // 정책 B: 성공한 줄만 저장, 실패한 줄 보고
    // ============================================================
    function BulkDutyInput({ year, month, allUsers, allDuties, seniority, onBack, onClose }) {
      const { daysInMonth } = getMonthInfo(year, month);
      const monthKey = getMonthKey(year, month);

      // prefill 텍스트 생성
      const initialText = useMemo(() => {
        const groups = groupUsersByTeam(allUsers, seniority);
        const lines = [];
        for (const team of TEAMS) {
          for (const u of groups[team]) {
            const monthData = allDuties[monthKey]?.[u.sabun] || {};
            const dutyMap = {};
            Object.keys(monthData).forEach(k => {
              const v = normalizeDuty(monthData[k]);
              if (v && !v.helper) {  // helper 데이터는 일괄 입력에서 표현 못 하므로 제외
                dutyMap[parseInt(k, 10)] = v;
              }
            });
            const dutyText = serializeDuties(dutyMap, daysInMonth).replace(/\s/g, "");
            lines.push(`[${team}] ${u.name} ${dutyText}`);
          }
        }
        return lines.join("\n");
      }, [allUsers, allDuties, seniority, monthKey, daysInMonth]);

      const [text, setText] = useState(initialText);
      const [busy, setBusy] = useState(false);
      const [results, setResults] = useState(null); // {ok: [], fail: [{line, name, reason}]}

      // 이름 → 사용자 lookup (allUsers 안에서 동명이인 검사)
      const nameMap = useMemo(() => {
        const m = {};
        Object.entries(allUsers).forEach(([sabun, u]) => {
          if (!m[u.name]) m[u.name] = [];
          m[u.name].push({ sabun, ...u });
        });
        return m;
      }, [allUsers]);

      const submit = async () => {
        setBusy(true);
        setResults(null);

        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        const ok = [];
        const fail = [];
        const updates = {};

        for (const line of lines) {
          const parts = line.split(/\s+/);
          let name, dutyText;
          if (parts[0]?.startsWith("[")) {
            name = parts[1];
            dutyText = parts.slice(2).join("");
          } else {
            name = parts[0];
            dutyText = parts.slice(1).join("");
          }
          if (!name) {
            fail.push({ line, name: "(이름 없음)", reason: "이름이 비어있어요" });
            continue;
          }
          const matches = nameMap[name];
          if (!matches || matches.length === 0) {
            fail.push({ line, name, reason: "등록된 사용자가 아니에요" });
            continue;
          }
          if (matches.length > 1) {
            fail.push({ line, name, reason: `동명이인 ${matches.length}명 존재 — 사번으로 구분 필요` });
            continue;
          }
          const user = matches[0];
          let codes;
          try {
            codes = parseDutyStringV3(dutyText, user.team);
          } catch (e) {
            fail.push({ line, name, reason: e.message });
            continue;
          }
          if (codes.length > daysInMonth) {
            fail.push({ line, name, reason: `${daysInMonth}일을 초과 (${codes.length}일)` });
            continue;
          }
          // updates에 적용
          for (let d = 1; d <= daysInMonth; d++) {
            const dKey = String(d).padStart(2, "0");
            const path = `duties/${monthKey}/${user.sabun}/${dKey}`;
            if (d <= codes.length) {
              const code = codes[d - 1];
              const payload = { shift: code.shift, team: user.team };
              if (code.role) payload.role = code.role;
              updates[path] = payload;
            } else {
              updates[path] = null;
            }
          }
          ok.push({ name, count: codes.length });
        }

        try {
          if (Object.keys(updates).length > 0) {
            await update(ref(db), updates);
          }
          setResults({ ok, fail });
        } catch (e) {
          console.error(e);
          alert("저장 중 오류 — 다시 시도해 주세요.");
        }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 전체 일괄 입력</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="mode-switch">
              <span className="mode-label">전체 일괄 입력 중</span>
              <button onClick={onBack}>← 본인 입력으로</button>
            </div>

            <div className="modal-fields">
              <div className="duty-help">
                한 줄 = 한 사람. 형식: <code>[팀] 이름 듀티</code> 또는 <code>이름 듀티</code><br />
                대괄호 [팀]은 시각적 구분용 — 저장 시 무시. 첫 단어가 이름.<br />
                각 사람의 팀에 맞는 입력 규칙 적용 (A팀 1/2/a, main M/V).<br />
                <strong>helper 근무는 일괄 입력에 표시되지 않으니, 일별 캘린더에서 별도로 설정.</strong>
              </div>
              <textarea className="bulk-textarea" value={text}
                onChange={e => setText(e.target.value)} spellCheck={false} />

              {results && (
                <div className="bulk-result">
                  {results.ok.length > 0 && (
                    <div className="row ok">
                      ✓ <strong>{results.ok.length}명 저장됨</strong>: {results.ok.map(r => `${r.name}(${r.count}일)`).join(", ")}
                    </div>
                  )}
                  {results.fail.length > 0 && (
                    <>
                      <div className="row fail">
                        ✗ <strong>{results.fail.length}건 실패</strong>:
                      </div>
                      {results.fail.map((f, i) => (
                        <div key={i} className="row fail" style={{ paddingLeft: 14 }}>
                          {f.name} — {f.reason}
                        </div>
                      ))}
                    </>
                  )}
                  {results.fail.length === 0 && results.ok.length > 0 && (
                    <div style={{ color: "var(--text-soft)", marginTop: 6, fontSize: 11 }}>
                      모든 줄 저장 완료
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={submit} disabled={busy}>
                {busy ? "저장 중…" : "성공한 줄만 저장"}
              </button>
              <p style={{ fontSize: 11, color: "var(--text-soft)", textAlign: "center", margin: 0 }}>
                ※ 실패한 줄은 저장 안 됨. 결과 확인 후 고쳐서 다시 시도.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ProfileEdit({ me, onCancel, onSaved }) {
      const [name, setName] = useState(me.name);
      const [team, setTeam] = useState(me.team);
      const [hireDate, setHireDate] = useState(isoToHireDate(me.hireDate));
      const [phone, setPhone] = useState(formatPhone(me.phone || ""));
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const save = async () => {
        setErr("");
        if (!name.trim()) return setErr("이름을 입력해 주세요.");
        const hireISO = hireDateToISO(hireDate);
        if (!hireISO) return setErr("입사일은 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        setBusy(true);
        try {
          const newData = {
            name: name.trim(), team, hireDate: hireISO,
            phone: phone.replace(/\D/g, ""),
          };
          await update(ref(db, `users/${me.sabun}`), newData);
          onSaved(newData);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onCancel}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">정보 수정</h2>
              <button className="modal-close" onClick={onCancel} aria-label="닫기">×</button>
            </div>
            <div className="modal-fields">
              <div className="field"><label>이름</label>
                <input value={name} onChange={e => setName(e.target.value)} /></div>
              <div className="field"><label>팀</label>
                <select value={team} onChange={e => setTeam(e.target.value)}>
                  {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select></div>
              <div className="field"><label>입사일 (YYYYMMDD)</label>
                <input type="tel" inputMode="numeric" value={hireDate}
                  onChange={e => setHireDate(formatHireDateInput(e.target.value))} /></div>
              <div className="field"><label>전화번호</label>
                <input type="tel" inputMode="numeric" value={phone}
                  onChange={e => setPhone(formatPhone(e.target.value))} /></div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy}>
                {busy ? "저장 중…" : "저장"}
              </button>
              <button className="btn-ghost" onClick={onCancel}>취소</button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <PasswordChangeModal>
    // ============================================================
    function PasswordChangeModal({ sabun, onClose }) {
      const [pw, setPw] = useState("");
      const [pw2, setPw2] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);
      const [done, setDone] = useState(false);

      const submit = async () => {
        setErr("");
        if (pw.length < 4) return setErr("비밀번호는 4자 이상이어야 해요.");
        if (pw !== pw2) return setErr("비밀번호가 일치하지 않아요.");
        setBusy(true);
        try {
          const newHash = await hashPassword(sabun, pw);
          await update(ref(db, `users/${sabun}`), { loginHash: newHash });
          setDone(true);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">비밀번호 변경</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            {done ? (
              <>
                <p style={{ fontSize: 14, color: "var(--text)", margin: "0 0 18px" }}>
                  비밀번호가 변경됐어요.
                </p>
                <div className="modal-actions">
                  <button className="btn-primary" onClick={onClose}>닫기</button>
                </div>
              </>
            ) : (
              <>
                <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 14px" }}>
                  현재 로그인 상태에서 새 비밀번호로 바로 변경돼요.
                </p>
                <div className="modal-fields">
                  <div className="field"><label>새 비밀번호</label>
                    <input type="password" value={pw} onChange={e => setPw(e.target.value)} autoFocus /></div>
                  <div className="field"><label>새 비밀번호 확인</label>
                    <input type="password" value={pw2} onChange={e => setPw2(e.target.value)} /></div>
                  {err && <div className="auth-error">{err}</div>}
                </div>
                <div className="modal-actions">
                  <button className="btn-primary" onClick={submit} disabled={busy}>
                    {busy ? "저장 중…" : "변경"}
                  </button>
                  <button className="btn-ghost" onClick={onClose}>취소</button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // <NoticesModal> — 공지 전체 리스트 + 작성/카테고리 관리 라우팅
    // ============================================================
    function NoticesModal({ me, notices, noticeCategories, admins, onClose }) {
      const [view, setView] = useState("list");
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        Object.keys(notices).forEach(id => {
          localStorage.setItem(`notice_read_${id}`, "true");
        });
      }, []);

      const noticeList = useMemo(() =>
        Object.entries(notices)
          .map(([id, n]) => ({ id, ...n }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
      , [notices]);

      const isAdmin = isAdminUser(me, admins);

      const handleDelete = async (id) => {
        if (!confirm("이 공지를 삭제할까요?")) return;
        try {
          await remove(ref(db, `notices/${id}`));
        } catch (e) {
          console.error(e); alert("삭제 실패");
        }
      };

      if (view === "editor") {
        return (
          <NoticeEditor
            me={me}
            existingNotice={editingId ? { id: editingId, ...notices[editingId] } : null}
            noticeCategories={noticeCategories}
            onBack={() => { setView("list"); setEditingId(null); }}
            onGoCategoryEditor={() => setView("category-editor")}
            onClose={onClose} />
        );
      }
      if (view === "category-editor") {
        return (
          <NoticeCategoryEditor
            me={me} admins={admins}
            noticeCategories={noticeCategories}
            onBack={() => setView("editor")}
            onClose={onClose} />
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">📢 공지</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            {noticeList.length === 0 ? (
              <div className="notice-list-empty">아직 공지가 없어요.</div>
            ) : (
              <div>
                {noticeList.map(n => {
                  const cat = noticeCategories[n.category];
                  const colorId = cat?.color || n.categoryColor || "gray";
                  const c = getNoticeColor(colorId);
                  const canEdit = n.authorId === me.sabun;
                  const canDelete = n.authorId === me.sabun || isAdmin;
                  return (
                    <div key={n.id} className="notice-list-row">
                      <div className="notice-list-meta">
                        {cat && (
                          <span className="notice-category-tag"
                            style={{ background: c.bg, color: c.text }}>
                            {cat.name}
                          </span>
                        )}
                        <span className="author">{n.authorName}</span>
                        <span>·</span>
                        <span>{formatRelativeTime(n.createdAt)}</span>
                      </div>
                      <div className="notice-list-text">{n.text}</div>
                      {(canEdit || canDelete) && (
                        <div className="notice-list-actions">
                          {canEdit && (
                            <button className="notice-action-btn"
                              onClick={() => { setEditingId(n.id); setView("editor"); }}>수정</button>
                          )}
                          {canDelete && (
                            <button className="notice-action-btn danger"
                              onClick={() => handleDelete(n.id)}>삭제</button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            <div className="modal-actions" style={{ marginTop: 16 }}>
              <button className="btn-primary"
                onClick={() => { setEditingId(null); setView("editor"); }}>
                + 새 공지 작성
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <NoticeEditor> — 공지 작성/수정
    // ============================================================
    function NoticeEditor({ me, existingNotice, noticeCategories, onBack, onGoCategoryEditor, onClose }) {
      const [text, setText] = useState(existingNotice?.text || "");
      const [categoryId, setCategoryId] = useState(existingNotice?.category || "_default");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const categoryList = useMemo(() => {
        const arr = Object.entries(noticeCategories).map(([id, c]) => ({ id, ...c }));
        return [{ id: "_default", name: DEFAULT_CATEGORY.name, color: DEFAULT_CATEGORY.color }, ...arr];
      }, [noticeCategories]);

      const submit = async () => {
        setErr("");
        if (!text.trim()) return setErr("내용을 입력해 주세요.");
        if (text.length > 500) return setErr("500자 이내로 작성해 주세요.");

        const cat = categoryList.find(c => c.id === categoryId);
        const colorId = cat?.color || "gray";

        setBusy(true);
        try {
          if (existingNotice) {
            // 수정 — 본인이 작성자일 때만
            await update(ref(db, `notices/${existingNotice.id}`), {
              text: text.trim(),
              category: categoryId === "_default" ? null : categoryId,
              categoryColor: colorId,
            });
          } else {
            // 신규
            const id = genNoticeId();
            await set(ref(db, `notices/${id}`), {
              text: text.trim(),
              authorId: me.sabun,
              authorName: me.name,
              category: categoryId === "_default" ? null : categoryId,
              categoryColor: colorId,
              createdAt: Date.now(),
            });
          }
          onBack();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{existingNotice ? "공지 수정" : "새 공지"}</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="mode-switch">
              <button onClick={onBack}>← 목록으로</button>
              <button onClick={onGoCategoryEditor} style={{ background: "var(--surface-alt)" }}>
                ⚙ 카테고리
              </button>
            </div>

            <div className="modal-fields">
              <div className="field">
                <label>카테고리</label>
                <div className="category-select">
                  {categoryList.map(c => {
                    const col = getNoticeColor(c.color);
                    const active = categoryId === c.id;
                    return (
                      <button key={c.id}
                        className={active ? "active" : ""}
                        style={active ? { background: col.bg, color: col.text } : {}}
                        onClick={() => setCategoryId(c.id)}>
                        {c.name}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="field">
                <label>내용 ({text.length}/500)</label>
                <textarea className="duty-textarea"
                  style={{ minHeight: 120, letterSpacing: 0, fontFamily: "inherit", fontSize: 15 }}
                  value={text} onChange={e => setText(e.target.value.slice(0, 500))}
                  placeholder="공지 내용을 입력해 주세요…" autoFocus />
              </div>

              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={submit} disabled={busy || !text.trim()}>
                {busy ? "저장 중…" : (existingNotice ? "수정" : "공지 등록")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <NoticeCategoryEditor> — 카테고리 추가/수정/삭제
    // ============================================================
    function NoticeCategoryEditor({ me, admins, noticeCategories, onBack, onClose }) {

      const [newName, setNewName] = useState("");
      const [newColor, setNewColor] = useState("gray");
      const [editingId, setEditingId] = useState(null);

      const [editColor, setEditColor] = useState("gray");
      const [busy, setBusy] = useState(false);

      const isAdmin = isAdminUser(me, admins);
      const categoryList = useMemo(() =>
        Object.entries(noticeCategories).map(([id, c]) => ({ id, ...c }))
      , [noticeCategories]);

      const addCategory = async () => {
        if (!newName.trim()) return;
        setBusy(true);
        try {
          const id = genCategoryId();
          await set(ref(db, `noticeCategories/${id}`), {
            name: newName.trim(),
            color: newColor,
            createdBy: me.sabun,
          });
          setNewName(""); setNewColor("gray"); setAdding(false);
        } catch (e) {
          console.error(e); alert("저장 실패");
        }
        setBusy(false);
      };

      const saveEdit = async () => {
        if (!editName.trim()) return;
        setBusy(true);
        try {
          await update(ref(db, `noticeCategories/${editingId}`), {
            name: editName.trim(),
            color: editColor,
          });
          setEditingId(null);
        } catch (e) {
          console.error(e); alert("저장 실패");
        }
        setBusy(false);
      };

      const removeCategory = async (id, cat) => {
        const canDelete = cat.createdBy === me.sabun || isAdmin;
        if (!canDelete) { alert("만든 사람 또는 admin만 삭제 가능해요."); return; }
        if (!confirm(`'${cat.name}' 카테고리를 삭제할까요?\n(이미 이 카테고리로 작성된 공지는 '일반'으로 표시됩니다.)`)) return;
        try {
          await remove(ref(db, `noticeCategories/${id}`));
        } catch (e) {
          console.error(e); alert("삭제 실패");

      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">카테고리 관리</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="mode-switch">
              <button onClick={onBack}>← 공지로</button>
            </div>

            {categoryList.length === 0 && !adding && (
              <p style={{ fontSize: 13, color: "var(--text-soft)", padding: "16px 0", textAlign: "center" }}>
                아직 카테고리가 없어요. 추가해 보세요.
              </p>
            )}

            {categoryList.map(c => {
              const col = getNoticeColor(c.color);
              const canEdit = c.createdBy === me.sabun || isAdmin;
              if (editingId === c.id) {
                return (
                  <div key={c.id} style={{ padding: "14px 0", borderBottom: "1px solid var(--border)" }}>
                    <div className="field">
                      <label>이름</label>
                      <input value={editName} onChange={e => setEditName(e.target.value)} />
                    </div>
                    <div className="field" style={{ marginTop: 10 }}>
                      <label>색</label>
                      <div className="color-grid">
                        {NOTICE_COLORS.map(opt => (
                          <button key={opt.id} type="button"
                            className={`color-swatch ${editColor === opt.id ? "active" : ""}`}
                            style={{ background: opt.bg }}
                            onClick={() => setEditColor(opt.id)} />
                        ))}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                      <button className="btn-primary" onClick={saveEdit} disabled={busy} style={{ flex: 1 }}>
                        저장
                      </button>
                      <button className="btn-ghost" onClick={() => setEditingId(null)}>취소</button>

              return (
                <div key={c.id} className="category-row">
                  <span className="cat-name" style={{ background: col.bg, color: col.text }}>
                    {c.name}
                  </span>
                  {canEdit && (
                    <>
                      <button className="notice-action-btn"
                        onClick={() => {
                          setEditingId(c.id);
                          setEditName(c.name);
                          setEditColor(c.color);
                        }}>수정</button>
                      <button className="notice-action-btn danger"
                        onClick={() => removeCategory(c.id, c)}>삭제</button>
                    </>

            })}

            {adding ? (
              <div style={{ marginTop: 16, padding: 14, background: "var(--surface)", borderRadius: 10, border: "1px solid var(--border)" }}>
                <div className="field">
                  <label>이름</label>
                  <input value={newName} onChange={e => setNewName(e.target.value)}
                    placeholder="예: 회식, 교육, 긴급" autoFocus />
                </div>
                <div className="field" style={{ marginTop: 10 }}>
                  <label>색</label>
                  <div className="color-grid">

    // ============================================================
    // <ClinicHoursEditor>
    // ============================================================
    function ClinicHoursEditor({ clinicOverrides, dbHolidays, onClose }) {
      const today = todayInfo();
      const [year, setYear] = useState(today.year);
      const [month, setMonth] = useState(today.month);
      const [pickDate, setPickDate] = useState(null); // ISO

      const goPrev = () => {
        if (month === 1) { setYear(y => y - 1); setMonth(12); }
        else setMonth(m => m - 1);
      };
      const goNext = () => {
        if (month === 12) { setYear(y => y + 1); setMonth(1); }
        else setMonth(m => m + 1);
      };

      const { daysInMonth, startWeekday } = getMonthInfo(year, month);

      const setStatus = async (iso, status) => {
        try {
          if (status === null) {
            // 기본값으로 리셋
            await remove(ref(db, `clinicHours/${iso}`));
          } else {
            await set(ref(db, `clinicHours/${iso}`), status);
          }
          setPickDate(null);
        } catch (e) {
          console.error(e);
          alert("저장 실패");
        }
      };

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="ce-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const isOverride = !!clinicOverrides[iso];
        const isHoliday = !!getHolidayName(iso, dbHolidays);
        cells.push(
          <button key={day}
            className={`ce-cell ${status} ${isOverride ? "overridden" : ""} ${isHoliday ? "holiday-marker" : ""}`}
            onClick={() => setPickDate(iso)} type="button">
            {day}
          </button>
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">진료시간 수정</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 12px" }}>
              날짜를 탭하면 진료시간을 바꿀 수 있어요. 보라색 테두리는 직접 설정한 날.
            </p>

            <div className="month-nav" style={{ justifyContent: "center", marginBottom: 6 }}>
              <button onClick={goPrev}>‹</button>
              <span style={{ padding: "0 14px", fontSize: 15, fontWeight: 600 }}>
                {year}년 {month}월
              </span>
              <button onClick={goNext}>›</button>
            </div>

            <div className="cal-weekdays">
              {WEEKDAYS_KR.map((w, i) => (
                <div key={w} style={{
                  color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
                }}>{w}</div>
              ))}
            </div>
            <div className="ce-grid">{cells}</div>

            <div style={{ marginTop: 16, padding: 12, background: "var(--surface-alt)", borderRadius: 10, fontSize: 12, color: "var(--text-mute)", lineHeight: 1.6 }}>
              <span style={{ color: "var(--c-full)", fontWeight: 600 }}>● 검정</span> 오전·오후 진료 ·
              <span style={{ color: "var(--c-morning)", fontWeight: 600 }}> 파랑</span> 오전만 ·
              <span style={{ color: "var(--c-closed)", fontWeight: 600 }}> 빨강</span> 휴진<br />
              우상단 빨간 점은 공휴일 표시. 공휴일에 진료 있으면 색을 바꿔도 점은 유지돼요.
            </div>

            {pickDate && (
              <ClinicHoursPicker
                iso={pickDate}
                current={clinicOverrides[pickDate]}
                isHoliday={!!getHolidayName(pickDate, dbHolidays)}
                onClose={() => setPickDate(null)}
                onPick={(s) => setStatus(pickDate, s)} />
            )}
          </div>
        </div>
      );
    }

    function ClinicHoursPicker({ iso, current, isHoliday, onClose, onPick }) {
      const [y, m, d] = iso.split("-").map(Number);
      const dow = getWeekday(y, m, d);
      // 기본값 설명용
      const baseDefault = isHoliday ? "휴진" : (dow === 0 ? "휴진" : (dow === 6 ? "오전만" : "오전·오후"));

      return (
        <div className="modal-backdrop" onClick={onClose} style={{ zIndex: 200 }}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ paddingTop: 18 }}>
            <div className="modal-header">
              <h2 className="modal-title">{m}월 {d}일 ({WEEKDAYS_KR[dow]})</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="picker-options">
              <button className={!current ? "active" : ""} onClick={() => onPick(null)}>
                <span className="picker-dot" style={{ background: "var(--text-soft)" }}></span>
