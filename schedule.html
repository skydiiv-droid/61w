<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>61w 듀티</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#FAF7F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="61w">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <style>
    :root {
      --bg: #FAF7F0;
      --surface: #FFFFFF;
      --surface-alt: #F4F0E5;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.18);
      --text: #2A2826;
      --text-mute: #7A766F;
      --text-soft: #A8A39A;
      --accent: #5F5BAA;
      --c-full: #1F1B17;
      --c-morning: #2C5BB0;
      --c-closed: #C73E3E;
      --t-main-bg: #D8D5FB;  --t-main-text: #26215C;  --t-main-edge: #7F77DD;
      --t-A-bg:    #F8C9B6;  --t-A-text:    #4A1B0C;  --t-A-edge:    #D85A30;
      --t-B-bg:    #C8E2A0;  --t-B-text:    #173404;  --t-B-edge:    #639922;
      --t-C-bg:    #F2D29A;  --t-C-text:    #412402;  --t-C-edge:    #BA7517;
      --t-D-bg:    #F2BACE;  --t-D-text:    #4B1528;  --t-D-edge:    #D4537E;
      --t-S-bg:    #A6DBC4;  --t-S-text:    #04342C;  --t-S-edge:    #1D9E75;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px; line-height: 1.5;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 15px; }
    #root {
      max-width: 480px; margin: 0 auto; min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .auth-wrap { padding: 64px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
    .auth-title { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; margin: 0 0 4px; }
    .auth-sub { color: var(--text-mute); font-size: 14px; margin: 0 0 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--text-mute); font-weight: 500; }
    .field input, .field select {
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .btn-primary {
      padding: 14px; border: none; border-radius: 10px;
      background: var(--text); color: var(--bg); font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-ghost {
      padding: 12px; border: none; background: transparent;
      color: var(--text-mute); font-size: 14px;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .auth-error {
      padding: 10px 14px; background: #FCEBEB; color: #791F1F;
      border-radius: 8px; font-size: 13px;
    }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      background: var(--bg); position: sticky; top: 0; z-index: 10;
    }
    .top-bar-title {
      font-size: 17px; font-weight: 600; letter-spacing: -0.3px;
      display: flex; align-items: center; gap: 10px;
    }
    .top-bar-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: transparent; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--text);
    }
    .icon-btn:active { background: var(--surface-alt); }

    .month-nav { display: flex; align-items: center; gap: 6px; }
    .month-nav button {
      width: 28px; height: 28px; border: none; border-radius: 50%;
      background: transparent; color: var(--text-mute); font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .month-nav button:active { background: var(--surface-alt); }

    .cal-wrap { padding: 6px 8px 24px; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 4px 4px; }
    .cal-weekdays div {
      text-align: center; font-size: 11px; font-weight: 500;
      color: var(--text-soft); letter-spacing: 0.4px;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-cell {
      aspect-ratio: 1 / 1.15; min-height: 56px;
      border-radius: 8px; padding: 4px 4px 3px;
      display: flex; flex-direction: column; align-items: stretch;
      background: transparent; transition: background 0.1s; position: relative;
      border: none; outline: none; font: inherit; color: inherit;
      text-align: inherit; cursor: pointer; appearance: none; -webkit-appearance: none;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
    }
    .cal-cell.long-pressing {
      background: var(--surface);
      box-shadow: inset 0 0 0 2px var(--accent);
      transform: scale(0.96);
      transition: transform 0.1s;
    }
    .cal-cell.today { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); }
    .cal-cell:active { background: var(--surface-alt); }
    .cal-cell.empty { visibility: hidden; pointer-events: none; }
    .cal-date { font-size: 13px; font-weight: 500; text-align: center; letter-spacing: -0.2px; }
    .cal-date.full { color: var(--c-full); }
    .cal-date.morning { color: var(--c-morning); }
    .cal-date.closed { color: var(--c-closed); }
    .holiday-dot {
      position: absolute; top: 4px; right: 6px;
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--c-closed); opacity: 0.7;
    }
    .duty-stack {
      flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 2px;
    }
    .duty-pill {
      font-size: 13px; font-weight: 600; padding: 4px 0; width: 100%;
      text-align: center; border-radius: 6px; letter-spacing: 0.5px;
      position: relative;
    }
    .duty-pill .role-suffix {
      font-size: 9px; font-weight: 600; opacity: 0.75;
      vertical-align: super; margin-left: 1px; letter-spacing: 0;
    }
    .duty-pill.helper-mark::after {
      content: ""; position: absolute; top: 2px; right: 3px;
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; opacity: 0.5;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100; animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg); border-radius: 18px 18px 0 0;
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      padding: 18px 22px 32px; animation: slideUp 0.2s ease;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px;
    }
    .modal-title { font-size: 17px; font-weight: 600; margin: 0; }
    .modal-close {
      width: 32px; height: 32px; border: none; background: transparent;
      font-size: 20px; color: var(--text-mute); flex-shrink: 0;
    }
    .modal-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }

    .duty-help {
      background: var(--surface-alt); border-radius: 10px;
      padding: 12px 14px; font-size: 12px; color: var(--text-mute); line-height: 1.6;
    }
    .duty-help code {
      background: var(--surface); padding: 2px 6px; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--text);
    }
    .duty-textarea {
      width: 100%; min-height: 100px;
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 16px; letter-spacing: 1.5px; line-height: 1.6;
      outline: none; resize: vertical;
    }
    .duty-textarea:focus { border-color: var(--accent); }
    .day-counter { font-size: 12px; color: var(--text-mute); text-align: right; }

    .profile-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-label { color: var(--text-mute); font-size: 14px; }
    .profile-value { font-weight: 500; }
    .team-badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: 999px; font-size: 12px; font-weight: 600;
    }

    .center-msg { padding: 80px 24px; text-align: center; color: var(--text-mute); font-size: 14px; }

    .fab {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      padding: 13px 22px; background: var(--text); color: var(--bg);
      border: none; border-radius: 999px; font-size: 14px; font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18); z-index: 50;
    }
    .fab:active { transform: translateX(-50%) scale(0.96); }

    .menu-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; border-bottom: 1px solid var(--border); background: transparent;
      border-left: none; border-right: none; border-top: none;
      width: 100%; text-align: left; font-size: 15px; color: var(--text);
    }
    .menu-item:active { color: var(--text-mute); }
    .menu-item.danger { color: var(--c-closed); }
    .menu-section-title {
      font-size: 12px; color: var(--text-soft); letter-spacing: 0.4px;
      margin: 18px 0 4px; font-weight: 500;
    }

    .day-modal-date {
      font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin: 0 0 2px;
    }
    .day-modal-date .weekday {
      font-size: 16px; font-weight: 500; color: var(--text-mute); margin-left: 6px;
    }
    .day-modal-date.morning .day-num { color: var(--c-morning); }
    .day-modal-date.closed .day-num { color: var(--c-closed); }
    .day-clinic-tag { font-size: 12px; color: var(--text-mute); margin-bottom: 16px; }
    .day-section { padding: 16px 0; border-top: 1px solid var(--border); }
    .day-section:first-of-type { border-top: none; padding-top: 8px; }
    .day-section-title {
      font-size: 12px; color: var(--text-soft); letter-spacing: 0.5px;
      font-weight: 500; margin: 0 0 12px; text-transform: uppercase;
    }
    .my-shift-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; background: var(--surface); border-radius: 12px;
      border: 1px solid var(--border);
      width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    }
    .my-shift-card:active { background: var(--surface-alt); }
    .my-shift-card .shift-letter { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
    .my-shift-card .shift-meta { font-size: 13px; color: var(--text-mute); text-align: right; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .my-shift-card .shift-meta .meta-team {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    }
    .my-shift-card .role-badge {
      display: inline-block; padding: 1px 6px;
      border-radius: 999px; font-size: 10px; font-weight: 600;
      background: var(--surface-alt); color: var(--text-mute);
    }
    .edit-hint { font-size: 11px; color: var(--text-soft); margin: 6px 0 0; text-align: center; }

    .handover-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
    .handover-arrow {
      flex-shrink: 0; width: 22px; text-align: center;
      color: var(--text-soft); font-size: 16px; line-height: 1.5;
    }
    .handover-info { flex: 1; min-width: 0; }
    .handover-meta {
      font-size: 11px; color: var(--text-soft); letter-spacing: 0.4px; margin-bottom: 4px;
    }
    .handover-people { display: flex; flex-wrap: wrap; gap: 6px; }
    .handover-empty { font-size: 13px; color: var(--text-soft); font-style: italic; }

    .person-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 500; border: 1px solid transparent;
      max-width: 100%;
    }
    .person-chip.me { box-shadow: inset 0 0 0 1.5px var(--text); font-weight: 600; }
    .person-chip.helper-chip {
      background-image: repeating-linear-gradient(
        45deg, transparent, transparent 4px,
        rgba(0,0,0,0.04) 4px, rgba(0,0,0,0.04) 8px
      ) !important;
    }
    .person-chip .role-tag {
      font-size: 10px; opacity: 0.65; font-weight: 600; letter-spacing: 0.3px;
    }

    .lineup-team { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
    .lineup-team:first-child { border-top: none; padding-top: 4px; }
    .lineup-team-label { flex-shrink: 0; width: 56px; display: flex; align-items: flex-start; }
    .lineup-team-label .team-badge { font-size: 11px; padding: 2px 8px; }
    .lineup-people { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }

    .seg {
      display: grid; gap: 4px; padding: 4px;
      background: var(--surface-alt); border-radius: 10px;
    }
    .seg.seg-7 { grid-template-columns: repeat(7, 1fr); }
    .seg.seg-4 { grid-template-columns: repeat(4, 1fr); }
    .seg.seg-3 { grid-template-columns: repeat(3, 1fr); }
    .seg.seg-2 { grid-template-columns: repeat(2, 1fr); }
    .seg button {
      padding: 10px 4px; border: none; background: transparent; border-radius: 7px;
      font-size: 13px; font-weight: 600; color: var(--text-mute); transition: all 0.1s;
      letter-spacing: 0.5px;
    }
    .seg button.active {
      background: var(--surface); color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .seg button:disabled { opacity: 0.3; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--surface); border-radius: 10px;
      border: 1px solid var(--border);
      width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    }
    .toggle-row:active { background: var(--surface-alt); }
    .toggle-row.expanded { border-color: var(--text); }
    .toggle-row .toggle-label { font-size: 14px; font-weight: 500; }
    .toggle-row .toggle-sub { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
    .chevron {
      flex-shrink: 0; font-size: 14px; color: var(--text-mute);
      transition: transform 0.15s; line-height: 1;
    }
    .chevron.up { transform: rotate(180deg); }

    .helper-team-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    }
    .helper-team-grid button {
      padding: 12px 6px; border: 1.5px solid var(--border); background: var(--surface);
      border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text);
      transition: all 0.1s;
    }
    .helper-team-grid button.active {
      border-color: var(--text); background: var(--text); color: var(--bg);
    }
    .field-label-row {
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .field-label-row .field-label { font-size: 13px; color: var(--text-mute); font-weight: 500; }
    .field-label-row .field-hint { font-size: 11px; color: var(--text-soft); }

    /* clinic hours editor */
    .ce-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px 0; }
    .ce-cell {
      aspect-ratio: 1; min-height: 38px;
      border-radius: 8px; border: 1.5px solid transparent;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.1s;
      position: relative;
    }
    .ce-cell.empty { background: transparent; pointer-events: none; }
    .ce-cell.full    { color: var(--c-full); }
    .ce-cell.morning { color: var(--c-morning); }
    .ce-cell.closed  { color: var(--c-closed); }
    .ce-cell.overridden { border-color: var(--accent); }
    .ce-cell.holiday-marker::before {
      content: ""; position: absolute; top: 4px; right: 5px;
      width: 4px; height: 4px; border-radius: 50%; background: var(--c-closed); opacity: 0.6;
    }
    .ce-cell:active { background: var(--surface-alt); }

    .picker-options { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .picker-options button {
      width: 100%; padding: 14px 16px; border: 1px solid var(--border);
      background: var(--surface); border-radius: 10px;
      font-size: 14px; font-weight: 500; text-align: left;
      display: flex; align-items: center; gap: 12px; color: var(--text);
    }
    .picker-options button:active { background: var(--surface-alt); }
    .picker-options button.active {
      border-color: var(--text); border-width: 2px; padding: 13px 15px;
    }
    .picker-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }

    /* contacts */
    .contact-team-section { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .contact-team-section:last-child { border-bottom: none; }
    .contact-team-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .contact-team-header .team-badge { font-size: 12px; padding: 3px 10px; }
    .contact-team-header .count { font-size: 12px; color: var(--text-soft); }
    .contact-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; gap: 12px;
    }
    .contact-name { font-weight: 500; font-size: 14px; flex-shrink: 0; }
    .contact-phone {
      color: var(--accent); font-size: 13px; font-family: ui-monospace, monospace;
      text-decoration: none;
    }
    .contact-phone:active { opacity: 0.6; }
    .contact-empty { font-size: 13px; color: var(--text-soft); font-style: italic; padding: 4px 0; }

    /* holiday list */
    .holiday-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .holiday-row:last-child { border-bottom: none; }
    .holiday-info { flex: 1; min-width: 0; }
    .holiday-date {
      font-size: 13px; font-family: ui-monospace, monospace;
      color: var(--text-mute);
    }
    .holiday-name { font-size: 14px; font-weight: 500; margin-top: 1px; }
    .holiday-source {
      display: inline-block; margin-left: 6px;
      padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600;
      background: var(--surface-alt); color: var(--text-soft);
    }
  </style>

</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module" data-presets="react">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getDatabase, ref, set, get, onValue, update, remove
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPdMQPm3CRpEWaRpg45FD5KYThZTkH9_E",
      authDomain: "duty-db3c7.firebaseapp.com",
      databaseURL: "https://duty-db3c7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "duty-db3c7",
      storageBucket: "duty-db3c7.firebasestorage.app",
      messagingSenderId: "464184579710",

    };
    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    // ============================================================
    // 상수
    // ============================================================
    const ADMIN_SABUN = "224051";
    const TEAMS = ["main", "A", "B", "C", "D", "S-616", "S-617", "S-act"];
    const BASIC_SHIFTS = ["D", "E", "N", "O"];     // 모든 팀 가능
    const MAIN_SHIFTS = ["T", "M", "V"];           // main 컨텍스트만 가능
    const ALL_SHIFTS = [...BASIC_SHIFTS, ...MAIN_SHIFTS];
    const ROLE_SHIFTS = ["D", "E", "N"];           // role 적용 가능 shift
    const HANDOVER_SHIFTS = ["D", "E", "N"];
    const SHIFT_LABELS = {
      D: "Day", E: "Evening", N: "Night", O: "Off",
      T: "Top", M: "Mid", V: "반차"
    };

    function getHolidayName(iso, dbHolidays) {
      if (dbHolidays && dbHolidays[iso]) return dbHolidays[iso].name;
      if (BUILTIN_HOLIDAYS[iso]) return BUILTIN_HOLIDAYS[iso];
      return null;
    }

    function getClinicStatus(dateISO, dayOfWeek, overrides, dbHolidays) {
      if (overrides && overrides[dateISO]) return overrides[dateISO];
      if (getHolidayName(dateISO, dbHolidays)) return "closed";
      if (dayOfWeek === 0) return "closed";
      if (dayOfWeek === 6) return "morning";
      return "full";
    }

    async function hashPassword(sabun, password) {
      const data = new TextEncoder().encode(sabun + ":" + password);
      const buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // ============================================================
    // 듀티 텍스트 파서 V3 — 본인 팀별 차등
    // main: D/E/N/O/T/M/V (role suffix 무시)
    // A: D/E/N/O + role suffix (1/앞=front, 2/뒤=back, a/A=act). T/M/V 시 에러.
    // 그 외: D/E/N/O만. role/main 시프트 시 에러.
    // ============================================================
    function parseDutyStringV3(raw, baseTeam) {
      const cleaned = raw.replace(/\s+/g, "");
      const result = [];
      const isMain = baseTeam === "main";
      const isA = baseTeam === "A";

      let i = 0;
      while (i < cleaned.length) {
        const ch = cleaned[i].toUpperCase();
        if (!ALL_SHIFTS.includes(ch)) {
          throw new Error(`'${cleaned[i]}'(${i + 1}번째)은 알 수 없는 코드. 가능: ${ALL_SHIFTS.join(", ")}`);
        }
        // main 전용 시프트인데 main이 아니면 에러
        if (MAIN_SHIFTS.includes(ch) && !isMain) {
          throw new Error(`'${ch}'(${i + 1}번째)는 main 팀 전용. 다른 팀에서 main 근무 입력은 일별 캘린더의 helper 기능으로.`);
        }
        let role = null;
        if (ROLE_SHIFTS.includes(ch) && i + 1 < cleaned.length) {
          const next = cleaned[i + 1];
          const nextU = next.toUpperCase();
          if (next === "1" || next === "앞") { role = "front"; i++; }
          else if (next === "2" || next === "뒤") { role = "back"; i++; }
          else if (nextU === "A") { role = "act"; i++; }
        }
        if (role && !isA) {
          throw new Error(`A팀이 아닌데 앞/뒤/act 표기가 들어있어요. (${i + 1}번째 부근)`);
        }
        result.push(role ? { shift: ch, role } : { shift: ch });
        i++;
      }
      return result;
    }

    function serializeDuties(dutyMap, maxDay) {
      let out = "";
      let last = 0;
      for (const k of Object.keys(dutyMap)) {
        const d = parseInt(k, 10);
        if (d > last) last = d;
      }
      const cap = Math.min(last, maxDay);
      for (let d = 1; d <= cap; d++) {
        const v = dutyMap[d];
        if (!v) { out += " "; continue; }
        out += v.shift;
        if (v.role === "front") out += "1";
        else if (v.role === "back") out += "2";
        else if (v.role === "act") out += "a";
      }
      return out.trimEnd();
    }

    // ============================================================
    // 입사일/전화 포맷
    // ============================================================
    function formatHireDateInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 8);
      let out = digits;
      if (digits.length > 4) out = digits.slice(0, 4) + "." + digits.slice(4);
      if (digits.length > 6) out = digits.slice(0, 4) + "." + digits.slice(4, 6) + "." + digits.slice(6);
      if (digits.length === 8) out += ".";
      return out;
    }
    function hireDateToISO(formatted) {
      const digits = formatted.replace(/\D/g, "");
      if (digits.length !== 8) return null;
      return `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
    }
    function isoToHireDate(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${y}.${m}.${d}.`;
    }
    function formatPhone(value) {
      const d = value.replace(/\D/g, "").slice(0, 11);
      if (d.length < 4) return d;
      if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
      return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    }

    // ============================================================
    // 날짜 유틸
    // ============================================================
    const WEEKDAYS_KR = ["일", "월", "화", "수", "목", "금", "토"];
    function getMonthInfo(year, month) {
      const first = new Date(year, month - 1, 1);
      const last = new Date(year, month, 0);
      return { first, last, daysInMonth: last.getDate(), startWeekday: first.getDay() };
    }
    function isoDate(year, month, day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function todayInfo() {
      const now = new Date();
      return { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() };
    }
    function getMonthKey(year, month) {
      return `${year}-${String(month).padStart(2, "0")}`;
    }
    function adjacentMonthKey(year, month, offset) {
      const d = new Date(year, month - 1 + offset, 1);
      return getMonthKey(d.getFullYear(), d.getMonth() + 1);
    }
    function shiftDate(year, month, day, offset) {
      const d = new Date(year, month - 1, day + offset);
      return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
    }
    function getWeekday(year, month, day) {
      return new Date(year, month - 1, day).getDay();
    }

    // ============================================================
    // 듀티 데이터 접근
    // ============================================================
    function normalizeDuty(v) {
      if (!v) return null;
      if (typeof v === "string") return { shift: v };
      return v;
    }
    function getDutyAt(allDuties, monthKey, sabun, day) {
      const m = allDuties?.[monthKey];
      if (!m || !m[sabun]) return null;
      const dKey = String(day).padStart(2, "0");
      return normalizeDuty(m[sabun][dKey]);
    }
    function getEffectiveTeam(duty, fallbackTeam) {
      if (!duty) return fallbackTeam;
      if (duty.helper && duty.helper.team) return duty.helper.team;
      return duty.team || fallbackTeam;
    }
    function getEffectiveRole(duty) {
      if (!duty) return null;
      if (duty.helper) return duty.helper.role || null;
      return duty.role || null;
    }
    function isManualHelper(duty) {
      return !!duty?.helper;
    }
    function getPeopleByShift(allDuties, monthKey, day, targetShift) {
      const m = allDuties?.[monthKey];
      if (!m) return [];
      const result = [];
      for (const sabun of Object.keys(m)) {
        const duty = getDutyAt(allDuties, monthKey, sabun, day);
        if (!duty) continue;
        if (duty.shift === targetShift) result.push(sabun);
      }
      return result;
    }
    function groupByEffectiveTeam(sabuns, allUsers, allDuties, monthKey, day) {
      const groups = {};
      for (const t of TEAMS) groups[t] = [];
      for (const sabun of sabuns) {
        const user = allUsers[sabun];
        if (!user) continue;
        const duty = getDutyAt(allDuties, monthKey, sabun, day);
        const team = getEffectiveTeam(duty, user.team);
        if (groups[team]) groups[team].push(sabun);
      }
      return groups;
    }
    function getHandoverConfig(myShift) {
      if (myShift === "D") return {
        prev: { offset: -1, shift: "N", labelTime: "어제 N" },
        next: { offset: 0,  shift: "E", labelTime: "오늘 E" },
      };
      if (myShift === "E") return {
        prev: { offset: 0,  shift: "D", labelTime: "오늘 D" },
        next: { offset: 0,  shift: "N", labelTime: "오늘 N" },
      };
      if (myShift === "N") return {
        prev: { offset: 0,  shift: "E", labelTime: "오늘 E" },
        next: { offset: 1,  shift: "D", labelTime: "내일 D" },
      };
      return null;
    }

    const { useState, useEffect, useMemo, useRef } = React;

    function App() {

          const saved = localStorage.getItem("61w-session");

          try {
            const { sabun } = JSON.parse(saved);
            const snap = await get(ref(db, `users/${sabun}`));
            if (snap.exists()) setMe({ sabun, ...snap.val() });
            else localStorage.removeItem("61w-session");
          } catch (e) {
            console.error(e);
            localStorage.removeItem("61w-session");
          }
          setBootDone(true);
        })();
      }, []);

      const handleLogin = (sabun, userData) => {
        localStorage.setItem("61w-session", JSON.stringify({ sabun }));
        setMe({ sabun, ...userData });
      };
      const handleLogout = () => {
        localStorage.removeItem("61w-session");
        setMe(null);
      };
      const handleProfileUpdate = (newData) => {
        setMe(prev => ({ ...prev, ...newData }));
      };

      if (!bootDone) return <div className="center-msg">불러오는 중…</div>;

      const [dbHolidays, setDbHolidays] = useState({});

      // 모달 상태 (배타적)
      const [activeModal, setActiveModal] = useState(null);
      // null | "profile" | "dutyInput" | "contacts" | "clinic" | "holidays" | "whitelist"
      const [openDay, setOpenDay] = useState(null);       // 일별 정보 모달 (짧게 탭)
      const [quickEditDay, setQuickEditDay] = useState(null); // 빠른 수정 (길게 탭)

      const monthKey = getMonthKey(year, month);
      const prevMonthKey = adjacentMonthKey(year, month, -1);
      const nextMonthKey = adjacentMonthKey(year, month, 1);

      useEffect(() => {
        const r = ref(db, "users");
        const unsub = onValue(r, snap => setAllUsers(snap.val() || {}));
        return () => unsub();
      }, []);

      useEffect(() => {
        const keys = [prevMonthKey, monthKey, nextMonthKey];
        const unsubs = keys.map(mk => {
          const r = ref(db, `duties/${mk}`);
          return onValue(r, snap => {
            setAllDuties(prev => ({ ...prev, [mk]: snap.val() || {} }));
          });
        });
        return () => unsubs.forEach(u => u());
      }, [prevMonthKey, monthKey, nextMonthKey]);

      useEffect(() => {
        const r = ref(db, "clinicHours");
        const unsub = onValue(r, snap => setClinicOverrides(snap.val() || {}));
        return () => unsub();
      }, []);

      useEffect(() => {
        const r = ref(db, "holidays");
        const unsub = onValue(r, snap => setDbHolidays(snap.val() || {}));
        return () => unsub();
      }, []);

      const myDutiesObj = useMemo(() => {
        const m = allDuties[monthKey];
        if (!m || !m[me.sabun]) return {};
        const out = {};
        Object.keys(m[me.sabun]).forEach(k => {
          const v = normalizeDuty(m[me.sabun][k]);
          if (v) out[parseInt(k, 10)] = v;
        });
        return out;
      }, [allDuties, monthKey, me.sabun]);

      const goPrevMonth = () => {
        if (month === 1) { setYear(year - 1); setMonth(12); }
        else setMonth(month - 1);
      };
      const goNextMonth = () => {
        if (month === 12) { setYear(year + 1); setMonth(1); }
        else setMonth(month + 1);
      };
      const goToday = () => { setYear(today.year); setMonth(today.month); };

      const tColor = teamColor(me.team);
      const close = () => setActiveModal(null);

      return (
        <>
          <div className="top-bar">
            <div className="top-bar-title">
              <span>{me.name}</span>
              <span className="team-badge" style={{ background: tColor.bg, color: tColor.text }}>{me.team}</span>
            </div>
            <div className="top-bar-actions">
              <button className="icon-btn" onClick={() => setActiveModal("profile")} aria-label="프로필">⚙︎</button>
            </div>
          </div>

          <div className="month-nav" style={{ padding: "10px 18px 4px", justifyContent: "center" }}>
            <button onClick={goPrevMonth} aria-label="이전 달">‹</button>
            <button onClick={goToday}
              style={{ width: "auto", padding: "0 14px", fontSize: 16, fontWeight: 600, color: "var(--text)" }}>
              {year}년 {month}월
            </button>
            <button onClick={goNextMonth} aria-label="다음 달">›</button>
          </div>

          <CalendarGrid
            year={year} month={month}
            myDuties={myDutiesObj}
            clinicOverrides={clinicOverrides}
            dbHolidays={dbHolidays}
            today={today} myTeam={me.team}
            onShortTap={day => setOpenDay(day)}
            onLongPress={day => setQuickEditDay(day)}
          />

          <button className="fab" onClick={() => setActiveModal("dutyInput")}>
            ✎ {month}월 듀티 입력
          </button>

          {activeModal === "profile" && (
            <ProfileModal me={me} onClose={close} onLogout={onLogout}
              onProfileUpdate={onProfileUpdate}
              onMenuSelect={(k) => setActiveModal(k)} />
          )}
          {activeModal === "dutyInput" && (
            <DutyInputModal year={year} month={month} sabun={me.sabun}
              myTeam={me.team} currentDuties={myDutiesObj} onClose={close} />
          )}
          {activeModal === "contacts" && (
            <ContactsModal allUsers={allUsers} mySabun={me.sabun} onClose={close} />
          )}
          {activeModal === "clinic" && (
            <ClinicHoursEditor
              clinicOverrides={clinicOverrides}
              dbHolidays={dbHolidays}
              onClose={close} />
          )}
          {activeModal === "holidays" && (
            <HolidaysEditor dbHolidays={dbHolidays} onClose={close} />
          )}
          {activeModal === "whitelist" && (
            <WhitelistAdmin onClose={close} />
          )}

          {openDay !== null && (
            <DayDetailModal
              year={year} month={month} day={openDay}
              me={me} allUsers={allUsers} allDuties={allDuties}
              clinicOverrides={clinicOverrides} dbHolidays={dbHolidays}
              onClose={() => setOpenDay(null)} />
          )}
          {quickEditDay !== null && (
            <DutyQuickEdit
              year={year} month={month} day={quickEditDay}
              me={me}
              currentDuty={getDutyAt(allDuties, monthKey, me.sabun, quickEditDay)}
              onClose={() => setQuickEditDay(null)} />
          )}
        </>
      );
    }

    function CalendarCell({
      day, status, isToday, holidayName, duty, myTeam, onShortTap, onLongPress
    }) {
      const timerRef = useRef(null);
      const triggeredRef = useRef(false);
      const [pressing, setPressing] = useState(false);

      const startTimer = () => {
        triggeredRef.current = false;
        setPressing(true);
        timerRef.current = setTimeout(() => {
          triggeredRef.current = true;
          timerRef.current = null;
          setPressing(false);
          onLongPress(day);
        }, 500);
      };
      const cancelTimer = () => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
        }
        setPressing(false);
      };
      const handlePointerDown = (e) => { startTimer(); };
      const handlePointerUp = (e) => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
          setPressing(false);
          if (!triggeredRef.current) onShortTap(day);
        }
      };
      const handlePointerLeave = () => { cancelTimer(); };
      const handleContextMenu = (e) => { e.preventDefault(); };

      const shift = duty?.shift;
      const role = duty?.role;
      const isHelper = !!duty?.helper;

      let cellTeam = myTeam;
      if (duty?.helper?.team) cellTeam = duty.helper.team;
      const cellColor = teamColor(cellTeam);

      return (
        <button
          className={`cal-cell ${isToday ? "today" : ""} ${pressing ? "long-pressing" : ""}`}
          onPointerDown={handlePointerDown}
          onPointerUp={handlePointerUp}
          onPointerLeave={handlePointerLeave}
          onPointerCancel={handlePointerLeave}
          onContextMenu={handleContextMenu}
          type="button"
        >
          {holidayName && <div className="holiday-dot" title={holidayName} />}
          <div className={`cal-date ${status}`}>{day}</div>
          <div className="duty-stack">
            {shift && (
              <div className={`duty-pill ${isHelper ? "helper-mark" : ""}`}
                style={shift === "O"
                  ? { background: "transparent", color: "var(--text-soft)", fontWeight: 500 }
                  : { background: cellColor.bg, color: cellColor.text }}>
                {shift}
                {role && <span className="role-suffix">{ROLE_SHORT[role]}</span>}
              </div>
            )}
          </div>
        </button>
      );
    }

    function CalendarGrid({ year, month, myDuties, clinicOverrides, dbHolidays, today, myTeam, onShortTap, onLongPress }) {
      const { daysInMonth, startWeekday } = getMonthInfo(year, month);

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="cal-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const isToday = (year === today.year && month === today.month && day === today.day);
        const duty = myDuties[day];
        const holidayName = getHolidayName(iso, dbHolidays);

        cells.push(
          <CalendarCell key={day}
            day={day} status={status} isToday={isToday}
            holidayName={holidayName} duty={duty} myTeam={myTeam}
            onShortTap={onShortTap} onLongPress={onLongPress} />
        );
      }

      return (
        <div className="cal-wrap">
          <div className="cal-weekdays">
            {WEEKDAYS_KR.map((w, i) => (
              <div key={w} style={{
                color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
              }}>{w}</div>
            ))}
          </div>
          <div className="cal-grid">{cells}</div>
        </div>
      );
    }

    // ============================================================
    // <DayDetailModal>
    // ============================================================
    function DayDetailModal({ year, month, day, me, allUsers, allDuties, clinicOverrides, dbHolidays, onClose }) {
      const monthKey = getMonthKey(year, month);
      const iso = isoDate(year, month, day);
      const dow = getWeekday(year, month, day);
      const clinic = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
      const holidayName = getHolidayName(iso, dbHolidays);

      const myDuty = getDutyAt(allDuties, monthKey, me.sabun, day);
      const myShift = myDuty?.shift;
      const myEffectiveTeam = getEffectiveTeam(myDuty, me.team);
      const myEffectiveRole = getEffectiveRole(myDuty);
      const myIsHelper = isManualHelper(myDuty);

      const handover = HANDOVER_SHIFTS.includes(myShift) ? getHandoverConfig(myShift) : null;
      const showHandover = handover && myEffectiveTeam !== "main";

      let prevPeople = [], nextPeople = [];
      let prevMK = monthKey, prevDay = day, nextMK = monthKey, nextDay = day;
      if (showHandover) {
        const pd = shiftDate(year, month, day, handover.prev.offset);
        prevMK = getMonthKey(pd.year, pd.month);
        prevDay = pd.day;
        const all = getPeopleByShift(allDuties, prevMK, prevDay, handover.prev.shift);
        prevPeople = all.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, prevMK, s, prevDay);
          return getEffectiveTeam(d, u.team) === myEffectiveTeam;
        });

        const nd = shiftDate(year, month, day, handover.next.offset);
        nextMK = getMonthKey(nd.year, nd.month);
        nextDay = nd.day;
        const allN = getPeopleByShift(allDuties, nextMK, nextDay, handover.next.shift);
        nextPeople = allN.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, nextMK, s, nextDay);
          return getEffectiveTeam(d, u.team) === myEffectiveTeam;
        });
      }

      const showLineup = HANDOVER_SHIFTS.includes(myShift);
      let lineup = null;
      if (showLineup) {
        const sabuns = getPeopleByShift(allDuties, monthKey, day, myShift);
        lineup = groupByEffectiveTeam(sabuns, allUsers, allDuties, monthKey, day);
      }

      const dateColorClass = clinic;
      const myTeamColor = teamColor(myEffectiveTeam);

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <p className={`day-modal-date ${dateColorClass}`} style={{ marginBottom: holidayName ? 4 : 8 }}>
                  <span className="day-num">{month}월 {day}일</span>
                  <span className="weekday">({WEEKDAYS_KR[dow]})</span>
                </p>
                <p className="day-clinic-tag">
                  {holidayName && <span style={{ color: "var(--c-closed)", fontWeight: 600 }}>{holidayName} · </span>}
                  진료 {CLINIC_LABELS[clinic]}
                </p>
              </div>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="day-section">
              <p className="day-section-title">내 근무</p>
              <div className="my-shift-card" style={{ cursor: "default" }}>
                {myShift ? (
                  <>
                    <span className="shift-letter"
                      style={myShift === "O" ? { color: "var(--text-soft)" } : { color: myTeamColor.text }}>
                      {myShift}
                      {myEffectiveRole && (
                        <span className="role-suffix" style={{ fontSize: 13, marginLeft: 4 }}>
                          {ROLE_SHORT[myEffectiveRole]}
                        </span>
                      )}
                    </span>
                    <span className="shift-meta">
                      <span>{SHIFT_LABELS[myShift]}</span>
                      {myEffectiveRole && <span className="role-badge">{ROLE_LABELS[myEffectiveRole]}</span>}
                      <span className="meta-team" style={{ background: myTeamColor.bg, color: myTeamColor.text }}>
                        {myEffectiveTeam}
                      </span>
                      {myIsHelper && myEffectiveTeam !== "main" && <span className="role-badge">helper</span>}
                    </span>
                  </>
                ) : (
                  <span style={{ color: "var(--text-soft)", fontSize: 14 }}>듀티 없음</span>
                )}
              </div>
            </div>

            {showHandover && (
              <div className="day-section">
                <p className="day-section-title">{myEffectiveTeam}팀 인수인계</p>
                <HandoverRow direction="prev" config={handover.prev}
                  people={prevPeople} allUsers={allUsers} allDuties={allDuties}
                  monthKey={prevMK} day={prevDay}
                  mySabun={me.sabun} myTeam={myEffectiveTeam} />
                <HandoverRow direction="next" config={handover.next}
                  people={nextPeople} allUsers={allUsers} allDuties={allDuties}
                  monthKey={nextMK} day={nextDay}
                  mySabun={me.sabun} myTeam={myEffectiveTeam} />
              </div>
            )}

            {showLineup && lineup && (
              <div className="day-section">
                <p className="day-section-title">{myShift} 라인업</p>
                <LineupBlock lineup={lineup} mySabun={me.sabun} allUsers={allUsers}
                  monthKey={monthKey} day={day} allDuties={allDuties} />
              </div>
            )}

            {!showHandover && !showLineup && myShift && (
              <div className="day-section">
                <p style={{ fontSize: 13, color: "var(--text-soft)", margin: 0, textAlign: "center", padding: "8px 0" }}>
                  {myEffectiveTeam === "main"
                    ? "main 팀은 인수인계 표시가 없어요."
                    : "이 근무는 인수인계·라인업 표시가 없어요."}
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function HandoverRow({ direction, config, people, allUsers, allDuties, monthKey, day, mySabun, myTeam }) {
      const arrow = direction === "prev" ? "←" : "→";
      return (
        <div className="handover-row">
          <div className="handover-arrow">{arrow}</div>
          <div className="handover-info">
            <div className="handover-meta">
              {direction === "prev" ? "받음" : "넘김"} · {config.labelTime}
            </div>
            {people.length === 0 ? (
              <div className="handover-empty">
                {direction === "prev" ? "이전번 근무자가 없어요" : "다음번 근무자가 없어요"}
              </div>
            ) : (
              <div className="handover-people">
                {people.map(s => {
                  const duty = getDutyAt(allDuties, monthKey, s, day);
                  return (
                    <PersonChip key={s} sabun={s} user={allUsers[s]}
                      isMe={s === mySabun} teamForColor={myTeam}
                      role={getEffectiveRole(duty)}
                      isHelper={isManualHelper(duty)} />
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function LineupBlock({ lineup, mySabun, allUsers, monthKey, day, allDuties }) {
      return (
        <div>
          {TEAMS.map(team => {
            const sabuns = lineup[team] || [];
            if (sabuns.length === 0) return null;
            const c = teamColor(team);
            return (
              <div key={team} className="lineup-team">
                <div className="lineup-team-label">
                  <span className="team-badge" style={{ background: c.bg, color: c.text }}>{team}</span>
                </div>
                <div className="lineup-people">
                  {sabuns.map(s => {
                    const duty = getDutyAt(allDuties, monthKey, s, day);
                    const isHelper = isManualHelper(duty);
                    // main 팀에 helper로 간 경우 helper 배지 숨김
                    const showHelperBadge = isHelper && team !== "main";
                    return (
                      <PersonChip key={s}
                        sabun={s} user={allUsers[s]}
                        isMe={s === mySabun}
                        teamForColor={team}
                        role={getEffectiveRole(duty)}
                        isHelper={showHelperBadge} />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function PersonChip({ sabun, user, isMe, teamForColor, role, isHelper }) {
      if (!user) {
        return <span className="person-chip" style={{
          background: "var(--surface-alt)", color: "var(--text-soft)"
        }}>{sabun}</span>;
      }
      const c = teamColor(teamForColor || user.team);
      return (
        <span className={`person-chip ${isMe ? "me" : ""} ${isHelper ? "helper-chip" : ""}`}
          style={{ background: c.bg, color: c.text }}>
          {user.name}
          {role && <span className="role-tag">({ROLE_LABELS[role]})</span>}
          {isHelper && <span className="role-tag">·helper</span>}
        </span>
      );
    }

    // ============================================================
    // <DutyQuickEdit>
    // ============================================================
    function DutyQuickEdit({ year, month, day, me, currentDuty, onClose }) {
      const initialShift = currentDuty?.shift || "O";
      const initialRole = getEffectiveRole(currentDuty);
      const initialHelperOpt = (() => {
        if (!currentDuty?.helper) return null;
        const h = currentDuty.helper;
        if (h.team === "A") {
          return HELPER_OPTIONS.find(o => o.team === "A" && o.role === (h.role || null))?.key
              || HELPER_OPTIONS.find(o => o.team === "A" && o.role === "act")?.key;
        }
        return HELPER_OPTIONS.find(o => o.team === h.team)?.key || null;
      })();

      const [shift, setShift] = useState(initialShift);
      const [role, setRole] = useState(initialRole);
      const [helperOn, setHelperOn] = useState(!!initialHelperOpt);
      const [helperKey, setHelperKey] = useState(initialHelperOpt);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const helperOpt = helperKey ? HELPER_OPTIONS.find(o => o.key === helperKey) : null;
      const helperTeam = helperOpt?.team;

      // 현재 컨텍스트가 main인지: 본인 main + helper 안 켰거나, helper로 main 갔거나
      const isMainContext = (!helperOn && me.team === "main") || (helperOn && helperTeam === "main");
      const allowedShifts = isMainContext ? ALL_SHIFTS : BASIC_SHIFTS;
      const isRoleShift = ROLE_SHIFTS.includes(shift);
      const isAteam = me.team === "A";

      // shift가 허용 범위 밖으로 나가면 자동 D로 리셋
      useEffect(() => {
        if (!allowedShifts.includes(shift)) {
          setShift("D");
        }
      }, [allowedShifts, shift]);

      // shift가 D/E/N이 아니게 되면 role 초기화
      useEffect(() => {
        if (!isRoleShift) setRole(null);
      }, [isRoleShift]);

      // helper 토글 끄면 helperKey 초기화
      useEffect(() => {
        if (!helperOn) setHelperKey(null);
      }, [helperOn]);

      const pickHelper = (opt) => {
        // 같은 옵션 다시 누르면 해제
        if (helperKey === opt.key) {
          setHelperKey(null);
          return;
        }
        setHelperKey(opt.key);
        // main으로 가면 시프트 자동 T (단, 현재 시프트가 BASIC인 경우만 변경)
        if (opt.team === "main" && BASIC_SHIFTS.includes(shift)) {
          setShift("T");
        }
      };

      const save = async () => {
        setErr("");
        const monthKey = getMonthKey(year, month);
        const dKey = String(day).padStart(2, "0");
        const path = `duties/${monthKey}/${me.sabun}/${dKey}`;

        let payload;
        if (shift === "O") {
          payload = { shift: "O", team: me.team };
        } else {
          payload = { shift, team: me.team };

          if (helperOn && helperKey) {
            const opt = HELPER_OPTIONS.find(o => o.key === helperKey);
            if (!opt) { setErr("helper 팀을 선택해 주세요."); return; }
            // helper.team이 본인 팀과 같으면 helper 무의미 → role만 남김
            if (opt.team === me.team) {
              if (opt.role && isRoleShift) payload.role = opt.role;
            } else {
              payload.helper = { team: opt.team };
              if (opt.role && isRoleShift) payload.helper.role = opt.role;
            }
          } else if (isAteam && isRoleShift && role) {
            // A팀이 helper 안 켜고 role 직접 선택
            payload.role = role;
          }
        }

        setBusy(true);
        try {
          await set(ref(db, path), payload);
          onClose();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      const removeIt = async () => {
        if (!confirm("이 날 듀티를 삭제할까요?")) return;
        setBusy(true);
        try {
          const monthKey = getMonthKey(year, month);
          const dKey = String(day).padStart(2, "0");
          await remove(ref(db, `duties/${monthKey}/${me.sabun}/${dKey}`));
          onClose();
        } catch (e) {
          console.error(e);
          setErr("삭제 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      // helper 토글 가능: D/E/N (O면 어차피 무의미, T/M/V는 main 전용이라 본인이 main이거나 이미 main helper)
      const canHelperToggle = isRoleShift || (isMainContext && (shift === "T" || shift === "M" || shift === "V"));
      // 더 단순: 항상 켤 수 있음. 사용자가 알아서.
      const showHelperToggle = true;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 {day}일 수정</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="modal-fields">
              <div className="field">
                <label>근무</label>
                <div className={isMainContext ? "seg seg-7" : "seg seg-4"}>
                  {allowedShifts.map(c => (
                    <button key={c} className={shift === c ? "active" : ""}
                      onClick={() => setShift(c)} type="button">{c}</button>
                  ))}
                </div>
              </div>

              {isRoleShift && isAteam && !helperOn && (
                <div className="field">
                  <div className="field-label-row">
                    <span className="field-label">A팀 역할</span>
                    <span className="field-hint">없음 = 일반 근무</span>
                  </div>
                  <div className="seg seg-4">
                    <button className={!role ? "active" : ""} onClick={() => setRole(null)} type="button">없음</button>
                    <button className={role === "front" ? "active" : ""} onClick={() => setRole("front")} type="button">앞</button>
                    <button className={role === "back" ? "active" : ""} onClick={() => setRole("back")} type="button">뒤</button>
                    <button className={role === "act" ? "active" : ""} onClick={() => setRole("act")} type="button">act</button>
                  </div>
                </div>
              )}

              {showHelperToggle && (
                <>
                  <button className={`toggle-row ${helperOn ? "expanded" : ""}`}
                    onClick={() => setHelperOn(!helperOn)} type="button">

    // <DutyInputModal>
    // ============================================================
    function DutyInputModal({ year, month, sabun, myTeam, currentDuties, onClose }) {
      const { daysInMonth } = getMonthInfo(year, month);
      const initial = useMemo(() => serializeDuties(currentDuties, daysInMonth), []);

      const [text, setText] = useState(initial);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const parsed = useMemo(() => {
        try { return parseDutyStringV3(text, myTeam); } catch { return null; }
      }, [text, myTeam]);

      const save = async () => {
        setErr("");
        let codes;
        try { codes = parseDutyStringV3(text, myTeam); }
        catch (e) { setErr(e.message); return; }
        if (codes.length > daysInMonth) {
          setErr(`이 달은 ${daysInMonth}일까지인데 ${codes.length}개가 입력됐어요.`);
          return;
        }
        setBusy(true);
        try {
          const monthKey = getMonthKey(year, month);
          const updates = {};
          for (let d = 1; d <= daysInMonth; d++) {
            const dKey = String(d).padStart(2, "0");
            const path = `duties/${monthKey}/${sabun}/${dKey}`;
            if (d <= codes.length) {
              const code = codes[d - 1];
              const payload = { shift: code.shift, team: myTeam };
              if (code.role) payload.role = code.role;
              updates[path] = payload;
            } else {
              updates[path] = null;
            }
          }
          await update(ref(db), updates);
          onClose();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      // 도움말 분기
      const teamHelp = myTeam === "main" ? (
        <>
          <strong>main 팀 시프트</strong>: <code>T</code> Top · <code>M</code> Mid · <code>V</code> 반차
        </>
      ) : myTeam === "A" ? (
        <>
          <strong>A팀 역할</strong>: D/E/N 뒤에 <code>1</code>/<code>앞</code>=앞, <code>2</code>/<code>뒤</code>=뒤, <code>a</code>=act<br />
          예: <code>D1E뒤Na</code> = D(앞), E(뒤), N(act)
        </>
      ) : null;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 듀티 입력</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="modal-fields">
              <div className="duty-help">
                1일부터 순서대로 한 글자씩 입력. 공백/줄바꿈 무시.<br />
                <code>D</code> Day · <code>E</code> Evening · <code>N</code> Night · <code>O</code> Off
                {teamHelp && <><br /><br />{teamHelp}</>}
                <br /><br />
                helper 근무는 일별 캘린더에서 수정해 주세요.
              </div>
              <textarea className="duty-textarea" value={text}
                onChange={e => setText(e.target.value)}
                placeholder={
                  myTeam === "main" ? "예: TTOOTTM..." :
                  myTeam === "A" ? "예: D1E뒤NaOOD..." : "예: DENNOOD..."}
                autoFocus />
              <div className="day-counter">
                {parsed ? `${parsed.length}일` : "—"} / {daysInMonth}일
              </div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy || !text.trim()}>
                {busy ? "저장 중…" : "저장"}
              </button>
              <p style={{ fontSize: 11, color: "var(--text-soft)", textAlign: "center", margin: 0 }}>
                ※ 이 입력은 월 전체를 덮어써요. helper 설정은 일별 수정에서.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ClinicHoursEditor({ clinicOverrides, dbHolidays, onClose }) {
      const today = todayInfo();
      const [year, setYear] = useState(today.year);
      const [month, setMonth] = useState(today.month);
      const [pickDate, setPickDate] = useState(null); // ISO

      const goPrev = () => {
        if (month === 1) { setYear(y => y - 1); setMonth(12); }
        else setMonth(m => m - 1);
      };
      const goNext = () => {
        if (month === 12) { setYear(y => y + 1); setMonth(1); }
        else setMonth(m => m + 1);
      };

      const { daysInMonth, startWeekday } = getMonthInfo(year, month);

      const setStatus = async (iso, status) => {
        try {
          if (status === null) {
            // 기본값으로 리셋
            await remove(ref(db, `clinicHours/${iso}`));
          } else {
            await set(ref(db, `clinicHours/${iso}`), status);
          }
          setPickDate(null);
        } catch (e) {
          console.error(e);
          alert("저장 실패");
        }
      };

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="ce-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const isOverride = !!clinicOverrides[iso];
        const isHoliday = !!getHolidayName(iso, dbHolidays);
        cells.push(
          <button key={day}
            className={`ce-cell ${status} ${isOverride ? "overridden" : ""} ${isHoliday ? "holiday-marker" : ""}`}
            onClick={() => setPickDate(iso)} type="button">
            {day}
          </button>
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>

              <h2 className="modal-title">진료시간 수정</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 12px" }}>
              날짜를 탭하면 진료시간을 바꿀 수 있어요. 보라색 테두리는 직접 설정한 날.
            </p>

            <div className="month-nav" style={{ justifyContent: "center", marginBottom: 6 }}>
              <button onClick={goPrev}>‹</button>
              <span style={{ padding: "0 14px", fontSize: 15, fontWeight: 600 }}>
                {year}년 {month}월
              </span>
              <button onClick={goNext}>›</button>
            </div>

            <div className="cal-weekdays">
              {WEEKDAYS_KR.map((w, i) => (
                <div key={w} style={{
                  color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
                }}>{w}</div>
              ))}
            </div>
            <div className="ce-grid">{cells}</div>

            <div style={{ marginTop: 16, padding: 12, background: "var(--surface-alt)", borderRadius: 10, fontSize: 12, color: "var(--text-mute)", lineHeight: 1.6 }}>
              <span style={{ color: "var(--c-full)", fontWeight: 600 }}>● 검정</span> 오전·오후 진료 ·
              <span style={{ color: "var(--c-morning)", fontWeight: 600 }}> 파랑</span> 오전만 ·
              <span style={{ color: "var(--c-closed)", fontWeight: 600 }}> 빨강</span> 휴진<br />

        </div>
      );

    // ============================================================
    // <HolidaysEditor>
    // ============================================================
    function HolidaysEditor({ dbHolidays, onClose }) {
      const [adding, setAdding] = useState(false);
      const [newDate, setNewDate] = useState("");
      const [newName, setNewName] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      // 통합 리스트: BUILTIN + DB. DB가 같은 날짜면 덮어쓰기 (수동 우선)
      const merged = useMemo(() => {
        const all = {};
        Object.entries(BUILTIN_HOLIDAYS).forEach(([iso, name]) => {
          all[iso] = { name, source: "builtin" };
        });
        Object.entries(dbHolidays || {}).forEach(([iso, info]) => {
          all[iso] = { name: info.name || "공휴일", source: "manual" };
        });
        // 정렬 (오름차순)
        return Object.entries(all)
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([iso, info]) => ({ iso, ...info }));
      }, [dbHolidays]);

      // 미래 + 최근 6개월
      const cutoff = (() => {
        const d = new Date();
        d.setMonth(d.getMonth() - 6);
        return d.toISOString().slice(0, 10);
      })();
      const visible = merged.filter(h => h.iso >= cutoff);

      const addHoliday = async () => {
        setErr("");
        const digits = newDate.replace(/\D/g, "");
        if (digits.length !== 8) return setErr("날짜는 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        const iso = `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
        // 유효성: parse 후 다시 ISO 비교
        const [yy, mm, dd] = iso.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        if (dt.getFullYear() !== yy || dt.getMonth() + 1 !== mm || dt.getDate() !== dd) {
          return setErr("유효하지 않은 날짜예요.");
        }
        if (!newName.trim()) return setErr("공휴일 이름을 입력해 주세요.");
        setBusy(true);
        try {
          await set(ref(db, `holidays/${iso}`), { name: newName.trim() });
          setNewDate(""); setNewName(""); setAdding(false);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const removeManual = async (iso) => {
        if (!confirm("이 공휴일을 제거할까요?")) return;
        try {
          await remove(ref(db, `holidays/${iso}`));
        } catch (e) {
          console.error(e); alert("삭제 실패");
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">공휴일 관리</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 12px" }}>
              <span className="holiday-source">기본</span>은 코드에 박힌 공휴일이라 삭제 안 돼요.
              없애려면 <strong>진료시간 수정</strong>에서 그 날의 진료시간을 바꿔주세요.<br />
              <span className="holiday-source">수동</span>은 직접 추가한 공휴일. 삭제 가능.
            </p>

            {!adding ? (
              <button className="btn-primary" onClick={() => setAdding(true)} style={{ marginBottom: 16 }}>
                + 공휴일 추가
              </button>
            ) : (
              <div style={{ background: "var(--surface)", padding: 14, borderRadius: 10, marginBottom: 16, border: "1px solid var(--border)" }}>
                <div className="modal-fields">
                  <div className="field"><label>날짜 (YYYYMMDD)</label>
                    <input type="tel" inputMode="numeric" value={newDate}
                      onChange={e => setNewDate(formatHireDateInput(e.target.value))}
                      placeholder="20261225" autoFocus /></div>
                  <div className="field"><label>이름</label>
                    <input value={newName} onChange={e => setNewName(e.target.value)}
                      placeholder="예: 임시공휴일" /></div>
                  {err && <div className="auth-error">{err}</div>}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn-primary" onClick={addHoliday} disabled={busy} style={{ flex: 1 }}>
                    {busy ? "추가 중…" : "추가"}
                  </button>
                  <button className="btn-ghost" onClick={() => { setAdding(false); setErr(""); }}>취소</button>
                </div>
              </div>
            )}

            <p className="menu-section-title">목록 ({visible.length}개)</p>
            {visible.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                표시할 공휴일이 없어요.
              </p>
            ) : (
              visible.map(h => (
                <div key={h.iso} className="holiday-row">
                  <div className="holiday-info">
                    <div className="holiday-date">{h.iso}</div>
                    <div className="holiday-name">
                      {h.name}
                      <span className="holiday-source">{h.source === "builtin" ? "기본" : "수동"}</span>
                    </div>
                  </div>
                  {h.source === "manual" && (
                    <button className="icon-btn" onClick={() => removeManual(h.iso)}
                      style={{ color: "var(--c-closed)" }} aria-label="삭제">×</button>
                  )}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // <WhitelistAdmin>
    // ============================================================
    function WhitelistAdmin({ onClose }) {
      const [list, setList] = useState([]);
      const [bulkText, setBulkText] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        const r = ref(db, "whitelist");
        const unsub = onValue(r, snap => {
          const val = snap.val() || {};
          setList(Object.keys(val).sort());
        });
        return () => unsub();
      }, []);

      const addBulk = async () => {
        setErr("");
        const parts = bulkText.split(/[\s,;\n]+/).map(s => s.trim()).filter(Boolean);
        const invalid = parts.filter(s => !/^\d{5,6}$/.test(s));
        if (invalid.length) { setErr(`잘못된 사번: ${invalid.join(", ")}`); return; }
        if (!parts.length) { setErr("추가할 사번을 입력해 주세요."); return; }
        setBusy(true);
        try {
          const updates = {};
          parts.forEach(s => { updates[`whitelist/${s}`] = true; });
          await update(ref(db), updates);
          setBulkText("");
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const remove1 = async (sabun) => {
        if (!confirm(`${sabun} 화이트리스트에서 제거할까요? (이미 가입한 계정은 그대로 유지됨)`)) return;
        try { await remove(ref(db, `whitelist/${sabun}`)); }
        catch (e) { console.error(e); alert("삭제 실패"); }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">화이트리스트</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="duty-help" style={{ marginBottom: 14 }}>
              가입 가능한 사번 명단. 줄바꿈/콤마/공백으로 구분해 한꺼번에 추가할 수 있어요.
              <br />본인(<code>{ADMIN_SABUN}</code>)은 자동으로 항상 가입 가능.
            </div>
            <div className="field" style={{ marginBottom: 8 }}>
              <textarea className="duty-textarea"
                style={{ letterSpacing: 0 }}
                value={bulkText} onChange={e => setBulkText(e.target.value)}
                placeholder="123456&#10;234567&#10;345678&#10;..." />
            </div>
            {err && <div className="auth-error" style={{ marginBottom: 10 }}>{err}</div>}
            <button className="btn-primary" onClick={addBulk} disabled={busy} style={{ marginBottom: 20 }}>
              {busy ? "추가 중…" : "추가"}
            </button>
            <p className="menu-section-title">현재 명단 ({list.length}명)</p>
            {list.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                아직 등록된 사번이 없어요.
              </p>
            ) : (
              <div>
                {list.map(s => (
                  <div key={s} className="profile-row">
                    <span className="profile-value" style={{ fontFamily: "ui-monospace, monospace" }}>{s}</span>
                    <button className="icon-btn" onClick={() => remove1(s)}
                      style={{ color: "var(--c-closed)" }} aria-label="삭제">×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW 등록 실패:", err));
      });
    }
  </script>

</body>
</html>
