                  <div style={{ fontSize: 11, color: "var(--text-soft)" }}>현재 기본: {baseDefault}</div>
                </div>
              </button>
              <button className={current === "full" ? "active" : ""} onClick={() => onPick("full")}>
                <span className="picker-dot" style={{ background: "var(--c-full)" }}></span>
                <span>오전·오후 진료</span>
              </button>
              <button className={current === "morning" ? "active" : ""} onClick={() => onPick("morning")}>
                <span className="picker-dot" style={{ background: "var(--c-morning)" }}></span>
                <span>오전만 진료</span>
              </button>
              <button className={current === "closed" ? "active" : ""} onClick={() => onPick("closed")}>
                <span className="picker-dot" style={{ background: "var(--c-closed)" }}></span>
                <span>휴진</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <HolidaysEditor>
    // ============================================================
    function HolidaysEditor({ dbHolidays, onClose }) {
      const [adding, setAdding] = useState(false);
      const [newDate, setNewDate] = useState("");
      const [newName, setNewName] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      // 통합 리스트: BUILTIN + DB. DB가 같은 날짜면 덮어쓰기 (수동 우선)
      const merged = useMemo(() => {
        const all = {};
        Object.entries(BUILTIN_HOLIDAYS).forEach(([iso, name]) => {
          all[iso] = { name, source: "builtin" };
        });
        Object.entries(dbHolidays || {}).forEach(([iso, info]) => {
          all[iso] = { name: info.name || "공휴일", source: "manual" };
        });
        // 정렬 (오름차순)
        return Object.entries(all)
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([iso, info]) => ({ iso, ...info }));
      }, [dbHolidays]);

      // 미래 + 최근 6개월
      const cutoff = (() => {
        const d = new Date();
        d.setMonth(d.getMonth() - 6);
        return d.toISOString().slice(0, 10);
      })();
      const visible = merged.filter(h => h.iso >= cutoff);

      const addHoliday = async () => {
        setErr("");
        const digits = newDate.replace(/\D/g, "");
        if (digits.length !== 8) return setErr("날짜는 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        const iso = `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
        // 유효성: parse 후 다시 ISO 비교
        const [yy, mm, dd] = iso.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        if (dt.getFullYear() !== yy || dt.getMonth() + 1 !== mm || dt.getDate() !== dd) {
          return setErr("유효하지 않은 날짜예요.");
        }
        if (!newName.trim()) return setErr("공휴일 이름을 입력해 주세요.");
        setBusy(true);
        try {
          await set(ref(db, `holidays/${iso}`), { name: newName.trim() });
          setNewDate(""); setNewName(""); setAdding(false);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const removeManual = async (iso) => {
        if (!confirm("이 공휴일을 제거할까요?")) return;
        try {
          await remove(ref(db, `holidays/${iso}`));
        } catch (e) {
          console.error(e); alert("삭제 실패");
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">공휴일 관리</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            {!adding ? (
              <button className="btn-primary" onClick={() => setAdding(true)} style={{ marginBottom: 16 }}>
                + 공휴일 추가
              </button>
            ) : (
              <div style={{ background: "var(--surface)", padding: 14, borderRadius: 10, marginBottom: 16, border: "1px solid var(--border)" }}>
                <div className="modal-fields">
                  <div className="field"><label>날짜 (YYYYMMDD)</label>
                    <input type="tel" inputMode="numeric" value={newDate}
                      onChange={e => setNewDate(formatHireDateInput(e.target.value))}
                      placeholder="20261225" autoFocus /></div>
                  <div className="field"><label>이름</label>
                    <input value={newName} onChange={e => setNewName(e.target.value)}
                      placeholder="예: 임시공휴일" /></div>
                  {err && <div className="auth-error">{err}</div>}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn-primary" onClick={addHoliday} disabled={busy} style={{ flex: 1 }}>
                    {busy ? "추가 중…" : "추가"}
                  </button>
                  <button className="btn-ghost" onClick={() => { setAdding(false); setErr(""); }}>취소</button>
                </div>
              </div>
            )}

            <p className="menu-section-title">목록 ({visible.length}개)</p>
            {visible.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                표시할 공휴일이 없어요.
              </p>
            ) : (
              visible.map(h => (
                <div key={h.iso} className="holiday-row">
                  <div className="holiday-info">
                    <div className="holiday-date">{h.iso}</div>
                    <div className="holiday-name">
                      {h.name}
                      <span className="holiday-source">{h.source === "builtin" ? "기본" : "수동"}</span>
                    </div>
                  </div>
                  {h.source === "manual" && (
                    <button className="icon-btn" onClick={() => removeManual(h.iso)}
                      style={{ color: "var(--c-closed)" }} aria-label="삭제">×</button>
                  )}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // <SeniorityEditor> — admin 전용 연차 순서 관리
    // ============================================================
    function SeniorityEditor({ allUsers, seniority, onClose }) {
      // 로컬 상태: { sabun: stringValue }
      const [local, setLocal] = useState(() => {
        const out = {};
        Object.keys(allUsers).forEach(s => {
          const v = seniority?.[s];
          out[s] = v != null ? String(v) : "";
        });
        return out;
      });
      const [busy, setBusy] = useState(false);
      const [savedMsg, setSavedMsg] = useState("");

      const groups = useMemo(
        () => groupUsersByTeam(allUsers, seniority),
        [allUsers, seniority]
      );

      const setVal = (sabun, val) => {
        // 빈 값 또는 양의 정수만 허용
        if (val === "" || /^\d{1,4}$/.test(val)) {
          setLocal(prev => ({ ...prev, [sabun]: val }));
        }
      };

      const save = async () => {
        setBusy(true);
        setSavedMsg("");
        try {
          const updates = {};
          Object.keys(local).forEach(s => {
            const v = local[s];
            if (v === "") {
              updates[`seniority/${s}`] = null;
            } else {
              updates[`seniority/${s}`] = parseInt(v, 10);
            }
          });
          await update(ref(db), updates);
          setSavedMsg("저장됨");
          setTimeout(() => setSavedMsg(""), 1500);
        } catch (e) {
          console.error(e);
          alert("저장 실패");
        }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">연차 순서 관리</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="duty-help" style={{ marginBottom: 14 }}>
              작은 숫자가 선임. 비우면 입사일 기준으로 자동 정렬돼요.<br />
              경력직·재입사로 입사일 순서와 다른 경우만 숫자 입력하면 됨.
            </div>

            {TEAMS.map(team => {
              const list = groups[team] || [];
              if (list.length === 0) return null;
              const c = teamColor(team);
              return (
                <div key={team} className="seniority-team-section">
                  <div className="seniority-team-header">
                    <span className="team-badge" style={{ background: c.bg, color: c.text }}>{team}</span>
                    <span style={{ fontSize: 12, color: "var(--text-soft)" }}>{list.length}명</span>
                  </div>
                  {list.map(u => (
                    <div key={u.sabun} className="seniority-row">
                      <input
                        type="tel" inputMode="numeric"
                        value={local[u.sabun] || ""}
                        onChange={e => setVal(u.sabun, e.target.value)}
                        placeholder="—" />
                      <span className="name">{u.name}</span>
                      <span className="hire">{isoToHireDate(u.hireDate)}</span>
                    </div>
                  ))}
                </div>
              );
            })}

            <div className="modal-actions" style={{ marginTop: 18 }}>
              <button className="btn-primary" onClick={save} disabled={busy}>
                {busy ? "저장 중…" : (savedMsg || "저장")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <OffToggleModal> — OFF 신청 활성화/비활성화
    // ============================================================
    function OffToggleModal({ year, month, me, requestSettings, onClose }) {
      const nm = nextMonthInfo(year, month);
      const nmk = nextMonthKey(year, month);
      const current = requestSettings?.[nmk];
      const active = !!current?.active;
      const [busy, setBusy] = useState(false);

      const activate = async () => {
        setBusy(true);
        try {
          await set(ref(db, `requestSettings/${nmk}`), {
            active: true,
            activatedBy: me.sabun,
            activatedByName: me.name,
            activatedAt: Date.now(),
          });
          onClose();
        } catch (e) { console.error(e); alert("저장 실패"); }
        setBusy(false);
      };
      const deactivate = async () => {
        if (!confirm("OFF 신청을 마감할까요? (기존 신청 데이터는 유지됩니다)")) return;
        setBusy(true);
        try {
          await update(ref(db, `requestSettings/${nmk}`), { active: false });
          onClose();
        } catch (e) { console.error(e); alert("저장 실패"); }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{nm.month}월 OFF 신청</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="duty-help" style={{ marginBottom: 18 }}>
              활성화하면 모든 사용자가 {nm.year}년 {nm.month}월 OFF 신청을 시작할 수 있어요.
              마감은 언제든 다시 비활성화하면 됩니다.<br /><br />
              현재 상태: <strong>{active ? "🟢 활성화됨" : "🔴 비활성화"}</strong>
              {active && current?.activatedByName && (
                <><br /><span style={{ fontSize: 11, color: "var(--text-soft)" }}>
                  활성화: {current.activatedByName} · {formatRelativeTime(current.activatedAt)}
                </span></>
              )}
            </div>
            <div className="modal-actions">
              {active ? (
                <button className="btn-primary" onClick={deactivate} disabled={busy}
                  style={{ background: "var(--c-closed)" }}>
                  {busy ? "처리 중…" : "신청 마감"}
                </button>
              ) : (
                <button className="btn-primary" onClick={activate} disabled={busy}>
                  {busy ? "처리 중…" : "신청 받기 시작"}
                </button>
              )}
              <button className="btn-ghost" onClick={onClose}>취소</button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <OffRequestModal> — OFF 신청 화면 (다음 달 캘린더)
    // ============================================================
    function OffRequestModal({ year, month, me, allUsers, allRequests, memos, clinicOverrides, dbHolidays, onClose }) {
      const nm = nextMonthInfo(year, month);
      const nmk = nextMonthKey(year, month);
      const { daysInMonth, startWeekday } = getMonthInfo(nm.year, nm.month);

      // mode: null = OFF 모드, "D"/"E"/"N"/"V" = 해당 시프트 모드
      const [mode, setMode] = useState(null);
      const [busy, setBusy] = useState(false);

      // 팀 필터 (본인 팀 기준)
      // 명세: A팀 = 앞/뒤/act 통합, S-616/617/act 개별
      // 우리 데이터엔 A팀은 그냥 "A". S는 각각 분리되어 있음. 그대로 사용.
      const myTeam = me.team;

      // 본인 신청 데이터 (이 달)
      const myMonthRequests = useMemo(() => {
        const m = allRequests?.[nmk]?.[me.sabun] || {};
        const out = {};
        Object.keys(m).forEach(k => { out[parseInt(k, 10)] = m[k]; });
        return out;
      }, [allRequests, nmk, me.sabun]);

      const myMemo = memos?.[nmk]?.text || "";
      const [memoText, setMemoText] = useState(myMemo);
      const memoSaveTimer = useRef(null);
      useEffect(() => { setMemoText(myMemo); }, [myMemo]);

      const onMemoChange = (val) => {
        setMemoText(val);
        if (memoSaveTimer.current) clearTimeout(memoSaveTimer.current);
        memoSaveTimer.current = setTimeout(async () => {
          try {
            await set(ref(db, `memos/${nmk}/text`), val);
          } catch (e) { console.error(e); }
        }, 600);
      };

      const onCellClick = async (day) => {
        if (busy) return;
        const dKey = String(day).padStart(2, "0");
        const path = `requests/${nmk}/${me.sabun}/${dKey}`;
        const existing = myMonthRequests[day];
        const desiredType = mode || "OFF";

        // 동일 타입 다시 클릭 → 삭제
        if (existing && existing.type === desiredType) {
          setBusy(true);
          try { await remove(ref(db, path)); }
          catch (e) { console.error(e); alert("삭제 실패"); }
          setBusy(false);
          return;
        }

        // 4명 제한 체크 (새로 추가하는 경우 또는 다른 타입에서 전환)
        const list = getRequestsForDay(allRequests, nmk, day, allUsers, myTeam);
        const meAlreadyIn = list.some(r => r.sabun === me.sabun);
        if (!meAlreadyIn && list.length >= 4) {
          alert("이 날 신청이 이미 4명입니다.");
          return;
        }

        setBusy(true);
        try {
          await set(ref(db, path), { type: desiredType, timestamp: Date.now() });
        } catch (e) { console.error(e); alert("저장 실패"); }
        setBusy(false);
      };

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="req-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(nm.year, nm.month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const dateColor = status === "closed" ? "var(--c-closed)"
          : status === "morning" ? "var(--c-morning)" : "var(--text)";
        const list = getRequestsForDay(allRequests, nmk, day, allUsers, myTeam);
        const isFull = list.length >= 4;

        cells.push(
          <button key={day} className={`req-cell ${isFull ? "full" : ""}`}
            onClick={() => onCellClick(day)} type="button">
            {isFull && <span className="full-mark">FULL</span>}
            <div className="date-num" style={{ color: dateColor }}>{day}</div>
            <div className="req-list">
              {list.slice(0, 4).map((r, i) => (
                <div key={r.sabun} className={`row shift-${r.type === "OFF" ? "O" : r.type}`}>
                  {r.type === "OFF" ? "O" : r.type} {r.name}
                </div>
              ))}
            </div>
          </button>
        );
      }

      const promptText = (() => {
        if (mode === null) return "희망 OFF 날짜를 선택하세요";
        if (mode === "D") return "희망 D 근무 날짜 선택하세요";
        if (mode === "E") return "희망 E 근무 날짜 선택하세요";
        if (mode === "N") return "희망 N 근무 날짜 선택하세요";
        if (mode === "V") return "희망 V(반차) 날짜 선택하세요";
        return "";
      })();

      const showButtons = myTeam === "main"
        ? ["V"]
        : ["D", "E", "N"];

      return (
        <div className="modal-backdrop" onClick={onClose} style={{ alignItems: "stretch" }}>
          <div className="modal" onClick={e => e.stopPropagation()}
            style={{ maxHeight: "100vh", borderRadius: 0, padding: 0 }}>
            {/* 상단 바 */}
            <div className="req-mode-bar">
              {showButtons.map(s => (
                <button key={s}
                  className={`mode-btn shift-${s} ${mode === s ? "active" : ""}`}
                  onClick={() => setMode(mode === s ? null : s)} type="button">
                  {s}
                </button>
              ))}
              <div className="spacer" />
              <button className="text-btn done" onClick={onClose} type="button">완료</button>
              <button className="text-btn cancel" onClick={onClose} type="button">취소</button>
            </div>

            {/* 헤더 */}
            <div style={{ padding: "12px 18px 6px" }}>
              <h2 className="modal-title" style={{ margin: "0 0 4px" }}>{nm.month}월 OFF 신청</h2>
              <p style={{ fontSize: 12, color: "var(--text-mute)", margin: 0 }}>
                {me.name} · {myTeam}팀 · 하루 최대 4명 (팀 단위)
              </p>
            </div>

            <div className="req-prompt">{promptText}</div>

            <div className="cal-weekdays" style={{ padding: "8px 8px 0" }}>
              {WEEKDAYS_KR.map((w, i) => (
                <div key={w} style={{
                  color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
                }}>{w}</div>
              ))}
            </div>
            <div className="req-grid">{cells}</div>

            {/* 메모 */}
            <div className="req-memo">
              <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 6px", fontWeight: 600 }}>
                📝 {nm.month}월 메모 (공유)
              </p>
              <textarea
                value={memoText} onChange={e => onMemoChange(e.target.value)}
                placeholder="이 달 OFF 신청 관련 메모… (자동 저장)" />
            </div>

            <div style={{ height: 24 }} />
          </div>
        </div>
      );
    }

    // ============================================================
    // <WhitelistAdmin> — 화이트리스트 + 관리자 권한 등록
    // ============================================================
    function WhitelistAdmin({ allUsers, admins, onClose }) {
      const [list, setList] = useState([]);
      const [bulkText, setBulkText] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        const r = ref(db, "whitelist");
        const unsub = onValue(r, snap => {
          const val = snap.val() || {};
          setList(Object.keys(val).sort());
        });
        return () => unsub();
      }, []);

      const addBulk = async () => {
        setErr("");
        const parts = bulkText.split(/[\s,;\n]+/).map(s => s.trim()).filter(Boolean);
        const invalid = parts.filter(s => !/^\d{5,6}$/.test(s));
        if (invalid.length) { setErr(`잘못된 사번: ${invalid.join(", ")}`); return; }
        if (!parts.length) { setErr("추가할 사번을 입력해 주세요."); return; }
        setBusy(true);
        try {
          const updates = {};
          parts.forEach(s => { updates[`whitelist/${s}`] = true; });
          await update(ref(db), updates);
          setBulkText("");
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const remove1 = async (sabun) => {
        if (!confirm(`${sabun} 화이트리스트에서 제거할까요? (이미 가입한 계정은 그대로 유지됨)`)) return;
        try { await remove(ref(db, `whitelist/${sabun}`)); }
        catch (e) { console.error(e); alert("삭제 실패"); }
      };

      const toggleAdmin = async (sabun, isCurrentlyAdmin) => {
        if (sabun === ADMIN_SABUN) {
          alert("기본 관리자는 변경할 수 없어요.");
          return;
        }
        try {
          if (isCurrentlyAdmin) {
            await remove(ref(db, `admins/${sabun}`));
          } else {
            await set(ref(db, `admins/${sabun}`), true);
          }
        } catch (e) {
          console.error(e); alert("저장 실패");
        }
      };

      // 등록된 사용자 리스트 (관리자 관리용)
      const registeredUsers = useMemo(() =>
        Object.entries(allUsers || {})
          .map(([sabun, u]) => ({ sabun, ...u }))
          .sort((a, b) => (a.hireDate || "").localeCompare(b.hireDate || ""))
      , [allUsers]);

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">화이트리스트 · 관리자</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <p className="menu-section-title">관리자 권한</p>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 8px" }}>
              체크된 사용자는 관리자 권한을 갖습니다. 본인(<code>{ADMIN_SABUN}</code>)은 자동.
            </p>
            <div style={{ maxHeight: 240, overflowY: "auto", border: "1px solid var(--border)", borderRadius: 10, padding: "4px 12px", marginBottom: 20 }}>
              {registeredUsers.length === 0 ? (
                <p style={{ color: "var(--text-soft)", fontSize: 13, padding: 12 }}>등록된 사용자가 없어요.</p>
              ) : (
                registeredUsers.map(u => {
                  const isMain = u.sabun === ADMIN_SABUN;
                  const isAdm = isMain || !!admins[u.sabun];
                  const c = teamColor(u.team);
                  return (
                    <div key={u.sabun} className="profile-row" style={{ borderColor: "var(--border)" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1 }}>
                        <span className="team-badge" style={{ background: c.bg, color: c.text, fontSize: 11, padding: "2px 8px" }}>{u.team}</span>
                        <span style={{ fontWeight: 500 }}>{u.name}</span>
                        <span style={{ fontSize: 11, color: "var(--text-soft)", fontFamily: "ui-monospace, monospace" }}>{u.sabun}</span>
                      </div>
                      <button className={`toggle ${isAdm ? "on" : ""}`}
                        onClick={() => toggleAdmin(u.sabun, isAdm)}
                        disabled={isMain}
                        type="button" aria-label="admin 토글"
                        style={isMain ? { opacity: 0.4 } : {}} />
                    </div>
                  );
                })
              )}
            </div>

            <p className="menu-section-title">가입 가능 사번</p>
            <p style={{ fontSize: 12, color: "var(--text-mute)", margin: "0 0 8px" }}>
              가입 가능한 사번 명단.
            </p>
            <div className="field" style={{ marginBottom: 8 }}>
              <textarea className="duty-textarea"
                style={{ letterSpacing: 0 }}
                value={bulkText} onChange={e => setBulkText(e.target.value)}
                placeholder="123456&#10;234567&#10;345678&#10;..." />
            </div>
            {err && <div className="auth-error" style={{ marginBottom: 10 }}>{err}</div>}
            <button className="btn-primary" onClick={addBulk} disabled={busy} style={{ marginBottom: 20 }}>
              {busy ? "추가 중…" : "추가"}
            </button>
            <p className="menu-section-title">현재 명단 ({list.length}명)</p>
            {list.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                아직 등록된 사번이 없어요.
              </p>
            ) : (
              <div>
                {list.map(s => (
                  <div key={s} className="profile-row">
                    <span className="profile-value" style={{ fontFamily: "ui-monospace, monospace" }}>{s}</span>
                    <button className="icon-btn" onClick={() => remove1(s)}
                      style={{ color: "var(--c-closed)" }} aria-label="삭제">×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW 등록 실패:", err));
      });
    }
  </script>
