        }, 500);
      };
      const handlePointerMove = (e) => {
        if (!startPosRef.current) return;
        const dx = e.clientX - startPosRef.current.x;
        const dy = e.clientY - startPosRef.current.y;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
          cancelTimer();
          startPosRef.current = null;
        }
      };
      const handlePointerUp = () => { cancelTimer(); startPosRef.current = null; };
      const handlePointerCancel = () => { cancelTimer(); startPosRef.current = null; };
      const handleClick = (e) => {
        if (readOnly) return;
        if (lpFiredRef.current) {
          lpFiredRef.current = false;
          e.preventDefault();
          return;
        }
        onShortTap && onShortTap(day);
      };
      const handleContextMenu = (e) => { e.preventDefault(); };

      const rawShift = duty?.shift;
      const displayShift = rawShift
        ? getDisplayShift(rawShift, dateISO, dayOfWeek, clinicOverrides, dbHolidays)
        : null;
      const isHelper = !!duty?.helper;
      const cellColor = displayShift ? shiftColor(displayShift) : null;

      // 셀 우상단 라벨: helper 팀 + 역할 (A팀이면)
      let helperLabel = null;
      if (duty?.helper) {
        const t = duty.helper.team;
        if (t === "main") helperLabel = "M";
        else if (t === "A") helperLabel = "A";
        else if (t === "B" || t === "C" || t === "D") helperLabel = t;
        else if (t === "S-616") helperLabel = "616";
        else if (t === "S-617") helperLabel = "617";
        else if (t === "S-act") helperLabel = "S액";
      }
      // V → O 변환된 셀은 라벨 의미 없음
      const labelHidden = (rawShift === "V" && displayShift === "O");
      const showHelperLabel = helperLabel && !labelHidden;
      // 역할 라벨 (앞/뒤/액/all) — effectiveRole prop 기준
      const roleLabel = effectiveRole && !labelHidden ? ROLE_CELL[effectiveRole] : null;
      // 두 라벨 합치기: helper가 있으면 helper만 (helper.role은 다른 팀 컨텍스트라 일단 helper 팀만 표시)
      // helper 없으면 role 라벨
      const cornerLabel = helperLabel ? helperLabel : roleLabel;
      const showCornerLabel = !!cornerLabel && !labelHidden;

      // 본인 신청 vs 실제 마크
      let markReq = false;
      let markMismatch = false;
      if (!readOnly && myRequest && duty) {
        const reqType = myRequest.type;
        if (reqType === "OFF" && displayShift === "O") {
          markReq = true;
        } else if (reqType !== "OFF" && reqType === rawShift) {
          // 일치 — 마크 없음
        } else {
          markMismatch = true;
        }
      }
      // ack된 날짜는 mismatch 숨김
      const showMismatch = markMismatch && !dayAcked;
      const showShortage = lineupShortage;
      const showSharedMemo = !!hasSharedMemo;

      return (
        <button
          className={`cal-cell ${isToday ? "today" : ""} ${pressing ? "long-pressing" : ""}`}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerCancel}
          onClick={handleClick}
          onContextMenu={handleContextMenu}
          type="button"
          style={{ touchAction: "manipulation" }}
        >
          <div className={`cal-date ${status}`}>{day}</div>
          {(markReq || showSharedMemo || showShortage || showMismatch) && (
            <div className="cell-marks">
              {markReq && <span className="mark req">req</span>}
              {showSharedMemo && <span className="mark shared-memo">📌</span>}
              {showShortage && <span className="mark shortage" />}
              {showMismatch && <span className="mark mismatch" />}
            </div>
          )}
          <div className="duty-stack">
            {displayShift && (
              <div className="duty-pill"
                style={{ background: cellColor.bg, color: cellColor.text }}>
                <span className={`shift-letter-wrap ${markReq ? "req-underline" : ""}`}>{displayShift}</span>
                {showCornerLabel && <span className="role-suffix">{cornerLabel}</span>}
              </div>
            )}
          </div>
        </button>
      );
    }

    // ============================================================
    // <ATeamRoleBar> — A팀 사용자의 그달 default role 토글 바
    // ============================================================
    function ATeamRoleBar({ targetSabun, targetName, monthKey, defaultRoles, allDuties, editable, isOther }) {
      const cur = getMonthDefaultRole(defaultRoles, targetSabun, monthKey);
      const [busy, setBusy] = useState(false);

      const curRole = cur.role; // "front" | "back" | "act" | null(미지정)
      const unassigned = !curRole;

      // 역할 설정 (앞/뒤/act 또는 null=미지정)
      // 미지정 셀에만 default가 표시로 적용되고, 셀에 명시된 role은 건드리지 않음 (덮어쓰기 X)
      const apply = async (newRole) => {
        if (!editable || busy) return;
        setBusy(true);
        try {
          const updates = {};
          if (!newRole) {
            updates[`defaultRoles/${targetSabun}/${monthKey}`] = null; // 미지정
          } else {
            updates[`defaultRoles/${targetSabun}/${monthKey}`] = { role: newRole };
          }
          await update(ref(db), updates);
        } catch (e) {
          console.error(e);
          alert("저장 실패");
        }
        setBusy(false);
      };

      const onUnassigned = (checked) => {
        if (!editable) return;
        if (checked) apply(null);       // 미지정으로
        else apply("front");            // 해제하면 일단 앞으로 시작 (선택 가능 상태)
      };
      const onPick = (role) => {
        if (!editable) return;
        apply(role);
      };

      return (
        <div className="a-role-bar">
          <span className="label">
            {isOther ? `${targetName} 담당` : "내 담당"}
          </span>
          <label className="a-role-unassigned">
            <input type="checkbox" checked={unassigned}
              disabled={!editable || busy}
              onChange={e => onUnassigned(e.target.checked)} />
            <span>미지정</span>
          </label>
          {!unassigned && (
            <div className="seg a-role-seg">
              <button className={curRole === "front" ? "active" : ""}
                disabled={!editable || busy}
                onClick={() => onPick("front")} type="button">앞</button>
              <button className={curRole === "back" ? "active" : ""}
                disabled={!editable || busy}
                onClick={() => onPick("back")} type="button">뒤</button>
              <button className={curRole === "act" ? "active" : ""}
                disabled={!editable || busy}
                onClick={() => onPick("act")} type="button">act</button>
            </div>
          )}
          {!editable && (
            <span style={{ fontSize: 10, color: "var(--text-soft)", marginLeft: 4 }}>(보기 전용)</span>
          )}
        </div>
      );
    }

    // ============================================================
    // <UserSwitcherDropdown> — 상단 이름 드롭다운 (조회/비교 진입)
    // 짧게 탭 = 조회 모드 / 길게 탭 = 비교 모드
    // ============================================================
    function UserSwitcherDropdown({ me, allUsers, seniority, compareSabuns = [], onClose, onPickMe, onPickView, onPickCompare, onPickAllView }) {
      const groups = useMemo(
        () => groupUsersByTeam(allUsers, seniority),
        [allUsers, seniority]
      );
      const [openTeams, setOpenTeams] = useState(() => {
        const s = {};
        TEAMS.forEach(t => { s[t] = false; });
        s[me.team] = true;
        return s;
      });
      const toggleTeam = (t) => setOpenTeams(prev => ({ ...prev, [t]: !prev[t] }));

      return (
        <>
          <div className="user-switcher-backdrop" onClick={onClose} />
          <div className="user-switcher-panel" onClick={e => e.stopPropagation()}>
            <button className="switcher-item me" onClick={onPickMe}>
              <span>👤 {me.name} (나)</span>
            </button>
            <button className="switcher-item" onClick={onPickAllView}>
              <span>📊 전체보기 (가로 시트)</span>
            </button>
            <div className="switcher-hint">
              짧게 = 조회 · 길게 = 비교 추가/제거 (최대 4명)
              {compareSabuns.length > 0 && (
                <span style={{ marginLeft: 8, color: "var(--accent)", fontWeight: 600 }}>
                  현재 {compareSabuns.length}명 비교중
                </span>
              )}
            </div>
            <div className="switcher-divider" />
            {TEAMS.map(team => {
              const list = groups[team] || [];
              if (list.length === 0) return null;
              const c = teamColor(team);
              const open = openTeams[team];
              return (
                <div key={team}>
                  <button className="switcher-item team-header" onClick={() => toggleTeam(team)}>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span className="team-badge" style={{ background: c.bg, color: c.text }}>{team}</span>
                      <span style={{ color: "var(--text-soft)", fontSize: 11 }}>{list.length}명</span>
                    </span>
                    <span style={{ color: "var(--text-soft)", fontSize: 12 }}>{open ? "▾" : "▸"}</span>
                  </button>
                  {open && list.map(u => (
                    <SwitcherPersonRow key={u.sabun}
                      user={u} isMe={u.sabun === me.sabun}
                      isCompared={compareSabuns.includes(u.sabun)}
                      onShortTap={() => {
                        if (u.sabun === me.sabun) onPickMe();
                        else onPickView(u.sabun);
                      }}
                      onLongPress={() => {
                        if (u.sabun === me.sabun) onPickMe();
                        else onPickCompare(u.sabun);
                      }} />
                  ))}
                </div>
              );
            })}
          </div>
        </>
      );
    }

    function SwitcherPersonRow({ user, isMe, isCompared, onShortTap, onLongPress }) {
      const timerRef = useRef(null);
      const lpFiredRef = useRef(false);
      const startPosRef = useRef(null);
      const [pressing, setPressing] = useState(false);

      const cancel = () => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
        }
        setPressing(false);
      };
      const start = (e) => {
        lpFiredRef.current = false;
        startPosRef.current = { x: e.clientX, y: e.clientY };
        setPressing(true);
        timerRef.current = setTimeout(() => {
          timerRef.current = null;
          setPressing(false);
          lpFiredRef.current = true;
          onLongPress();
        }, 500);
      };
      const move = (e) => {
        if (!startPosRef.current) return;
        const dx = e.clientX - startPosRef.current.x;
        const dy = e.clientY - startPosRef.current.y;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
          cancel();
          startPosRef.current = null;
        }
      };
      const up = () => { cancel(); startPosRef.current = null; };
      const click = (e) => {
        if (lpFiredRef.current) {
          lpFiredRef.current = false;
          e.preventDefault();
          return;
        }
        onShortTap();
      };

      return (
        <button
          className={`switcher-item person ${pressing ? "long-pressing" : ""}`}
          onPointerDown={start}
          onPointerMove={move}
          onPointerUp={up}
          onPointerCancel={up}
          onClick={click}
          onContextMenu={e => e.preventDefault()}
          style={{ touchAction: "manipulation", background: isCompared ? "var(--surface-alt)" : "transparent" }}>
          <span>
            {isCompared && <span style={{ marginRight: 4, color: "var(--accent)" }}>📊</span>}
            {user.name}{isMe && " (나)"}
          </span>
          <span style={{ fontSize: 11, color: "var(--text-soft)", fontFamily: "ui-monospace, monospace" }}>
            {user.sabun}
          </span>
        </button>
      );
    }

    // ============================================================
    // <CompareCalendarGrid> — 본인 + 최대 4명 비교
    // ============================================================
    function CompareCalendarGrid({ year, month, myName, myDuties, othersList, clinicOverrides, dbHolidays, today, onSwipeLeft, onSwipeRight }) {
      const { daysInMonth, startWeekday } = getMonthInfo(year, month);
      const swipeStartRef = useRef(null);

      const handleTouchStart = (e) => {
        const t = e.touches[0];
        swipeStartRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
      };
      const handleTouchEnd = (e) => {
        const start = swipeStartRef.current;
        if (!start) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        const dt = Date.now() - start.time;
        swipeStartRef.current = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) {
          if (dx < 0) onSwipeLeft && onSwipeLeft();
          else onSwipeRight && onSwipeRight();
        }
      };

      // 공동 OFF 계산 (본인 + 모든 비교 대상자가 OFF인 날)
      const sharedOff = useMemo(() => {
        const out = [];
        for (let d = 1; d <= daysInMonth; d++) {
          const my = myDuties[d];
          if (!my) continue;
          const iso = isoDate(year, month, d);
          const dow = (startWeekday + d - 1) % 7;
          const myDisp = getDisplayShift(my.shift, iso, dow, clinicOverrides, dbHolidays);
          if (myDisp !== "O") continue;
          const allOff = othersList.every(o => {
            const od = o.duties[d];
            if (!od) return false;
            const disp = getDisplayShift(od.shift, iso, dow, clinicOverrides, dbHolidays);
            return disp === "O";
          });
          if (allOff) out.push(d);
        }
        return out;
      }, [myDuties, othersList, year, month, daysInMonth, startWeekday, clinicOverrides, dbHolidays]);

      // 비교 모드 — helper도 시프트 색으로 표시, 밑줄/라벨 없음
      const renderPill = (duty, iso, dow, key) => {
        if (!duty) return <div key={key} className="duty-pill empty">·</div>;
        const disp = getDisplayShift(duty.shift, iso, dow, clinicOverrides, dbHolidays);
        if (!disp) return <div key={key} className="duty-pill empty">·</div>;
        const c = shiftColor(disp);
        return (
          <div key={key} className="duty-pill" style={{ background: c.bg, color: c.text }}>
            <span className="shift-letter-wrap">{disp}</span>
          </div>
        );
      };

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="cal-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const isToday = (year === today.year && month === today.month && day === today.day);

        cells.push(
          <div key={day} className={`cal-cell compare ${isToday ? "today" : ""}`}>
            <div className={`cal-date ${status}`}>{day}</div>
            <div className="duty-stack">
              {renderPill(myDuties[day], iso, dow, 0)}
              {othersList.map((o, i) =>
                renderPill(o.duties[day], iso, dow, i + 1)
              )}
            </div>
          </div>
        );
      }

      // 범례 (어느 줄이 누구인지)
      const legend = (
        <div style={{
          display: "flex", flexWrap: "wrap", gap: 8,
          padding: "0 14px 8px", fontSize: 11, color: "var(--text-mute)"
        }}>
          <span><strong style={{ color: "var(--text)" }}>1</strong> {myName}</span>
          {othersList.map((o, i) => (
            <span key={o.sabun}>
              <strong style={{ color: "var(--text)" }}>{i + 2}</strong> {o.name}
            </span>
          ))}
        </div>
      );

      return (
        <>
          {legend}
          {sharedOff.length > 0 && (
            <div className="compare-shared-off">
              <span>공동 OFF </span>
              <span className="count">{sharedOff.length}일</span>
              <span style={{ color: "var(--text-mute)", fontWeight: 400 }}> · {sharedOff.join(", ")}일</span>
            </div>
          )}
          <div className="cal-wrap" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            <div className="cal-weekdays">
              {WEEKDAYS_KR.map((w, i) => (
                <div key={w} style={{
                  color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
                }}>{w}</div>
              ))}
            </div>
            <div className="cal-grid">{cells}</div>
          </div>
        </>
      );
    }

    // 팀별 D/E/N 라인업 인원 카운트
    // main M은 D/E/N 어느 라인업에도 포함 안 함 (라인업 부족 체크 목적)
    function computeLineupCounts(monthDuties, allUsers, iso, dow, clinic, holidays, monthKey) {
      const counts = {}; // counts[team][shift] = number
      for (const sabun of Object.keys(monthDuties)) {
        const u = allUsers[sabun];
        if (!u) continue;
        if (monthKey && !isActiveInMonth(u, monthKey)) continue; // 휴직/퇴사 제외
        const v = normalizeDuty(monthDuties[sabun]);
        if (!v?.shift) continue;
        const team = (v.helper?.team) || teamForMonth(u, monthKey);
        const disp = getDisplayShift(v.shift, iso, dow, clinic, holidays);
        if (disp !== "D" && disp !== "E" && disp !== "N") continue;
        if (!counts[team]) counts[team] = {};
        counts[team][disp] = (counts[team][disp] || 0) + 1;
      }
      return counts;
    }

    // 시프트별 부족 여부 계산 (각 D/E/N 별로 어느 팀이 부족한지)
    // 반환: { D: bool, E: bool, N: bool, anyShortage: bool, allFilled: bool }
    function computeShortageByShift(day, year, month, allDuties, allUsers, clinicOverrides, dbHolidays) {
      const mk = getMonthKey(year, month);
      const monthData = allDuties[mk] || {};
      const allSabuns = Object.keys(allUsers);
      const empty = { D: false, E: false, N: false, anyShortage: false, allFilled: false };
      if (allSabuns.length === 0) return empty;
      const dKey = String(day).padStart(2, "0");
      const activeSabuns = allSabuns.filter(sb => isActiveInMonth(allUsers[sb], mk));
      const allFilled = activeSabuns.every(sb => {
        const v = normalizeDuty(monthData[sb]?.[dKey]);
        return !!v?.shift;
      });
      if (!allFilled) return empty;

      const dayData = {};
      for (const sb of allSabuns) {
        const v = monthData[sb]?.[dKey];
        if (v) dayData[sb] = v;
      }
      const iso = isoDate(year, month, day);
      const dow = (getMonthInfo(year, month).startWeekday + day - 1) % 7;
      const counts = computeLineupCounts(dayData, allUsers, iso, dow, clinicOverrides, dbHolidays, mk);

      const result = { D: false, E: false, N: false, anyShortage: false, allFilled: true };
      for (const s of ["D", "E", "N"]) {
        let short = false;
        if ((counts["A"]?.[s] || 0) < 2) short = true;
        for (const t of ["B", "C", "D", "S-616", "S-617"]) {
          if ((counts[t]?.[s] || 0) === 0) short = true;
        }
        result[s] = short;
        if (short) result.anyShortage = true;
      }
      return result;
    }

    function computeLineupAttention(day, year, month, allDuties, allUsers, clinicOverrides, dbHolidays) {
      const r = computeShortageByShift(day, year, month, allDuties, allUsers, clinicOverrides, dbHolidays);
      return { shortage: r.anyShortage };
    }

    function CalendarGrid({ year, month, myDuties, myRequests, clinicOverrides, dbHolidays, today, myTeam, onShortTap, onLongPress, onSwipeLeft, onSwipeRight, allUsers, allDuties, readOnly, dayMemos, ackedDates, defaultRoles, viewingSabun, mySabun }) {
      const { daysInMonth, startWeekday } = getMonthInfo(year, month);
      const swipeStartRef = useRef(null);

      const handleTouchStart = (e) => {
        const t = e.touches[0];
        swipeStartRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
      };
      const handleTouchEnd = (e) => {
        const start = swipeStartRef.current;
        if (!start) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        const dt = Date.now() - start.time;
        swipeStartRef.current = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) {
          if (dx < 0) onSwipeLeft && onSwipeLeft();
          else onSwipeRight && onSwipeRight();
        }
      };

      const monthKey = getMonthKey(year, month);

      // 모든 날짜의 라인업 부족/물음표 한 번에 계산
      const lineupMap = useMemo(() => {
        const out = {};
        if (!allDuties || !allUsers || readOnly) return out;
        for (let d = 1; d <= daysInMonth; d++) {
          out[d] = computeLineupAttention(d, year, month, allDuties, allUsers, clinicOverrides, dbHolidays);
        }
        return out;
      }, [allDuties, allUsers, year, month, daysInMonth, clinicOverrides, dbHolidays, readOnly]);

      const targetSabun = readOnly ? viewingSabun : mySabun;

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="cal-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
        const isToday = (year === today.year && month === today.month && day === today.day);
        const duty = myDuties[day];
        const holidayName = getHolidayName(iso, dbHolidays);
        const att = lineupMap[day] || {};

        // 셀 effectiveRole 계산 (A팀 + D/E/N + helper 아님 + role 미지정 시 default 적용)
        const rawShift = duty?.shift;
        const dispShift = rawShift ? getDisplayShift(rawShift, iso, dow, clinicOverrides, dbHolidays) : null;
        const effRole = duty
          ? getCellEffectiveRole(duty, myTeam, targetSabun, monthKey, defaultRoles, dispShift)
          : null;

        cells.push(
          <CalendarCell key={day}
            day={day} dateISO={iso} dayOfWeek={dow}
            status={status} isToday={isToday}
            holidayName={holidayName} duty={duty} myTeam={myTeam}
            clinicOverrides={clinicOverrides} dbHolidays={dbHolidays}
            myRequest={myRequests?.[day] || null}
            readOnly={readOnly}
            hasSharedMemo={!!dayMemos?.[iso]?.text}
            lineupShortage={att.shortage}
            dayAcked={!!ackedDates?.[iso]}
            effectiveRole={effRole}
            onShortTap={onShortTap} onLongPress={onLongPress} />
        );
      }

      return (
        <div className="cal-wrap" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
          <div className="cal-weekdays">
            {WEEKDAYS_KR.map((w, i) => (
              <div key={w} style={{
                color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
              }}>{w}</div>
            ))}
          </div>
          <div className="cal-grid">{cells}</div>
        </div>
      );
    }

    // ============================================================
    // <DayDetailModal>
    // ============================================================
    // 공지 카테고리 색 팔레트 (10가지)
    const NOTICE_COLORS = [
      { id: "coral",  bg: "#FCC8C8", text: "#5B1414", name: "코랄" },
      { id: "orange", bg: "#FCD7B0", text: "#5C2D04", name: "주황" },
      { id: "pink",   bg: "#F8C0DC", text: "#4F1234", name: "핑크" },
      { id: "lime",   bg: "#E5EDB8", text: "#36400C", name: "라임" },
      { id: "mint",   bg: "#BFE8D8", text: "#0F3B2A", name: "민트" },
      { id: "teal",   bg: "#B8E0E8", text: "#0A363F", name: "청록" },
      { id: "lilac",  bg: "#E0C8EC", text: "#3D1A4B", name: "라일락" },
      { id: "brown",  bg: "#E0C8A8", text: "#3D2308", name: "연갈" },
      { id: "gray",   bg: "#D8D8D8", text: "#252525", name: "회색" },
      { id: "beige",  bg: "#ECE0C8", text: "#3C2D0E", name: "베이지" },
    ];
    const DEFAULT_CATEGORY = { id: "_default", name: "일반", color: "gray" };

    function getNoticeColor(colorId) {
      const c = NOTICE_COLORS.find(c => c.id === colorId);
      return c || NOTICE_COLORS[8]; // 회색 기본
    }

    // 시간 표시 (방금/n분 전/...)
    function formatRelativeTime(ts) {
      if (!ts) return "";
      const now = Date.now();
      const diff = now - ts;
      const min = Math.floor(diff / 60000);
      if (min < 1) return "방금";
      if (min < 60) return `${min}분 전`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}시간 전`;
      const days = Math.floor(hr / 24);
      if (days < 7) return `${days}일 전`;
      const d = new Date(ts);
      return `${d.getMonth() + 1}월 ${d.getDate()}일`;
    }

    // 공지 ID 생성
    function genNoticeId() {
      return `notice_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }
    function genCategoryId() {
      return `cat_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    // OFF 신청 시스템: 다음 달 monthKey
    function nextMonthKey(year, month) {
      const d = new Date(year, month, 1); // month는 1-based이므로 month로 넣으면 다음 달
      return getMonthKey(d.getFullYear(), d.getMonth() + 1);
    }
    function nextMonthInfo(year, month) {
      const d = new Date(year, month, 1);
      return { year: d.getFullYear(), month: d.getMonth() + 1 };
    }
    // 요청 데이터 헬퍼
    function getRequestAt(allRequests, monthKey, sabun, day) {
      const dKey = String(day).padStart(2, "0");
      return allRequests?.[monthKey]?.[sabun]?.[dKey] || null;
    }
    function getRequestsForDay(allRequests, monthKey, day, allUsers, teamFilter) {
      // teamFilter가 있으면 해당 팀 사람만 (A팀은 모든 A 포함, S-616만 등)
      const dKey = String(day).padStart(2, "0");
      const monthData = allRequests?.[monthKey] || {};
      const result = [];
      Object.entries(monthData).forEach(([sabun, sabunData]) => {
        const req = sabunData?.[dKey];
        if (!req) return;
        const user = allUsers[sabun];
        if (!user) return;
        if (teamFilter && user.team !== teamFilter) return;
        result.push({ sabun, ...req, name: user.name, team: user.team, hireDate: user.hireDate });
      });
      // 먼저 신청한 사람이 위쪽 — timestamp 오름차순
      result.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      return result;
    }
    function getRequestCountForDay(allRequests, monthKey, day, allUsers, teamFilter) {
      return getRequestsForDay(allRequests, monthKey, day, allUsers, teamFilter).length;
    }

    // 듀티 통계 계산
    // monthKeys: ["YYYY-MM", ...] (시간순)
    // targetSabun: 통계 대상자
    function computeDutyStats(monthKeys, targetSabun, allDuties, allUsers, clinicOverrides, dbHolidays) {
      const shiftCounts = { D: 0, E: 0, N: 0, O: 0, V: 0, M: 0, T: 0 };
      let weekendD = 0, weekendE = 0, weekendN = 0;
      let holidayWork = 0;
      const dailyShifts = []; // 시간순으로 쌓아 연속 일수 계산
      const coworkCount = {}; // sabun → 같이 일한 일수
      const coOff = {};       // sabun → 공동 OFF 일수
      const targetUser = allUsers[targetSabun];
      if (!targetUser) return null;

      // monthKey 시간순 보장
      const sortedKeys = monthKeys.slice().sort();

      sortedKeys.forEach(mk => {
        const [yy, mm] = mk.split("-").map(Number);
        const info = getMonthInfo(yy, mm);
        for (let day = 1; day <= info.daysInMonth; day++) {
          const iso = isoDate(yy, mm, day);
          const dow = getWeekday(yy, mm, day);
          const duty = getDutyAt(allDuties, mk, targetSabun, day);
          if (!duty) {
            // 데이터 없으면 streak 끊기 위해 빈 항목 push (null shift)
            dailyShifts.push({ shift: null });
            continue;
          }
          const ds = getDisplayShift(duty.shift, iso, dow, clinicOverrides, dbHolidays);
          if (ds && shiftCounts[ds] != null) shiftCounts[ds]++;

          const isHoliday = !!getHolidayName(iso, dbHolidays);
          const isSat = dow === 6;
          const isSun = dow === 0;
          const isWorkShift = ["D", "E", "N", "V", "M", "T"].includes(ds);
          if (isWorkShift && (isHoliday || isSun)) holidayWork++;
          if (isWorkShift && isSat) {
            if (ds === "D") weekendD++;
            else if (ds === "E") weekendE++;
            else if (ds === "N") weekendN++;
          }

          dailyShifts.push({ shift: ds });

          // 같이 일한 사람: 본인 D/E/N일 때만, 같은 effective team 사람
          if (["D", "E", "N"].includes(ds)) {
            const myTeam = getEffectiveTeam(duty, targetUser.team);
            const monthData = allDuties?.[mk] || {};
            Object.keys(monthData).forEach(s => {
              if (s === targetSabun) return;
              const u = allUsers[s];
              if (!u) return;
              const d = getDutyAt(allDuties, mk, s, day);
              if (!d) return;
              const sds = getDisplayShift(d.shift, iso, dow, clinicOverrides, dbHolidays);
              if (sds !== ds) return;
              if (getEffectiveTeam(d, u.team) !== myTeam) return;
              coworkCount[s] = (coworkCount[s] || 0) + 1;
            });
          }

          // 공동 OFF
          if (ds === "O") {
            const monthData = allDuties?.[mk] || {};
            Object.keys(monthData).forEach(s => {
              if (s === targetSabun) return;
              if (!allUsers[s]) return;
              const d = getDutyAt(allDuties, mk, s, day);
              if (!d) return;
              const sds = getDisplayShift(d.shift, iso, dow, clinicOverrides, dbHolidays);
              if (sds === "O") coOff[s] = (coOff[s] || 0) + 1;
            });
          }
        }
      });

      // 연속 일수
      let maxWorkStreak = 0, curWorkStreak = 0;
      let maxOffStreak = 0, curOffStreak = 0;
      dailyShifts.forEach(({ shift }) => {
        if (shift === "O") {
          curOffStreak++;
          curWorkStreak = 0;
          if (curOffStreak > maxOffStreak) maxOffStreak = curOffStreak;
        } else if (["D", "E", "N", "V", "M", "T"].includes(shift)) {
          curWorkStreak++;
          curOffStreak = 0;
          if (curWorkStreak > maxWorkStreak) maxWorkStreak = curWorkStreak;
        } else {
          // 미입력 → streak 끊기
          curWorkStreak = 0;
          curOffStreak = 0;
        }
      });

      const totalDays = dailyShifts.filter(d => d.shift != null).length;

      return {
        shiftCounts,
        weekend: { D: weekendD, E: weekendE, N: weekendN },
        holidayWork,
        maxWorkStreak,
        maxOffStreak,
        coworkTop: Object.entries(coworkCount).sort((a, b) => b[1] - a[1]).slice(0, 3),
        coOffTop: Object.entries(coOff).sort((a, b) => b[1] - a[1]).slice(0, 3),
        totalDays,
      };
    }

    // 시간 기반 디폴트 시프트 (main 팀이 사용)
    function getCurrentTimeShift() {
      const h = new Date().getHours();
      if (h >= 6 && h < 13) return "D";
      if (h >= 13 && h < 21) return "E";
      return "N";
    }

    // ============================================================
    // <DayMemoSection> — 일별 메모 (개인 + 공유)
    // ============================================================
    function DayMemoSection({ iso, isAdmin, personalMemo, sharedMemo, mySabun, myName }) {
      const [personalText, setPersonalText] = useState(personalMemo);
      const [sharedText, setSharedText] = useState(sharedMemo?.text || "");
      const personalTimer = useRef(null);
      const sharedTimer = useRef(null);

      useEffect(() => { setPersonalText(personalMemo); }, [personalMemo]);
      useEffect(() => { setSharedText(sharedMemo?.text || ""); }, [sharedMemo]);

      const onPersonalChange = (val) => {
        setPersonalText(val);
        if (personalTimer.current) clearTimeout(personalTimer.current);
        personalTimer.current = setTimeout(async () => {
          try {
            const path = `personalMemos/${mySabun}/${iso}`;
            if (val.trim() === "") {
              await remove(ref(db, path));
            } else {
              await set(ref(db, path), { text: val });
            }
          } catch (e) { console.error(e); }
        }, 700);
      };

      const onSharedChange = (val) => {
        setSharedText(val);
        if (sharedTimer.current) clearTimeout(sharedTimer.current);
        sharedTimer.current = setTimeout(async () => {
          try {
            const path = `dayMemos/${iso}`;
            if (val.trim() === "") {
              await remove(ref(db, path));
            } else {
              await set(ref(db, path), {
                text: val,
                authorId: mySabun,
                authorName: myName,
                updatedAt: Date.now(),
              });
            }
          } catch (e) { console.error(e); }
        }, 700);
      };

      // 일반 사용자: 공유 메모는 read-only로 보이고, 내 메모만 편집
      // 관리자: 둘 다 편집
      const hasSharedMemo = !!sharedMemo?.text;
      const showSharedRow = isAdmin || hasSharedMemo;

      return (
        <div className="day-memo-section">
          {showSharedRow && (
            <div className="day-memo-row">
              <span className="icon">📢</span>
              <span className="badge">전체</span>
              <input
                type="text"
                value={sharedText}
                onChange={isAdmin ? (e) => onSharedChange(e.target.value) : undefined}
                disabled={!isAdmin}
                placeholder={isAdmin ? "전체 공유 메모 (작성하면 모두에게 표시)" : ""}
                maxLength={120} />
            </div>
          )}
          <div className="day-memo-row">
            <span className="icon">🗒</span>
            <input
              type="text"
              value={personalText}
              onChange={(e) => onPersonalChange(e.target.value)}
              placeholder="내 메모 (본인만 볼 수 있음)"
              maxLength={120} />
          </div>
        </div>
      );
    }

    function DayDetailModal({ year, month, day, me, allUsers, allDuties, allRequests, seniority, personalMemos, dayMemos, defaultRoles, isAdmin, clinicOverrides, dbHolidays, onClose, onNavigate }) {
      const monthKey = getMonthKey(year, month);
      const iso = isoDate(year, month, day);
      const dow = getWeekday(year, month, day);
      const clinic = getClinicStatus(iso, dow, clinicOverrides, dbHolidays);
      const holidayName = getHolidayName(iso, dbHolidays);

      const myDuty = getDutyAt(allDuties, monthKey, me.sabun, day);
      const myRawShift = myDuty?.shift;
      // V→O 변환 적용
      const myShift = myRawShift
        ? getDisplayShift(myRawShift, iso, dow, clinicOverrides, dbHolidays)
        : null;
      const myEffectiveTeam = myDuty?.helper?.team || teamForMonth(me, monthKey);
      const myEffectiveRole = getEffectiveRole(myDuty);
      const myIsHelper = isManualHelper(myDuty);

      // 신청 vs 확정 불일치 체크
      const myRequest = getRequestAt(allRequests, monthKey, me.sabun, day);
      const mismatchNote = (() => {
        if (!myRequest || !myDuty) return null;
        const t = myRequest.type;
        if (t === "OFF" && myShift === "O") return null;
        if (t !== "OFF" && t === myRawShift) return null;
        // 불일치
        const reqLabel = t === "OFF" ? "OFF" : t;
        return `${reqLabel} 신청했지만 실제는 ${myShift || "—"}예요.`;
      })();

      // selectedShift 디폴트
      // - 본인이 D/E/N이면 그 시프트
      // - 아니고 본인이 main 팀이면 시간 기반
      // - 아니면 null
      const initialSelected = (() => {
        if (HANDOVER_SHIFTS.includes(myShift)) return myShift;
        if (me.team === "main") return getCurrentTimeShift();
        return null;
      })();
      const [selectedShift, setSelectedShift] = useState(initialSelected);

      const handover = selectedShift ? getHandoverConfig(selectedShift) : null;
      // 인계는 selectedShift == myShift이고 본인 effective team이 main이 아닐 때만
      const showHandover = handover
        && myEffectiveTeam !== "main"
        && selectedShift === myShift;

      let prevPeople = [], nextPeople = [];
      let prevMK = monthKey, prevDay = day, nextMK = monthKey, nextDay = day;
      if (showHandover) {
        const pd = shiftDate(year, month, day, handover.prev.offset);
        prevMK = getMonthKey(pd.year, pd.month);
        prevDay = pd.day;
        const all = getPeopleByShift(allDuties, prevMK, prevDay, handover.prev.shift);
        prevPeople = all.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, prevMK, s, prevDay);
          return getEffectiveTeamForMonth(d, u, prevMK) === myEffectiveTeam;
        });

        const nd = shiftDate(year, month, day, handover.next.offset);
        nextMK = getMonthKey(nd.year, nd.month);
        nextDay = nd.day;
        const allN = getPeopleByShift(allDuties, nextMK, nextDay, handover.next.shift);
        nextPeople = allN.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          const d = getDutyAt(allDuties, nextMK, s, nextDay);
          return getEffectiveTeamForMonth(d, u, nextMK) === myEffectiveTeam;
        });
      }

      // 라인업: selectedShift 있을 때만
      const showLineup = !!selectedShift;
      let lineup = null;
      if (showLineup) {
        // 그날 selectedShift인 모든 사람 (D/E/N)
        const directSabuns = getPeopleByShift(allDuties, monthKey, day, selectedShift);
        // V는 morning 진료일이면 O로 변환되어 사실상 사라짐 (인계/라인업도 X)
        // 여기서 V→O 변환된 사람을 직접 라인업에서 제외하기 위해 filter
        const filteredDirect = directSabuns.filter(s => {
          const u = allUsers[s];
          if (!isActiveInMonth(u, monthKey)) return false; // 휴직/퇴사 제외
          const d = getDutyAt(allDuties, monthKey, s, day);
          if (!d) return false;
          const disp = getDisplayShift(d.shift, iso, dow, clinicOverrides, dbHolidays);
          return disp === selectedShift;
        });
        // D 라인업: + main 팀의 M·V 근무자 (V는 morning 진료일이면 O로 변환되니 제외)
        // E 라인업: + main 팀의 M 근무자만 (V는 오후 없음)
        // N 라인업: 추가 없음
        let extraMain = [];
        if (selectedShift === "D") {
          const mAll = getPeopleByShift(allDuties, monthKey, day, "M");
          const vAll = getPeopleByShift(allDuties, monthKey, day, "V");
          // V는 displayShift가 V로 남아있는 경우만 (morning 진료일은 O가 되어 라인업 제외)
          const vKeep = vAll.filter(s => {
            const d = getDutyAt(allDuties, monthKey, s, day);
            const disp = getDisplayShift(d.shift, iso, dow, clinicOverrides, dbHolidays);
            return disp === "V";
          });
          extraMain = [...mAll, ...vKeep];
        } else if (selectedShift === "E") {
          extraMain = getPeopleByShift(allDuties, monthKey, day, "M");
        }
        // main / 이송 팀에 속한 사람만 추가 (effective team) — 둘 다 M/V로 D/E 라인업 합류
        const mainSabuns = extraMain.filter(s => {
          const u = allUsers[s];
          if (!u) return false;
          if (!isActiveInMonth(u, monthKey)) return false;
          const d = getDutyAt(allDuties, monthKey, s, day);
          const t = getEffectiveTeamForMonth(d, u, monthKey);
          return t === "main" || t === "이송";
        });
        // 합쳐서 그룹핑 (중복 제거)
        const allSabuns = Array.from(new Set([...filteredDirect, ...mainSabuns]));
        lineup = groupByEffectiveTeam(allSabuns, allUsers, allDuties, monthKey, day);
      }

      const dateColorClass = clinic;
      const sColor = myShift ? shiftColor(myShift) : null;
      const myTeamColor = teamColor(myEffectiveTeam);

      // 본인 큰 글씨 색: 항상 시프트 색 (helper여도 시프트 색)
      const bigBg = sColor?.bg;
      const bigText = sColor?.text;

      // 가운데 줄 (M 또는 V)
      // - rawShift M → [M], rawShift V → [V] (V→O 변환 시 표시 안 함), rawShift T(호환) → [T]
      const showMidRow = (myRawShift === "M" || myRawShift === "T")
        || (myRawShift === "V" && myShift === "V"); // V가 O로 변환되면 표시 안 함
      const midShift = (() => {
        if (myRawShift === "M") return "M";
        if (myRawShift === "T") return "T";
        if (myRawShift === "V" && myShift === "V") return "V";
        return null;
      })();

      const shiftTabClass = (s) => {
        const base = `shift-tab shift-${s}`;
        return selectedShift === s ? `${base} active` : base;
      };

      // 시프트별 라인업 부족 (D/E/N 탭에 빨간 점 표시용)
      const shortageByShift = useMemo(
        () => computeShortageByShift(day, year, month, allDuties, allUsers, clinicOverrides, dbHolidays),
        [day, year, month, allDuties, allUsers, clinicOverrides, dbHolidays]
      );

      const handleShiftTabClick = (s) => {
        if (selectedShift === s) setSelectedShift(null);
        else setSelectedShift(s);
      };

      // 좌우 swipe 핸들러
      const swipeStartRef = useRef(null);
      const handleTouchStart = (e) => {
        const t = e.touches[0];
        swipeStartRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
      };
      const handleTouchEnd = (e) => {
        const start = swipeStartRef.current;
        if (!start) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        const dt = Date.now() - start.time;
        swipeStartRef.current = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) {
          if (dx < 0) onNavigate && onNavigate(1);
          else onNavigate && onNavigate(-1);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}
            onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            <div className="modal-header">
              <div>
                <p className={`day-modal-date ${dateColorClass}`} style={{ marginBottom: holidayName ? 4 : 8 }}>
                  <span className="day-num">{month}월 {day}일</span>
                  <span className="weekday">({WEEKDAYS_KR[dow]})</span>
                </p>
                <p className="day-clinic-tag">
                  {holidayName && <span style={{ color: "var(--c-closed)", fontWeight: 600 }}>{holidayName} · </span>}
                  진료 {CLINIC_LABELS[clinic]}
                </p>
              </div>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            {mismatchNote && (
              <div style={{
                padding: "8px 12px", marginBottom: 12,
                background: "#FFE8E8", color: "#7A1F1F",
                borderRadius: 8, fontSize: 12, fontWeight: 500,
                display: "flex", alignItems: "center", gap: 6,
              }}>
                <span>⚠️</span>
                <span>{mismatchNote}</span>
              </div>
            )}

            <DayMemoSection
              iso={iso}
              isAdmin={isAdmin}
              personalMemo={personalMemos?.[iso]?.text || ""}
              sharedMemo={dayMemos?.[iso] || null}
              mySabun={me.sabun} myName={me.name} />

            <div className="day-section">
              <p className="day-section-title">내 근무</p>

              <div className="myshift-display">
                {myShift ? (
                  <div className="myshift-big" style={{ background: bigBg, color: bigText }}>
                    <span style={myIsHelper ? {
                      textDecoration: "underline",
                      textDecorationThickness: "2px",
                      textUnderlineOffset: "4px"
                    } : {}}>{myShift}</span>
                    {myEffectiveRole && (
                      <span style={{ fontSize: 16, fontWeight: 600, marginLeft: 4, opacity: 0.8 }}>
                        {ROLE_SHORT[myEffectiveRole]}
                      </span>
                    )}
                  </div>
                ) : (
                  <div className="myshift-big empty">듀티 없음</div>
                )}
                {myShift && (
                  <div className="myshift-meta">
                    <span>{SHIFT_LABELS[myShift] || myShift}</span>
                    {myEffectiveRole && <span className="role-badge">{ROLE_LABELS[myEffectiveRole]}</span>}
                    <span className="meta-team" style={{ background: myTeamColor.bg, color: myTeamColor.text }}>
                      {myEffectiveTeam}
                    </span>
                    {myIsHelper && myEffectiveTeam !== "main" && <span className="role-badge">helper</span>}
                  </div>
                )}
              </div>

              {/* M 또는 V 단일 표시 줄 */}
              {showMidRow && midShift && (
                <div className="shift-tabs-row row-tmv-1">
                  <button
                    className={`shift-tab read-only active shift-${midShift}`}
                    type="button" disabled>
                    {midShift}
                  </button>
                </div>
              )}

              {/* D/E/N 탭 */}
              <div className="shift-tabs-row row-den">
                {["D", "E", "N"].map(s => (
                  <button key={s}
                    className={shiftTabClass(s)}
                    onClick={() => handleShiftTabClick(s)}
                    type="button"
                    style={{ position: "relative" }}>
                    {s}
                    {shortageByShift[s] && <span className="shift-tab-shortage" />}
                  </button>
                ))}
              </div>
              <p className="edit-hint">D/E/N 탭하여 인계·라인업 전환 · 셀 길게 눌러 수정 · 좌우 swipe로 날짜 이동</p>
            </div>

            {showHandover && (
              <div className="day-section">
                <p className="day-section-title">{myEffectiveTeam}팀 {selectedShift} 인수인계</p>
                <HandoverRow direction="prev" config={handover.prev}
                  people={prevPeople} allUsers={allUsers} allDuties={allDuties}
                  monthKey={prevMK} day={prevDay}
                  mySabun={me.sabun} myTeam={myEffectiveTeam} />
                <HandoverRow direction="next" config={handover.next}
                  people={nextPeople} allUsers={allUsers} allDuties={allDuties}
                  monthKey={nextMK} day={nextDay}
                  mySabun={me.sabun} myTeam={myEffectiveTeam} />
              </div>
            )}

            {showLineup && lineup && (
              <div className="day-section">
                <p className="day-section-title">{selectedShift} 라인업</p>
                <LineupBlock lineup={lineup} mySabun={me.sabun} allUsers={allUsers}
                  monthKey={monthKey} day={day} allDuties={allDuties}
                  iso={iso} dayOfWeek={dow}
                  clinicOverrides={clinicOverrides} dbHolidays={dbHolidays}
                  currentShift={selectedShift} seniority={seniority}
                  defaultRoles={defaultRoles} />
              </div>
            )}
          </div>
        </div>
      );
    }

    function HandoverRow({ direction, config, people, allUsers, allDuties, monthKey, day, mySabun, myTeam }) {
      const arrow = direction === "prev" ? "←" : "→";
      return (
        <div className="handover-row">
          <div className="handover-arrow">{arrow}</div>
          <div className="handover-info">
            <div className="handover-meta">
              {direction === "prev" ? "받음" : "넘김"} · {config.labelTime}
            </div>
            {people.length === 0 ? (
              <div className="handover-empty">
                {direction === "prev" ? "이전번 근무자가 없어요" : "다음번 근무자가 없어요"}
              </div>
            ) : (
              <div className="handover-people">
                {people.map(s => {
                  const duty = getDutyAt(allDuties, monthKey, s, day);
                  return (
                    <PersonChip key={s} sabun={s} user={allUsers[s]}
                      isMe={s === mySabun} teamForColor={myTeam}
                      role={getEffectiveRole(duty)}
                      isHelper={isManualHelper(duty)} />
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 이 라인업에서 TOP 1명 결정 (displayShift가 currentShift와 일치하는 사람 중 가장 senior)
    function findTopSabun(lineup, currentShift, allUsers, monthKey, day, allDuties, iso, dayOfWeek, clinicOverrides, dbHolidays, seniority) {
      if (!currentShift || !["D", "E", "N"].includes(currentShift)) return null;
      const candidates = [];
      for (const team of TEAMS) {
        const sabuns = lineup[team] || [];
        for (const s of sabuns) {
          const duty = getDutyAt(allDuties, monthKey, s, day);
          if (!duty) continue;
          const disp = getDisplayShift(duty.shift, iso, dayOfWeek, clinicOverrides, dbHolidays);
          if (disp === currentShift) candidates.push(s);
        }
      }
      if (candidates.length === 0) return null;
      candidates.sort((a, b) => {
        const ua = allUsers[a], ub = allUsers[b];
        if (!ua || !ub) return 0;
        return compareUsersBySeniority(
          { sabun: a, ...ua }, { sabun: b, ...ub }, seniority
        );
      });
      return candidates[0];
    }

    function LineupBlock({ lineup, mySabun, allUsers, monthKey, day, allDuties, iso, dayOfWeek, clinicOverrides, dbHolidays, currentShift, seniority, defaultRoles }) {
      const topSabun = useMemo(() =>
        findTopSabun(lineup, currentShift, allUsers, monthKey, day, allDuties, iso, dayOfWeek, clinicOverrides, dbHolidays, seniority),
        [lineup, currentShift, allUsers, monthKey, day, allDuties, iso, dayOfWeek, clinicOverrides, dbHolidays, seniority]
      );

      // 액팅 부재 경고 (D/E/N 라인업일 때만)
      const actWarnings = useMemo(() => {
        if (!["D", "E", "N"].includes(currentShift)) return [];
        const w = [];
        const aCount = (lineup["A"] || []).length;
        const sActCount = (lineup["S-act"] || []).length;
        if (aCount <= 2) w.push("A팀");
        if (sActCount === 0) w.push("Sub");
        return w;
      }, [lineup, currentShift]);

      return (
        <div>
          {actWarnings.length > 0 && (
            <div className="lineup-act-warning">
              ⚠ {actWarnings.join(", ")} 액팅 없음
            </div>
          )}
          {TEAMS.map(team => {
            const sabuns = lineup[team] || [];
            if (sabuns.length === 0) return null;
            const c = teamColor(team);
            return (
              <div key={team} className="lineup-team">
                <div className="lineup-team-label">
                  <span className="team-badge" style={{ background: c.bg, color: c.text }}>{team}</span>
                </div>
                <div className="lineup-people">
                  {sabuns.map(s => {
                    const duty = getDutyAt(allDuties, monthKey, s, day);
                    const isHelper = isManualHelper(duty);
                    const showHelperBadge = isHelper && team !== "main";
                    const personRawShift = duty?.shift;
                    const personDispShift = personRawShift
                      ? getDisplayShift(personRawShift, iso, dayOfWeek, clinicOverrides, dbHolidays)
                      : null;
                    const showShiftLabel = (team === "main" || team === "이송") && personDispShift;
                    // A팀 사람: 명시 role 우선, 없으면 그 사람 defaultRoles 적용
                    const personUser = allUsers[s];
                    const effRole = getCellEffectiveRole(
                      duty, teamForMonth(personUser, monthKey), s, monthKey, defaultRoles, personDispShift
                    );
                    return (
                      <PersonChip key={s}
                        sabun={s} user={personUser}
                        isMe={s === mySabun}
                        teamForColor={team}
                        role={effRole}
                        isHelper={showHelperBadge}
                        chipShift={showShiftLabel ? personDispShift : null}
                        isTop={s === topSabun} />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function PersonChip({ sabun, user, isMe, teamForColor, role, isHelper, chipShift, isTop }) {
      if (!user) {
        return <span className="person-chip" style={{
          background: "var(--surface-alt)", color: "var(--text-soft)"
        }}>{sabun}</span>;
      }
      const c = teamColor(teamForColor || user.team);
      return (
        <span className={`person-chip ${isMe ? "me" : ""} ${isHelper ? "helper-chip" : ""}`}
          style={{ background: c.bg, color: c.text, position: "relative" }}>
          {chipShift && <span className="role-tag" style={{ fontWeight: 700, marginRight: 2 }}>{chipShift}</span>}
          {user.name}
          {role && <span className="role-tag">({ROLE_LABELS[role]})</span>}
          {isHelper && <span className="role-tag">·helper</span>}
          {isTop && (
            <span style={{
              position: "absolute", top: -5, right: -2,
              fontSize: 8, fontWeight: 800,
              background: "var(--accent)", color: "#fff",
              padding: "1px 3px", borderRadius: 3,
              letterSpacing: 0.3, lineHeight: 1,
            }}>TOP</span>
          )}
        </span>
      );
    }

    // ============================================================
    // <DutyQuickEdit>
    // ============================================================
    function DutyQuickEdit({ year, month, day, targetSabun, targetTeam, targetName, isOtherEdit, currentDuty, onClose }) {
      const initialShift = currentDuty?.shift || "O";
      const initialRole = getEffectiveRole(currentDuty);
      const initialHelperOpt = (() => {
        if (!currentDuty?.helper) return null;
        const h = currentDuty.helper;
        if (h.team === "A") {
          return HELPER_OPTIONS.find(o => o.team === "A" && o.role === (h.role || null))?.key
              || HELPER_OPTIONS.find(o => o.team === "A" && o.role === "act")?.key;
        }
        return HELPER_OPTIONS.find(o => o.team === h.team)?.key || null;
      })();

      const [shift, setShift] = useState(initialShift);
      const [role, setRole] = useState(initialRole);
      const [helperOn, setHelperOn] = useState(!!initialHelperOpt);
      const [helperKey, setHelperKey] = useState(initialHelperOpt);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const helperOpt = helperKey ? HELPER_OPTIONS.find(o => o.key === helperKey) : null;
      const helperTeam = helperOpt?.team;

      // 현재 컨텍스트가 main인지: target팀이 main + helper 안 켰거나, helper로 main 갔거나
      const isMainContext = (!helperOn && targetTeam === "main") || (helperOn && helperTeam === "main");
      const allowedShifts = isMainContext ? ALL_SHIFTS : BASIC_SHIFTS;
      const isRoleShift = ROLE_SHIFTS.includes(shift);
      const isAteam = targetTeam === "A";

      // shift가 허용 범위 밖으로 나가면 자동 D로 리셋
      useEffect(() => {
        if (!allowedShifts.includes(shift)) {
          setShift("D");
        }
      }, [allowedShifts, shift]);

      // shift가 D/E/N이 아니게 되면 role 초기화
      useEffect(() => {
        if (!isRoleShift) setRole(null);
      }, [isRoleShift]);

      // helper 토글 끄면 helperKey 초기화
      useEffect(() => {
        if (!helperOn) setHelperKey(null);
      }, [helperOn]);

      const pickHelper = (opt) => {
        if (helperKey === opt.key) {
          setHelperKey(null);
          return;
        }
        setHelperKey(opt.key);
        // main으로 가면 시프트 자동 M (현재 시프트가 BASIC인 경우만 변경)
        if (opt.team === "main" && BASIC_SHIFTS.includes(shift)) {
          setShift("M");
        }
      };

      const save = async () => {
        setErr("");
        const monthKey = getMonthKey(year, month);
        const dKey = String(day).padStart(2, "0");
        const path = `duties/${monthKey}/${targetSabun}/${dKey}`;

        let payload;
        if (shift === "O") {
          payload = { shift: "O", team: targetTeam };
        } else {
          payload = { shift, team: targetTeam };

          if (helperOn && helperKey) {
            const opt = HELPER_OPTIONS.find(o => o.key === helperKey);
            if (!opt) { setErr("helper 팀을 선택해 주세요."); return; }
            // helper.team이 target 팀과 같으면 helper 무의미 → role만 남김
            if (opt.team === targetTeam) {
              if (opt.role && isRoleShift) payload.role = opt.role;
            } else {
              payload.helper = { team: opt.team };
              if (opt.role && isRoleShift) payload.helper.role = opt.role;
            }
          } else if (isAteam && isRoleShift && role) {
            // A팀이 helper 안 켜고 role 직접 선택
            payload.role = role;
          }
        }

        setBusy(true);
        try {
          await set(ref(db, path), payload);
          onClose();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      const removeIt = async () => {
        if (!confirm("이 날 듀티를 삭제할까요?")) return;
        setBusy(true);
        try {
          const monthKey = getMonthKey(year, month);
          const dKey = String(day).padStart(2, "0");
          await remove(ref(db, `duties/${monthKey}/${targetSabun}/${dKey}`));
          onClose();
        } catch (e) {
          console.error(e);
          setErr("삭제 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      // helper 토글 가능: D/E/N (O면 어차피 무의미, T/M/V는 main 전용이라 본인이 main이거나 이미 main helper)
      const canHelperToggle = isRoleShift || (isMainContext && (shift === "T" || shift === "M" || shift === "V"));
      // 더 단순: 항상 켤 수 있음. 사용자가 알아서.
      const showHelperToggle = true;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">
                {month}월 {day}일 수정
                {isOtherEdit && targetName && (
                  <span style={{ fontSize: 13, color: "var(--text-mute)", marginLeft: 8 }}>
                    · {targetName}
                  </span>
                )}
              </h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="modal-fields">
              <div className="field">
                <label>근무</label>
                <div className={isMainContext ? "seg seg-7" : "seg seg-4"}>
                  {allowedShifts.map(c => (
                    <button key={c} className={shift === c ? "active" : ""}
                      onClick={() => setShift(c)} type="button">{c}</button>
                  ))}
                </div>
              </div>

              {isRoleShift && isAteam && !helperOn && (
                <div className="field">
                  <div className="field-label-row">
                    <span className="field-label">A팀 역할</span>
                    <span className="field-hint">없음 = 그달 기본 담당 따름</span>
                  </div>
                  <div className="seg seg-5">
                    <button className={!role ? "active" : ""} onClick={() => setRole(null)} type="button">없음</button>
                    <button className={role === "front" ? "active" : ""} onClick={() => setRole("front")} type="button">앞</button>
                    <button className={role === "back" ? "active" : ""} onClick={() => setRole("back")} type="button">뒤</button>
                    <button className={role === "act" ? "active" : ""} onClick={() => setRole("act")} type="button">act</button>
                    <button className={role === "total" ? "active" : ""} onClick={() => setRole("total")} type="button">토탈</button>
                  </div>
                </div>
              )}

              {showHelperToggle && (
                <>
                  <button className={`toggle-row ${helperOn ? "expanded" : ""}`}
                    onClick={() => setHelperOn(!helperOn)} type="button">
                    <div>
                      <div className="toggle-label">
                        다른 팀에서 근무
                        {helperKey && (
                          <span style={{
                            fontSize: 11, fontWeight: 600, color: "var(--accent)",
                            marginLeft: 8, padding: "1px 6px",
                            background: "var(--surface-alt)", borderRadius: 999
                          }}>
                            {HELPER_OPTIONS.find(o => o.key === helperKey)?.label}
                          </span>
                        )}
                      </div>
                    </div>
                    <span className={`chevron ${helperOn ? "up" : ""}`}>⌄</span>
                  </button>

                  {helperOn && (
                    <div className="field">
                      <div className="helper-team-grid">
                        {HELPER_OPTIONS.map(opt => (
                          <button key={opt.key}
                            className={helperKey === opt.key ? "active" : ""}
                            onClick={() => pickHelper(opt)} type="button">
                            {opt.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              )}

              {(shift === "T" || shift === "M") && isMainContext && (
                <div className="duty-help">
                  {shift === "T" ? "T(Top, 호환용)" : "M(Mid, 8am-5pm)"} 근무는 main 팀에 표시돼요.
                </div>
              )}

              {err && <div className="auth-error">{err}</div>}
            </div>

            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy}>
                {busy ? "저장 중…" : "저장"}
              </button>
              {currentDuty && (
                <button className="btn-ghost" onClick={removeIt} disabled={busy}
                  style={{ color: "var(--c-closed)" }}>
                  이 날 듀티 삭제
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <DutyInputModal>
    // ============================================================
    function DutyInputModal({ year, month, sabun, myTeam, myName, currentDuties, allUsers, allDuties, seniority, isAdmin, onClose }) {
      const { daysInMonth } = getMonthInfo(year, month);
      const [mode, setMode] = useState("me"); // "me" | "bulk"

      const initial = useMemo(() => serializeDuties(currentDuties, daysInMonth), []);

      const [text, setText] = useState(initial);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);
      const [extraNote, setExtraNote] = useState(null); // 추가 처리 결과 (조용히 표시)

      // 이름 → 사용자 lookup
      const nameMap = useMemo(() => {
        const m = {};
        Object.entries(allUsers).forEach(([sb, u]) => {
          if (!m[u.name]) m[u.name] = [];
          m[u.name].push({ sabun: sb, ...u });
        });
        return m;
      }, [allUsers]);

      // 본인 첫 줄 미리보기 (validation용)
      const parsed = useMemo(() => {
        const firstLine = text.split("\n").map(l => l.trim()).find(l => l.length > 0) || "";
        // 첫 단어가 이름이면 (본인 이름 또는 nameMap에 있으면) 본인 라인 아님
        const parts = firstLine.split(/\s+/);
        let bodyText = firstLine;
        if (parts.length >= 2 && (parts[0] === myName || nameMap[parts[0]])) {
          // 첫 줄도 타인 라인이면 본인 듀티는 빈 거
          bodyText = "";
        }
        try { return parseDutyStringV3(bodyText, myTeam); } catch { return null; }
      }, [text, myTeam, myName, nameMap]);

      const save = async () => {
        setErr("");
        setExtraNote(null);

        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        const monthKey = getMonthKey(year, month);
        const updates = {};
        const extraOk = [];   // 타인 추가 성공
        const extraSkip = []; // 타인 추가 시도했으나 데이터 있어서 무시

        // 본인 듀티 — 첫 줄
        // 첫 줄이 "이름 듀티" 형식이면 (이름이 nameMap에 있거나 본인 이름이면) 본인 줄로 안 침
        let myCodesText = "";
        let firstLineIsForOther = false;
        if (lines.length > 0) {
          const first = lines[0];
          const parts = first.split(/\s+/);
          if (parts.length >= 2 && nameMap[parts[0]] && parts[0] !== myName) {
            // 타인 줄. 본인 듀티는 빈 것으로 처리
            firstLineIsForOther = true;
          } else if (parts.length >= 2 && parts[0] === myName) {
            // "본인이름 듀티" 형식 — 본인 듀티
            myCodesText = parts.slice(1).join("");
          } else {
            // 그냥 듀티
            myCodesText = first;
          }
        }

        let myCodes;
        try { myCodes = parseDutyStringV3(myCodesText, myTeam); }
        catch (e) { setErr(e.message); return; }
        if (myCodes.length > daysInMonth) {
          setErr(`이 달은 ${daysInMonth}일까지인데 ${myCodes.length}개가 입력됐어요.`);
          return;
        }

        // 본인 듀티 업데이트
        for (let d = 1; d <= daysInMonth; d++) {
          const dKey = String(d).padStart(2, "0");
          const path = `duties/${monthKey}/${sabun}/${dKey}`;
          if (d <= myCodes.length) {
            const code = myCodes[d - 1];
            const payload = { shift: code.shift, team: myTeam };
            if (code.role) payload.role = code.role;
            if (code.helper) payload.helper = code.helper;
            updates[path] = payload;
          } else {
            updates[path] = null;
          }
        }

        // 둘째 줄 이후 (또는 첫 줄이 타인이었으면 첫 줄 포함) — 타인 듀티 처리
        const otherLines = firstLineIsForOther ? lines : lines.slice(1);
        for (const line of otherLines) {
          const parts = line.split(/\s+/);
          let name, dutyText;
          if (parts[0]?.startsWith("[")) {
            name = parts[1];
            dutyText = parts.slice(2).join("");
          } else {
            name = parts[0];
            dutyText = parts.slice(1).join("");
          }
          if (!name) continue;
          const matches = nameMap[name];
          if (!matches || matches.length !== 1) {
            extraSkip.push(name);
            continue;
          }
          const u = matches[0];
          if (u.sabun === sabun) continue;
          // 대상자의 그 달 데이터가 비어있을 때만 추가
          const existing = allDuties[monthKey]?.[u.sabun];
          const hasData = existing && Object.keys(existing).some(k => normalizeDuty(existing[k])?.shift);
          if (hasData) {
            extraSkip.push(u.name);
            continue;
          }
          let codes;
          const uTeamForMonth = teamForMonth(u, monthKey);
          try { codes = parseDutyStringV3(dutyText, uTeamForMonth); }
          catch (e) { extraSkip.push(u.name); continue; }
          if (codes.length === 0 || codes.length > daysInMonth) {
            extraSkip.push(u.name);
            continue;
          }
          for (let d = 1; d <= codes.length; d++) {
            const dKey = String(d).padStart(2, "0");
            const code = codes[d - 1];
            const payload = { shift: code.shift, team: uTeamForMonth };
            if (code.role) payload.role = code.role;
            if (code.helper) payload.helper = code.helper;
            updates[`duties/${monthKey}/${u.sabun}/${dKey}`] = payload;
          }
          extraOk.push(u.name);
        }

        setBusy(true);
        try {
          await update(ref(db), updates);
          if (extraOk.length > 0 || extraSkip.length > 0) {
            // 결과만 조용히 잠깐 표시 후 닫음
            setExtraNote({ ok: extraOk, skip: extraSkip });
            setBusy(false);
          } else {
            onClose();
          }
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      // 도움말 분기
      const teamHelp = myTeam === "main" ? (
        <>
          <strong>main 팀 시프트</strong>: <code>M</code> Mid · <code>V</code> 반차
        </>
      ) : myTeam === "A" ? (
        <>
          <strong>A팀 역할</strong>: D/E/N 뒤에 <code>1</code>/<code>앞</code>=앞, <code>2</code>/<code>뒤</code>=뒤, <code>a</code>=act<br />
          예: <code>D1E뒤Na</code> = D(앞), E(뒤), N(act)
        </>
      ) : null;

      if (mode === "bulk") {
        if (!isAdmin) {
          // 비관리자 보호 — bulk 모드 진입 차단
          setMode("me");
          return null;
        }
        return (
          <BulkDutyInput
            year={year} month={month}
            allUsers={allUsers} allDuties={allDuties} seniority={seniority}
            onBack={() => setMode("me")}
            onClose={onClose} />
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 듀티 입력</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            {isAdmin && (
              <div className="mode-switch">
                <span className="mode-label">본인 듀티 입력 중</span>
                <button onClick={() => setMode("bulk")}>전체 일괄 입력 →</button>
              </div>
            )}

            <div className="modal-fields">
              <div className="duty-help">
                1일부터 순서대로 한 글자씩 입력. 공백/줄바꿈 무시.<br />
                <code>D</code> Day · <code>E</code> Evening · <code>N</code> Night · <code>O</code> Off
                {teamHelp && <><br /><br />{teamHelp}</>}
                <br /><br />
                helper 근무: 시프트 뒤 괄호로 팀 표기. 예: <code>DD(c)O</code> = 2일차 D가 C팀 helper.
              </div>
              <textarea className="duty-textarea" value={text}
                onChange={e => setText(e.target.value)}
                placeholder={
                  myTeam === "main" ? "예: MMOOMMOM..." :
                  myTeam === "A" ? "예: D1E뒤NaOOD..." : "예: DENNOOD..."}
                autoFocus />
              <div className="day-counter">
                {parsed ? `${parsed.length}일` : "—"} / {daysInMonth}일
              </div>
              {err && <div className="auth-error">{err}</div>}
              {extraNote && (
                <div className="bulk-result" style={{ marginTop: 8 }}>
                  {extraNote.ok.length > 0 && (
                    <div className="row ok">
                      ✓ {extraNote.ok.length}명 추가 입력됨: {extraNote.ok.join(", ")}
                    </div>
                  )}
                  {extraNote.skip.length > 0 && (
                    <div className="row" style={{ color: "var(--text-soft)" }}>
                      · {extraNote.skip.length}명 건너뜀
                    </div>
                  )}
                  <button className="btn-ghost" onClick={onClose} style={{ marginTop: 8 }}>
                    닫기
                  </button>
                </div>
              )}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy || !text.trim() || !!extraNote}>
                {busy ? "저장 중…" : "저장"}
              </button>
              <p style={{ fontSize: 11, color: "var(--text-soft)", textAlign: "center", margin: 0 }}>
                ※ 이 입력은 월 전체를 덮어써요. helper 설정은 일별 수정에서.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <BulkDutyInput> — 전체 사용자 듀티 일괄 입력
    // 형식: 한 줄 = 한 사람. "[팀] 이름 듀티텍스트" 또는 "이름 듀티텍스트"
    // 정책 B: 성공한 줄만 저장, 실패한 줄 보고
    // ============================================================
    function BulkDutyInput({ year, month, allUsers, allDuties, seniority, onBack, onClose }) {
      const { daysInMonth } = getMonthInfo(year, month);
      const monthKey = getMonthKey(year, month);

      // prefill 텍스트 생성
      const initialText = useMemo(() => {
        const groups = groupUsersByTeam(allUsers, seniority);
        const lines = [];
        for (const team of TEAMS) {
          for (const u of groups[team]) {
            const monthData = allDuties[monthKey]?.[u.sabun] || {};
            const dutyMap = {};
            Object.keys(monthData).forEach(k => {
              const v = normalizeDuty(monthData[k]);
              if (v) dutyMap[parseInt(k, 10)] = v;
            });
            const dutyText = serializeDuties(dutyMap, daysInMonth).replace(/ /g, "");
            lines.push(`[${team}] ${u.name} ${dutyText}`);
          }
        }
        return lines.join("\n");
      }, [allUsers, allDuties, seniority, monthKey, daysInMonth]);

      const [text, setText] = useState(initialText);
      const [busy, setBusy] = useState(false);
      const [results, setResults] = useState(null); // {ok: [], fail: [{line, name, reason}]}

      // 이름 → 사용자 lookup (allUsers 안에서 동명이인 검사)
      const nameMap = useMemo(() => {
        const m = {};
        Object.entries(allUsers).forEach(([sabun, u]) => {
          if (!m[u.name]) m[u.name] = [];
          m[u.name].push({ sabun, ...u });
        });
        return m;
      }, [allUsers]);

      const submit = async () => {
        setBusy(true);
        setResults(null);

        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        const ok = [];
        const fail = [];
        const updates = {};
        const removed = [];   // 텍스트에서 줄이 통째로 사라진 사용자
        const processedSabuns = new Set();

        for (const line of lines) {
          const parts = line.split(/\s+/);
          let name, dutyText;
          if (parts[0]?.startsWith("[")) {
            name = parts[1];
            dutyText = parts.slice(2).join("");
          } else {
            name = parts[0];
            dutyText = parts.slice(1).join("");
          }
          if (!name) {
            fail.push({ line, name: "(이름 없음)", reason: "이름이 비어있어요" });
            continue;
          }
          const matches = nameMap[name];
          if (!matches || matches.length === 0) {
            fail.push({ line, name, reason: "등록된 사용자가 아니에요" });
            continue;
          }
          if (matches.length > 1) {
            fail.push({ line, name, reason: `동명이인 ${matches.length}명 존재 — 사번으로 구분 필요` });
            continue;
          }
          const user = matches[0];
          const userTeamForMonth = teamForMonth(user, monthKey);
          let codes;
          try {
            codes = parseDutyStringV3(dutyText, userTeamForMonth);
          } catch (e) {
            fail.push({ line, name, reason: e.message });
            continue;
          }
          if (codes.length > daysInMonth) {
            fail.push({ line, name, reason: `${daysInMonth}일을 초과 (${codes.length}일)` });
            continue;
          }
          processedSabuns.add(user.sabun);
          // updates에 적용 — codes.length가 0이면 전부 null로 (해당 사용자 그 달 비움)
          for (let d = 1; d <= daysInMonth; d++) {
            const dKey = String(d).padStart(2, "0");
            const path = `duties/${monthKey}/${user.sabun}/${dKey}`;
            if (d <= codes.length) {
              const code = codes[d - 1];
              const payload = { shift: code.shift, team: userTeamForMonth };
              if (code.role) payload.role = code.role;
              if (code.helper) payload.helper = code.helper;
              updates[path] = payload;
            } else {
              updates[path] = null;
            }
          }
          ok.push({ name, count: codes.length });
        }

        // prefill에 있었지만 텍스트에서 사라진 사용자 = 그 달 듀티 전체 제거
        // (단, helper 데이터는 prefill에 안 들어가서 일괄 입력 범위 밖이니 그대로 두려면 path 분리 필요.
        //  하지만 사용자가 "수정 그대로 적용"을 원하므로 helper도 함께 제거하는 게 일관적.
        //  안전하게 모든 셀을 helper 포함 통째로 비우려면 사용자의 monthKey 전체를 null로 set)
        Object.entries(allUsers).forEach(([sabun, u]) => {
          if (processedSabuns.has(sabun)) return;
          const had = allDuties[monthKey]?.[sabun];
          if (!had || Object.keys(had).length === 0) return;
          // 이 사용자는 데이터가 있었는데 텍스트에서 사라짐 → 그 달 통째로 제거
          updates[`duties/${monthKey}/${sabun}`] = null;
          removed.push(u.name);
        });

        try {
          if (Object.keys(updates).length > 0) {
            await update(ref(db), updates);
          }
          setResults({ ok, fail, removed });
        } catch (e) {
          console.error(e);
          alert("저장 중 오류 — 다시 시도해 주세요.");
        }
        setBusy(false);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 전체 일괄 입력</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="mode-switch">
              <span className="mode-label">전체 일괄 입력 중</span>
              <button onClick={onBack}>← 본인 입력으로</button>
            </div>

            <div className="modal-fields">
              <div className="duty-help">
                한 줄 = 한 사람. 형식: <code>[팀] 이름 듀티</code> 또는 <code>이름 듀티</code><br />
                대괄호 [팀]은 시각적 구분용 — 저장 시 무시. 첫 단어가 이름.<br />
                각 사람의 팀에 맞는 입력 규칙 적용 (A팀 1/2/a, main M/V).<br />
                <strong>helper 근무</strong>: 시프트 뒤 괄호로 팀 표기. 예: <code>DDD(c)ON</code> = 3일차 D는 C팀 helper. A팀 helper면 역할 가능: <code>D(a앞)</code>.
              </div>
              <textarea className="bulk-textarea" value={text}
                onChange={e => setText(e.target.value)} spellCheck={false} />

              {results && (
                <div className="bulk-result">
                  {results.ok.length > 0 && (
                    <div className="row ok">
                      ✓ <strong>{results.ok.length}명 저장됨</strong>: {results.ok.map(r => `${r.name}(${r.count}일)`).join(", ")}
                    </div>
                  )}
                  {results.removed && results.removed.length > 0 && (
                    <div className="row" style={{ color: "var(--c-closed)" }}>
                      🗑 <strong>{results.removed.length}명 삭제됨</strong>: {results.removed.join(", ")}
                    </div>
                  )}
                  {results.fail.length > 0 && (
                    <>
                      <div className="row fail">
                        ✗ <strong>{results.fail.length}건 실패</strong>:
                      </div>
                      {results.fail.map((f, i) => (
                        <div key={i} className="row fail" style={{ paddingLeft: 14 }}>
                          {f.name} — {f.reason}
                        </div>
                      ))}
                    </>
                  )}
                  {results.fail.length === 0 && results.ok.length > 0 && (
                    <div style={{ color: "var(--text-soft)", marginTop: 6, fontSize: 11 }}>
                      모든 줄 저장 완료
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={submit} disabled={busy}>
                {busy ? "저장 중…" : "성공한 줄만 저장"}
              </button>
              <p style={{ fontSize: 11, color: "var(--text-soft)", textAlign: "center", margin: 0 }}>
                ※ 실패한 줄은 저장 안 됨. 결과 확인 후 고쳐서 다시 시도.
              </p>
            </div>
          </div>
        </div>
      );
    }
