<html lang="ko">
<head>

  <title>61w 듀티</title>

  <meta name="theme-color" content="#FAF7F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="61w">

  <link rel="stylesheet" type="text/css"

  <style>
    :root {
      --bg: #FAF7F0;
      --surface: #FFFFFF;
      --surface-alt: #F4F0E5;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.18);
      --text: #2A2826;
      --text-mute: #7A766F;
      --text-soft: #A8A39A;
      --accent: #5F5BAA;

      --c-full: #1F1B17;
      --c-morning: #2C5BB0;
      --c-closed: #C73E3E;

      --t-main-bg: #EEEDFE;  --t-main-text: #26215C;  --t-main-edge: #7F77DD;
      --t-A-bg:    #FAECE7;  --t-A-text:    #4A1B0C;  --t-A-edge:    #D85A30;
      --t-B-bg:    #EAF3DE;  --t-B-text:    #173404;  --t-B-edge:    #639922;
      --t-C-bg:    #FAEEDA;  --t-C-text:    #412402;  --t-C-edge:    #BA7517;
      --t-D-bg:    #FBEAF0;  --t-D-text:    #4B1528;  --t-D-edge:    #D4537E;
      --t-S-bg:    #E1F5EE;  --t-S-text:    #04342C;  --t-S-edge:    #1D9E75;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 15px; }

    #root {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ====== auth ====== */
    .auth-wrap {
      padding: 64px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .auth-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin: 0 0 4px;
    }
    .auth-sub {
      color: var(--text-mute);
      font-size: 14px;
      margin: 0 0 20px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 13px;
      color: var(--text-mute);
      font-weight: 500;
    }
    .field input, .field select {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent);
    }
    .btn-primary {
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-ghost {
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-mute);
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .auth-error {
      padding: 10px 14px;
      background: #FCEBEB;
      color: #791F1F;
      border-radius: 8px;
      font-size: 13px;
    }

    /* ====== top bar ====== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-bar-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text);
    }
    .icon-btn:active { background: var(--surface-alt); }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .month-nav button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-mute);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .month-nav button:active { background: var(--surface-alt); }

    /* ====== calendar ====== */
    .cal-wrap {
      padding: 6px 8px 24px;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 8px 4px 4px;
    }
    .cal-weekdays div {
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-soft);
      letter-spacing: 0.4px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-cell {
      aspect-ratio: 1 / 1.15;
      border-radius: 8px;
      padding: 4px 4px 3px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: transparent;
      transition: background 0.1s;
      position: relative;
    }
    .cal-cell.today {
      background: var(--surface);
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }
    .cal-cell:active {
      background: var(--surface-alt);
    }
    .cal-cell.empty {
      visibility: hidden;
    }
    .cal-date {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      letter-spacing: -0.2px;
    }
    .cal-date.full    { color: var(--c-full); }
    .cal-date.morning { color: var(--c-morning); }
    .cal-date.closed  { color: var(--c-closed); }
    .holiday-dot {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--c-closed);
      opacity: 0.7;
    }
    .duty-stack {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 2px;
    }
    .duty-pill {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 0;
      width: 100%;
      text-align: center;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* ====== modal ====== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px 22px 32px;
      animation: slideUp 0.2s ease;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      font-size: 20px;
      color: var(--text-mute);
    }
    .modal-fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ====== duty input modal ====== */
    .duty-help {
      background: var(--surface-alt);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-mute);
      line-height: 1.6;
    }
    .duty-help code {
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      color: var(--text);
    }
    .duty-textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 16px;
      letter-spacing: 2px;
      line-height: 1.6;
      outline: none;
      resize: vertical;
      text-transform: uppercase;
    }
    .duty-textarea:focus { border-color: var(--accent); }
    .day-counter {
      font-size: 12px;
      color: var(--text-mute);
      text-align: right;
    }

    /* ====== profile ====== */
    .profile-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-label {
      color: var(--text-mute);
      font-size: 14px;
    }
    .profile-value {
      font-weight: 500;
    }
    .team-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px;
      background: var(--surface-alt);
      border-radius: 10px;
    }
    .seg button {
      padding: 10px 6px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-mute);
      transition: all 0.1s;
    }
    .seg button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .seg.team-seg {
      grid-template-columns: repeat(4, 1fr);
    }

    /* ====== loading & empty ====== */
    .center-msg {
      padding: 80px 24px;
      text-align: center;
      color: var(--text-mute);
      font-size: 14px;
    }

    /* ====== fab ====== */
    .fab {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: 13px 22px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      z-index: 50;
    }
    .fab:active { transform: translateX(-50%) scale(0.96); }

    /* ====== profile menu ====== */
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      text-align: left;
      font-size: 15px;
      color: var(--text);
    }
    .menu-item:active { color: var(--text-mute); }
    .menu-item.danger { color: var(--c-closed); }
    .menu-section-title {
      font-size: 12px;
      color: var(--text-soft);
      letter-spacing: 0.4px;
      margin: 18px 0 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script type="text/babel" data-type="module" data-presets="react">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getDatabase, ref, set, get, onValue, update, remove, child
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // ============================================================
    // Firebase 설정
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDPdMQPm3CRpEWaRpg45FD5KYThZTkH9_E",
      authDomain: "duty-db3c7.firebaseapp.com",
      databaseURL: "https://duty-db3c7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "duty-db3c7",
      storageBucket: "duty-db3c7.firebasestorage.app",
      messagingSenderId: "464184579710",
      appId: "1:464184579710:web:2290c68519753dc3a16a2f"
    };
    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    // ============================================================
    // 상수
    // ============================================================
    const ADMIN_SABUN = "224051";
    const TEAMS = ["main", "A", "B", "C", "D", "S-616", "S-617", "S-act"];
    const SHIFT_CODES = ["D", "E", "N", "O", "T", "M", "V"];
    const SHIFT_LABELS = {
      D: "Day", E: "Evening", N: "Night", O: "Off",
      T: "Top", M: "Mid", V: "반차"
    };

    function teamColor(team) {
      if (team === "main") return { bg: "var(--t-main-bg)", text: "var(--t-main-text)", edge: "var(--t-main-edge)" };
      if (team === "A")    return { bg: "var(--t-A-bg)",    text: "var(--t-A-text)",    edge: "var(--t-A-edge)" };
      if (team === "B")    return { bg: "var(--t-B-bg)",    text: "var(--t-B-text)",    edge: "var(--t-B-edge)" };
      if (team === "C")    return { bg: "var(--t-C-bg)",    text: "var(--t-C-text)",    edge: "var(--t-C-edge)" };
      if (team === "D")    return { bg: "var(--t-D-bg)",    text: "var(--t-D-text)",    edge: "var(--t-D-edge)" };
      return { bg: "var(--t-S-bg)", text: "var(--t-S-text)", edge: "var(--t-S-edge)" };
    }

    // ============================================================
    // 공휴일 (2026-2030 한국 공휴일, 음력 환산 포함)
    // ※ 임시공휴일/대체공휴일 일부는 누락 가능. 설정에서 수동 추가/수정 가능.
    // ============================================================
    const HOLIDAYS = {
      // 2026
      "2026-01-01": "신정",
      "2026-02-16": "설날",
      "2026-02-17": "설날",
      "2026-02-18": "설날",
      "2026-03-01": "삼일절",
      "2026-03-02": "삼일절 대체",
      "2026-05-05": "어린이날",
      "2026-05-24": "부처님오신날",
      "2026-05-25": "부처님오신날 대체",
      "2026-06-06": "현충일",
      "2026-08-15": "광복절",
      "2026-08-17": "광복절 대체",
      "2026-09-24": "추석",
      "2026-09-25": "추석",
      "2026-09-26": "추석",
      "2026-09-28": "추석 대체",
      "2026-10-03": "개천절",
      "2026-10-05": "개천절 대체",
      "2026-10-09": "한글날",
      "2026-12-25": "성탄절",
      // 2027
      "2027-01-01": "신정",
      "2027-02-06": "설날",
      "2027-02-07": "설날",
      "2027-02-08": "설날",
      "2027-02-09": "설날 대체",
      "2027-03-01": "삼일절",
      "2027-05-05": "어린이날",
      "2027-05-13": "부처님오신날",
      "2027-06-07": "현충일 대체",
      "2027-06-06": "현충일",
      "2027-08-15": "광복절",
      "2027-08-16": "광복절 대체",
      "2027-09-14": "추석",
      "2027-09-15": "추석",
      "2027-09-16": "추석",
      "2027-10-03": "개천절",
      "2027-10-04": "개천절 대체",
      "2027-10-09": "한글날",
      "2027-10-11": "한글날 대체",
      "2027-12-25": "성탄절",
    };

    // ============================================================
    // 진료시간 추론
    // 우선순위: clinicHours override > holiday(closed) > 요일 기본값
    // 결과: "full" | "morning" | "closed"
    // ============================================================
    function getClinicStatus(dateISO, dayOfWeek, overrides) {
      if (overrides && overrides[dateISO]) return overrides[dateISO];
      if (HOLIDAYS[dateISO]) return "closed";
      if (dayOfWeek === 0) return "closed";   // 일
      if (dayOfWeek === 6) return "morning";  // 토
      return "full";                            // 월~금
    }

    // ============================================================
    // 해시 (SHA-256, salt = 사번)
    // ============================================================
    async function hashPassword(sabun, password) {
      const data = new TextEncoder().encode(sabun + ":" + password);
      const buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    // ============================================================
    // 듀티 입력 파서
    // 입력: "DENNOOD T M V O" (공백/줄바꿈 무시, 대소문자 무시)
    // 출력: ["D","E","N","N","O","O","D","T","M","V","O"]
    // 잘못된 문자가 있으면 throw
    // ============================================================
    function parseDutyString(raw) {
      const cleaned = raw.toUpperCase().replace(/\s+/g, "");
      const valid = new Set(SHIFT_CODES);
      const result = [];
      for (let i = 0; i < cleaned.length; i++) {
        const ch = cleaned[i];
        if (!valid.has(ch)) {
          throw new Error(`'${ch}' (${i + 1}번째 글자)는 사용할 수 없는 코드. 가능: ${SHIFT_CODES.join(", ")}`);
        }
        result.push(ch);
      }
      return result;
    }

    // ============================================================
    // 입사일 자동 포맷팅 (입력 중 호출)
    // "20230515" → "2023.05.15."
    // ============================================================
    function formatHireDateInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 8);
      let out = digits;
      if (digits.length > 4) out = digits.slice(0, 4) + "." + digits.slice(4);
      if (digits.length > 6) out = digits.slice(0, 4) + "." + digits.slice(4, 6) + "." + digits.slice(6);
      if (digits.length === 8) out += ".";
      return out;
    }
    function hireDateToISO(formatted) {
      const digits = formatted.replace(/\D/g, "");
      if (digits.length !== 8) return null;
      return `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
    }
    function isoToHireDate(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${y}.${m}.${d}.`;
    }
    function formatPhone(value) {
      const d = value.replace(/\D/g, "").slice(0, 11);
      if (d.length < 4) return d;
      if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
      return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    }

    // ============================================================
    // 날짜 유틸
    // ============================================================
    const WEEKDAYS_KR = ["일", "월", "화", "수", "목", "금", "토"];
    function getMonthInfo(year, month) {
      // month: 1-12
      const first = new Date(year, month - 1, 1);
      const last = new Date(year, month, 0);
      const daysInMonth = last.getDate();
      const startWeekday = first.getDay(); // 0=Sun
      return { first, last, daysInMonth, startWeekday };
    }
    function isoDate(year, month, day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function todayInfo() {
      const now = new Date();
      return {
        year: now.getFullYear(),
        month: now.getMonth() + 1,
        day: now.getDate(),
      };
    }

    const { useState, useEffect, useMemo, useRef } = React;
    const { createRoot } = ReactDOM;

    // ============================================================
    // <App> 루트
    // ============================================================
    function App() {
      const [me, setMe] = useState(null); // { sabun, ... }
      const [bootDone, setBootDone] = useState(false);

      // 자동 로그인: localStorage 세션
      useEffect(() => {
        (async () => {
          const saved = localStorage.getItem("61w-session");
          if (!saved) { setBootDone(true); return; }
          try {
            const { sabun } = JSON.parse(saved);
            const snap = await get(ref(db, `users/${sabun}`));
            if (snap.exists()) {
              setMe({ sabun, ...snap.val() });
            } else {
              localStorage.removeItem("61w-session");
            }
          } catch (e) {
            console.error(e);
            localStorage.removeItem("61w-session");
          }
          setBootDone(true);
        })();
      }, []);

      const handleLogin = (sabun, userData) => {
        localStorage.setItem("61w-session", JSON.stringify({ sabun }));
        setMe({ sabun, ...userData });
      };

      const handleLogout = () => {
        localStorage.removeItem("61w-session");
        setMe(null);
      };

      const handleProfileUpdate = (newData) => {
        setMe(prev => ({ ...prev, ...newData }));
      };

      if (!bootDone) {
        return <div className="center-msg">불러오는 중…</div>;
      }
      if (!me) {
        return <AuthScreen onLogin={handleLogin} />;
      }
      return <CalendarScreen me={me} onLogout={handleLogout} onProfileUpdate={handleProfileUpdate} />;
    }

    // ============================================================
    // <AuthScreen>
    // ============================================================
    function AuthScreen({ onLogin }) {
      const [mode, setMode] = useState("login"); // "login" | "signup"
      return mode === "login"
        ? <LoginForm onLogin={onLogin} switchToSignup={() => setMode("signup")} />
        : <SignupForm onLogin={onLogin} switchToLogin={() => setMode("login")} />;
    }

    function LoginForm({ onLogin, switchToSignup }) {
      const [sabun, setSabun] = useState("");
      const [password, setPassword] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setErr("");
        if (!/^\d{5,6}$/.test(sabun)) {
          setErr("사번은 5~6자리 숫자여야 해요.");
          return;
        }
        if (!password) {
          setErr("비밀번호를 입력해 주세요.");
          return;
        }
        setBusy(true);
        try {
          const snap = await get(ref(db, `users/${sabun}`));
          if (!snap.exists()) {
            setErr("등록되지 않은 사번이에요. 회원가입을 먼저 해주세요.");
            setBusy(false);
            return;
          }
          const user = snap.val();
          const inputHash = await hashPassword(sabun, password);
          if (inputHash !== user.loginHash) {
            setErr("비밀번호가 일치하지 않아요.");
            setBusy(false);
            return;
          }
          onLogin(sabun, user);
        } catch (e) {
          console.error(e);
          setErr("로그인 중 오류가 발생했어요. 잠시 후 다시 시도해 주세요.");
          setBusy(false);
        }
      };

      return (
        <div className="auth-wrap">
          <div>
            <h1 className="auth-title">61w 듀티</h1>
            <p className="auth-sub">사번으로 로그인</p>
          </div>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div className="field">
              <label>사번</label>
              <input
                type="tel"
                inputMode="numeric"
                value={sabun}
                onChange={e => setSabun(e.target.value.replace(/\D/g, "").slice(0, 6))}
                placeholder="224051"
                autoComplete="username"
              />
            </div>
            <div className="field">
              <label>비밀번호</label>
              <input
                type="password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                autoComplete="current-password"
              />
            </div>
            {err && <div className="auth-error">{err}</div>}
            <button type="submit" className="btn-primary" disabled={busy}>
              {busy ? "로그인 중…" : "로그인"}
            </button>
            <button type="button" className="btn-ghost" onClick={switchToSignup}>
              아직 계정이 없어요 · 회원가입
            </button>
          </form>
        </div>
      );
    }

    function SignupForm({ onLogin, switchToLogin }) {
      const [sabun, setSabun] = useState("");
      const [name, setName] = useState("");
      const [team, setTeam] = useState("A");
      const [hireDate, setHireDate] = useState("");
      const [phone, setPhone] = useState("");
      const [password, setPassword] = useState("");
      const [password2, setPassword2] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setErr("");
        if (!/^\d{5,6}$/.test(sabun)) return setErr("사번은 5~6자리 숫자여야 해요.");
        if (!name.trim()) return setErr("이름을 입력해 주세요.");
        if (!TEAMS.includes(team)) return setErr("팀을 선택해 주세요.");
        const hireISO = hireDateToISO(hireDate);
        if (!hireISO) return setErr("입사일은 8자리 숫자(YYYYMMDD)로 입력해 주세요.");
        if (password.length < 4) return setErr("비밀번호는 4자 이상이어야 해요.");
        if (password !== password2) return setErr("비밀번호가 서로 일치하지 않아요.");

        setBusy(true);
        try {
          // 1) 이미 존재하는지 확인
          const existSnap = await get(ref(db, `users/${sabun}`));
          if (existSnap.exists()) {
            setErr("이미 등록된 사번이에요. 로그인 화면으로 가주세요.");
            setBusy(false);
            return;
          }
          // 2) 화이트리스트 확인 (admin 사번은 패스)
          if (sabun !== ADMIN_SABUN) {
            const wlSnap = await get(ref(db, `whitelist/${sabun}`));
            if (!wlSnap.exists()) {
              setErr("등록 권한이 없는 사번이에요. 관리자에게 문의해 주세요.");
              setBusy(false);
              return;
            }
          }
          // 3) 저장
          const loginHash = await hashPassword(sabun, password);
          const userData = {
            name: name.trim(),
            team,
            hireDate: hireISO,
            phone: phone.replace(/\D/g, ""),
            loginHash,
            createdAt: Date.now(),
          };
          await set(ref(db, `users/${sabun}`), userData);
          onLogin(sabun, userData);
        } catch (e) {
          console.error(e);
          setErr("회원가입 중 오류가 발생했어요. 잠시 후 다시 시도해 주세요.");
          setBusy(false);
        }
      };

      return (
        <div className="auth-wrap">
          <div>
            <h1 className="auth-title">회원가입</h1>
            <p className="auth-sub">필수 정보를 입력해 주세요</p>
          </div>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div className="field">
              <label>사번</label>
              <input
                type="tel"
                inputMode="numeric"
                value={sabun}
                onChange={e => setSabun(e.target.value.replace(/\D/g, "").slice(0, 6))}
                placeholder="5~6자리 숫자"
              />
            </div>
            <div className="field">
              <label>이름</label>
              <input value={name} onChange={e => setName(e.target.value)} />
            </div>
            <div className="field">
              <label>팀</label>
              <select value={team} onChange={e => setTeam(e.target.value)}>
                {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div className="field">
              <label>입사일 (YYYYMMDD)</label>
              <input
                type="tel"
                inputMode="numeric"
                value={hireDate}
                onChange={e => setHireDate(formatHireDateInput(e.target.value))}
                placeholder="20230515"
              />
            </div>
            <div className="field">
              <label>전화번호</label>
              <input
                type="tel"
                inputMode="numeric"
                value={phone}
                onChange={e => setPhone(formatPhone(e.target.value))}
                placeholder="01012345678"
              />
            </div>
            <div className="field">
              <label>비밀번호</label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} />
            </div>
            <div className="field">
              <label>비밀번호 확인</label>
              <input type="password" value={password2} onChange={e => setPassword2(e.target.value)} />
            </div>
            {err && <div className="auth-error">{err}</div>}
            <button type="submit" className="btn-primary" disabled={busy}>
              {busy ? "등록 중…" : "가입하기"}
            </button>
            <button type="button" className="btn-ghost" onClick={switchToLogin}>
              이미 계정이 있어요 · 로그인
            </button>
          </form>
        </div>
      );
    }

    // ============================================================
    // <CalendarScreen>
    // ============================================================
    function CalendarScreen({ me, onLogout, onProfileUpdate }) {
      const today = todayInfo();
      const [year, setYear] = useState(today.year);
      const [month, setMonth] = useState(today.month);

      const [duties, setDuties] = useState({});         // { day(int): "D"/"E"/... }
      const [clinicOverrides, setClinicOverrides] = useState({}); // { "YYYY-MM-DD": status }

      const [showProfile, setShowProfile] = useState(false);
      const [showDutyInput, setShowDutyInput] = useState(false);

      const monthKey = `${year}-${String(month).padStart(2, "0")}`;

      // duties 구독
      useEffect(() => {
        const r = ref(db, `duties/${monthKey}/${me.sabun}`);
        const unsub = onValue(r, snap => {
          const val = snap.val() || {};
          const map = {};
          Object.keys(val).forEach(k => {
            const dayInt = parseInt(k, 10);
            const v = val[k];
            map[dayInt] = typeof v === "string" ? v : v.shift;
          });
          setDuties(map);
        });
        return () => unsub();
      }, [monthKey, me.sabun]);

      // 진료시간 override 구독 (월별)
      useEffect(() => {
        const r = ref(db, `clinicHours`);
        const unsub = onValue(r, snap => {
          setClinicOverrides(snap.val() || {});
        });
        return () => unsub();
      }, []);

      const goPrevMonth = () => {
        if (month === 1) { setYear(year - 1); setMonth(12); }
        else setMonth(month - 1);
      };
      const goNextMonth = () => {
        if (month === 12) { setYear(year + 1); setMonth(1); }
        else setMonth(month + 1);
      };
      const goToday = () => {
        setYear(today.year);
        setMonth(today.month);
      };

      const isCurrentMonth = (year === today.year && month === today.month);

      const tColor = teamColor(me.team);

      return (
        <>
          <div className="top-bar">
            <div className="top-bar-title">
              <span>{me.name}</span>
              <span className="team-badge" style={{ background: tColor.bg, color: tColor.text }}>{me.team}</span>
            </div>
            <div className="top-bar-actions">
              <button className="icon-btn" onClick={() => setShowProfile(true)} aria-label="프로필">⚙︎</button>
            </div>
          </div>

          <div className="month-nav" style={{ padding: "10px 18px 4px", justifyContent: "center" }}>
            <button onClick={goPrevMonth} aria-label="이전 달">‹</button>
            <button
              onClick={goToday}
              style={{ width: "auto", padding: "0 14px", fontSize: 16, fontWeight: 600, color: "var(--text)" }}
            >
              {year}년 {month}월
            </button>
            <button onClick={goNextMonth} aria-label="다음 달">›</button>
          </div>

          <CalendarGrid
            year={year}
            month={month}
            duties={duties}
            clinicOverrides={clinicOverrides}
            today={today}
            myTeam={me.team}
          />

          <button className="fab" onClick={() => setShowDutyInput(true)}>
            ✎ {month}월 듀티 입력
          </button>

          {showProfile && (
            <ProfileModal
              me={me}
              onClose={() => setShowProfile(false)}
              onLogout={onLogout}
              onProfileUpdate={onProfileUpdate}
            />
          )}
          {showDutyInput && (
            <DutyInputModal
              year={year}
              month={month}
              sabun={me.sabun}
              myTeam={me.team}
              currentDuties={duties}
              onClose={() => setShowDutyInput(false)}
            />
          )}
        </>
      );
    }

    // ============================================================
    // <CalendarGrid>
    // ============================================================
    function CalendarGrid({ year, month, duties, clinicOverrides, today, myTeam }) {
      const { daysInMonth, startWeekday } = getMonthInfo(year, month);
      const tColor = teamColor(myTeam);

      const cells = [];
      // 앞쪽 빈 셀
      for (let i = 0; i < startWeekday; i++) {
        cells.push(<div key={`e-${i}`} className="cal-cell empty" />);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(year, month, day);
        const dow = (startWeekday + day - 1) % 7;
        const status = getClinicStatus(iso, dow, clinicOverrides);
        const isToday = (year === today.year && month === today.month && day === today.day);
        const shift = duties[day];
        const isHoliday = !!HOLIDAYS[iso];

        cells.push(
          <div key={day} className={`cal-cell ${isToday ? "today" : ""}`}>
            {isHoliday && <div className="holiday-dot" title={HOLIDAYS[iso]} />}
            <div className={`cal-date ${status}`}>{day}</div>
            <div className="duty-stack">
              {shift && (
                <div
                  className="duty-pill"
                  style={
                    shift === "O"
                      ? { background: "transparent", color: "var(--text-soft)", fontWeight: 500 }
                      : { background: tColor.bg, color: tColor.text }
                  }
                >
                  {shift}
                </div>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="cal-wrap">
          <div className="cal-weekdays">
            {WEEKDAYS_KR.map((w, i) => (
              <div key={w} style={{
                color: i === 0 ? "var(--c-closed)" : i === 6 ? "var(--c-morning)" : "var(--text-soft)"
              }}>{w}</div>
            ))}
          </div>
          <div className="cal-grid">{cells}</div>
        </div>
      );
    }

    // ============================================================
    // <DutyInputModal>
    // ============================================================
    function DutyInputModal({ year, month, sabun, myTeam, currentDuties, onClose }) {
      const { daysInMonth } = getMonthInfo(year, month);

      // 기존 듀티를 문자열로 직렬화 (있는 만큼만)
      const initial = useMemo(() => {
        let maxDay = 0;
        for (const k of Object.keys(currentDuties)) {
          const d = parseInt(k, 10);
          if (d > maxDay) maxDay = d;
        }
        let out = "";
        for (let d = 1; d <= maxDay; d++) {
          out += currentDuties[d] || "";
        }
        return out;
      }, []); // 모달 열 때만

      const [text, setText] = useState(initial);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      const parsed = useMemo(() => {
        try { return parseDutyString(text); }
        catch { return null; }
      }, [text]);

      const save = async () => {
        setErr("");
        let codes;
        try {
          codes = parseDutyString(text);
        } catch (e) {
          setErr(e.message);
          return;
        }
        if (codes.length > daysInMonth) {
          setErr(`이 달은 ${daysInMonth}일까지인데 ${codes.length}개가 입력됐어요.`);
          return;
        }
        setBusy(true);
        try {
          const monthKey = `${year}-${String(month).padStart(2, "0")}`;
          // 모든 날 한 번에 덮어쓰기 (입력 안 된 날은 null로 삭제)
          const updates = {};
          for (let d = 1; d <= daysInMonth; d++) {
            const dKey = String(d).padStart(2, "0");
            if (d <= codes.length) {
              updates[`duties/${monthKey}/${sabun}/${dKey}`] = {
                shift: codes[d - 1],
                team: myTeam,
              };
            } else {
              updates[`duties/${monthKey}/${sabun}/${dKey}`] = null;
            }
          }
          await update(ref(db), updates);
          onClose();
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">{month}월 듀티 입력</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>
            <div className="modal-fields">
              <div className="duty-help">
                1일부터 순서대로 한 글자씩 입력. 공백/줄바꿈 무시.<br />
                <code>D</code> Day · <code>E</code> Evening · <code>N</code> Night · <code>O</code> Off · <code>T</code> Top · <code>M</code> Mid · <code>V</code> 반차
              </div>
              <textarea
                className="duty-textarea"
                value={text}
                onChange={e => setText(e.target.value)}
                placeholder="예: DENNOOD ENN OOD..."
                autoFocus
              />
              <div className="day-counter">
                {parsed ? `${parsed.length}일` : "—"} / {daysInMonth}일
              </div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy || !text.trim()}>
                {busy ? "저장 중…" : "저장"}
              </button>
            </div>
          </div>
        </div>
      );
    }

        setErr("");
        if (!name.trim()) return setErr("이름을 입력해 주세요.");

        if (!hireISO) return setErr("입사일은 8자리 숫자(YYYYMMDD)로 입력해 주세요.");

        try {
          const newData = {
            name: name.trim(),
            team,
            hireDate: hireISO,
            phone: phone.replace(/\D/g, ""),
          };
          await update(ref(db, `users/${me.sabun}`), newData);
          onSaved(newData);
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
          setBusy(false);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onCancel}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">정보 수정</h2>
              <button className="modal-close" onClick={onCancel} aria-label="닫기">×</button>
            </div>
            <div className="modal-fields">
              <div className="field">
                <label>이름</label>
                <input value={name} onChange={e => setName(e.target.value)} />
              </div>
              <div className="field">
                <label>팀</label>
                <select value={team} onChange={e => setTeam(e.target.value)}>
                  {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="field">
                <label>입사일 (YYYYMMDD)</label>
                <input
                  type="tel"
                  inputMode="numeric"
                  value={hireDate}
                  onChange={e => setHireDate(formatHireDateInput(e.target.value))}
                />
              </div>
              <div className="field">
                <label>전화번호</label>
                <input
                  type="tel"
                  inputMode="numeric"
                  value={phone}
                  onChange={e => setPhone(formatPhone(e.target.value))}
                />
              </div>
              {err && <div className="auth-error">{err}</div>}
            </div>
            <div className="modal-actions">
              <button className="btn-primary" onClick={save} disabled={busy}>
                {busy ? "저장 중…" : "저장"}
              </button>
              <button className="btn-ghost" onClick={onCancel}>취소</button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // <WhitelistAdmin> — admin 사번 전용 (Phase 4 정식 UI 전 임시)
    // ============================================================
    function WhitelistAdmin({ onClose }) {
      const [list, setList] = useState([]);
      const [bulkText, setBulkText] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        const r = ref(db, "whitelist");
        const unsub = onValue(r, snap => {
          const val = snap.val() || {};
          setList(Object.keys(val).sort());
        });
        return () => unsub();
      }, []);

      const addBulk = async () => {
        setErr("");
        const parts = bulkText.split(/[\s,;\n]+/).map(s => s.trim()).filter(Boolean);
        const invalid = parts.filter(s => !/^\d{5,6}$/.test(s));
        if (invalid.length) {
          setErr(`잘못된 사번: ${invalid.join(", ")}`);
          return;
        }
        if (!parts.length) {
          setErr("추가할 사번을 입력해 주세요.");
          return;
        }
        setBusy(true);
        try {
          const updates = {};
          parts.forEach(s => { updates[`whitelist/${s}`] = true; });
          await update(ref(db), updates);
          setBulkText("");
        } catch (e) {
          console.error(e);
          setErr("저장 중 오류가 발생했어요.");
        }
        setBusy(false);
      };

      const remove1 = async (sabun) => {
        if (!confirm(`${sabun} 화이트리스트에서 제거할까요? (이미 가입한 계정은 그대로 유지됨)`)) return;
        try {
          await remove(ref(db, `whitelist/${sabun}`));
        } catch (e) {
          console.error(e);
          alert("삭제 실패");
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">화이트리스트</h2>
              <button className="modal-close" onClick={onClose} aria-label="닫기">×</button>
            </div>

            <div className="duty-help" style={{ marginBottom: 14 }}>
              가입 가능한 사번 명단. 사번을 줄바꿈/콤마/공백으로 구분해 한꺼번에 추가할 수 있어요.
              <br />본인(<code>{ADMIN_SABUN}</code>)은 자동으로 항상 가입 가능.
            </div>

            <div className="field" style={{ marginBottom: 8 }}>
              <textarea
                className="duty-textarea"
                style={{ letterSpacing: 0, textTransform: "none" }}
                value={bulkText}
                onChange={e => setBulkText(e.target.value)}
                placeholder="123456&#10;234567&#10;345678&#10;..."
              />
            </div>
            {err && <div className="auth-error" style={{ marginBottom: 10 }}>{err}</div>}
            <button className="btn-primary" onClick={addBulk} disabled={busy} style={{ marginBottom: 20 }}>
              {busy ? "추가 중…" : "추가"}
            </button>

            <p className="menu-section-title">현재 명단 ({list.length}명)</p>
            {list.length === 0 ? (
              <p style={{ color: "var(--text-soft)", fontSize: 13, padding: "12px 0" }}>
                아직 등록된 사번이 없어요.
              </p>
            ) : (
              <div>
                {list.map(s => (
                  <div key={s} className="profile-row">
                    <span className="profile-value" style={{ fontFamily: "ui-monospace, monospace" }}>{s}</span>
                    <button
                      className="icon-btn"
                      onClick={() => remove1(s)}
                      style={{ color: "var(--c-closed)" }}
                      aria-label="삭제"
                    >×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // 마운트
    // ============================================================
    createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => {
          console.log("SW 등록 실패:", err);
        });
      });
    }
  </script>
</body>
</html>
